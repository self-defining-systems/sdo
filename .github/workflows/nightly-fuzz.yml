name: Nightly fuzz

# Coverage-guided campaigns compile instrumented packages and run for their
# whole budget, so they stay out of PR CI; every PR still replays each target's
# seed corpus through plain `go test`. Oversized atomic tests use separate
# cost-planned nightly jobs with the same prepared graph and unchanged caps.
# One job per fuzz module keeps a single
# instrumented compile per job and each job under the 5-minute fuzz cap.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
permissions:
  contents: read
env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2 -trimpath'
jobs:
  fuzz:
    name: fuzz (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: sdo/operator/sdk
            directory: sdo/operator/sdk
            targets: FuzzObjectRefParseFormat FuzzObjectRefTypedRoundTrip
          - module: sdo/operator
            directory: sdo/operator/outcome_derivation
            targets: FuzzControllerObservationBoundary
          - module: benchmarks/sregym/protocol/native_receipt_go
            directory: benchmarks/sregym/protocol/native_receipt_go
            targets: FuzzNativeReceiptBoundary
          - module: benchmarks/sregym/protocol/submission_go
            directory: benchmarks/sregym/protocol/submission_go
            targets: FuzzSubmissionPhaseBoundary
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Run bounded fuzz campaigns
        working-directory: ${{ matrix.directory }}
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          for target in $TARGETS; do
            timeout 120s go test -run '^$' -fuzz "^${target}\$" -fuzzminimizetime=1s -fuzztime=30s -parallel=2 -timeout=2m .
          done

  prepare-go:
    name: prepare shared Go builds (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
    outputs:
      schema_identity: ${{ steps.schema.outputs.value }}
      test_matrix: ${{ steps.cost-plan.outputs.matrix }}
      nightly_matrix: ${{ steps.cost-plan.outputs.nightly_matrix }}
      python_matrix: ${{ steps.python-plan.outputs.python_matrix }}
      python_nightly_matrix: ${{ steps.python-plan.outputs.python_nightly_matrix }}
    steps:
      - name: Select prepared compiler cache
        run: echo "GOCACHE=${{ runner.temp }}/sdo-go-build-${{ matrix.mode }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.8"
          cache: false
      - name: Publish the normal compiler and module caches
        if: matrix.mode == 'normal'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/sdo-go-build-normal
            ~/go/pkg/mod
            .fastloop/test-bin
          key: ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-
      - name: Publish the race compiler cache
        if: matrix.mode == 'race'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/sdo-go-build-race
          key: ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-
      - name: Compile dependency graphs outside operation timeouts
        run: bash scripts/prepare_go_ci.sh "${{ matrix.mode }}"

      - name: Plan capacity from compiled inventory and hosted costs
        if: matrix.mode == 'race'
        id: cost-plan
        run: |
          python3 scripts/go_cost_plan.py --prepared --output .fastloop/test-bin/go-test-plan.json | tee "$RUNNER_TEMP/cost-plan.log"
          grep -E '^(matrix|nightly_matrix)=' "$RUNNER_TEMP/cost-plan.log" >> "$GITHUB_OUTPUT"

      - name: Publish the exact race test plan
        if: matrix.mode == 'race'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled-go-test-plan
          path: .fastloop/test-bin/go-test-plan.json
          if-no-files-found: error
          retention-days: 1

      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        if: matrix.mode == 'normal'
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - name: Collect all Go-backed Python contracts once
        if: matrix.mode == 'normal'
        id: python-plan
        run: |
          uv sync --locked --all-extras
          uv run python scripts/init_test_prereqs.py
          uv run python scripts/python_cost_plan.py --output .fastloop/test-bin/python-test-plan.json | tee "$RUNNER_TEMP/python-plan.log"
          grep -E '^python_(nightly_)?matrix=' "$RUNNER_TEMP/python-plan.log" >> "$GITHUB_OUTPUT"
      - name: Publish the exact Python integration plan
        if: matrix.mode == 'normal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled-python-test-plan
          path: .fastloop/test-bin/python-test-plan.json
          if-no-files-found: error
          retention-days: 1

      - name: Keep only the source-bound test executable
        if: matrix.mode == 'normal'
        run: |
          current="$(python3 scripts/operator_test_binary.py)"
          test -f "$current"
          find .fastloop/test-bin -maxdepth 1 -type f -name 'sdo-operator-*' ! -samefile "$current" -delete

      - name: Bind image schema to the compiled source
        if: matrix.mode == 'normal'
        id: schema
        run: |
          identity="$(cd sdo/operator && go run ./cmd/sdo-operator schema-identity)"
          echo "value=${identity}" >> "$GITHUB_OUTPUT"

  overflow:
    name: oversized tests (${{ matrix.cost_scope }})
    needs: prepare-go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-go.outputs.nightly_matrix) }}
    steps:
      - name: Select prepared compiler cache
        run: echo "GOCACHE=${{ runner.temp }}/sdo-go-build-normal" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A mutable PR merge ref can change after a retarget; test this event.
          ref: ${{ github.sha }}
      - name: Restore the prepared normal and race build graph
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/sdo-go-build-normal
            ~/go/pkg/mod
            .fastloop/test-bin
          key: ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Restore the prepared race build graph
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/sdo-go-build-race
          key: ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Combine prepared compiler entries without replacing existing files
        run: bash scripts/merge_go_ci_caches.sh '${{ runner.temp }}/sdo-go-build-normal' '${{ runner.temp }}/sdo-go-build-race'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.8"
          cache: false
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        if: matrix.cost_scope == 'runtime'
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
        if: matrix.cost_scope == 'runtime'
      - name: Download the exact race test plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compiled-go-test-plan
          path: .fastloop/test-bin
      - name: Run oversized tests under the existing nightly rule
        run: python3 scripts/test_${{ matrix.cost_scope }}_shard.py nightly --plan .fastloop/test-bin/go-test-plan.json --nightly-index '${{ matrix.nightly_index }}'

  python-overflow:
    name: oversized Python contracts (${{ matrix.bin }})
    needs: prepare-go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-go.outputs.python_nightly_matrix) }}
    steps:
      - name: Select prepared compiler cache
        run: echo "GOCACHE=${{ runner.temp }}/sdo-go-build-normal" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Restore the prepared normal and race build graph
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/sdo-go-build-normal
            ~/go/pkg/mod
            .fastloop/test-bin
          key: ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.8"
          cache: false
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Download the collected Python integration plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compiled-python-test-plan
          path: .fastloop/test-bin
      - name: Run oversized Python contracts
        run: bash scripts/test_go_integration.sh nightly .fastloop/test-bin/python-test-plan.json --nightly-index '${{ matrix.bin }}'
