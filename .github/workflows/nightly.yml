name: Nightly CI

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: "Run only the controller end-to-end job, for this scenario (scenario1, scenario2, api-errors, hung-agent, all); empty runs everything"
        required: false
        default: ""

permissions:
  contents: read

# Full integration parity checks use production compiler source locations.
# PR-only trimpath caching can reuse vet output from an older isolated path.
jobs:
  go:
    name: race suite, slow tests and fuzz
    if: inputs.scenario == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.8"
          cache: false
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-go-${{ runner.os }}-${{ runner.arch }}-operator-1.26.8-
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Install bubblewrap for agent-script tests
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc true
      - name: Cache the envtest kube-apiserver and etcd
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: ~/.cache/sdo-envtest
          key: envtest-assets-1.34.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned envtest binaries (checksum-verified, retried; a cache hit skips it)
        run: echo "KUBEBUILDER_ASSETS=$(bash scripts/install_envtest.sh)" >> "$GITHUB_ENV"
      - name: Every Go test under the race detector, without -short, with full simulation seeds
        run: bash scripts/test_go_ci.sh nightly
      - name: Bounded fuzz campaigns (seed cases also run on every PR)
        run: |
          (cd benchmarks/sregym/protocol/native_receipt_go && timeout 300s go test -run '^$' -fuzz '^FuzzNativeReceiptBoundary$' -fuzzminimizetime=1s -fuzztime=30s -parallel=2 -timeout=2m .)
          (cd benchmarks/sregym/protocol/submission_go && timeout 300s go test -run '^$' -fuzz '^FuzzSubmissionPhaseBoundary$' -fuzzminimizetime=1s -fuzztime=30s -parallel=2 -timeout=2m .)

  controller-e2e:
    permissions:
      actions: write
      contents: read
    name: controller end-to-end (envtest, fake kubelet, scripted agents)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.8"
          cache: false
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/sdo-e2e
          key: ci-controller-e2e-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-controller-e2e-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-controller-e2e-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - name: Install bubblewrap and the envtest binaries (kube-apiserver and etcd)
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc true
          echo "KUBEBUILDER_ASSETS=$(bash scripts/install_envtest.sh)" >> "$GITHUB_ENV"
      - name: Controller end to end (first incident and repeat, then faults)
        env:
          SCENARIO: ${{ inputs.scenario || 'all' }}
        run: bash scripts/test_controller_e2e.sh "$SCENARIO"
      - name: Save the end-to-end cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/sdo-e2e
          key: ci-controller-e2e-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
      - name: Prune the superseded end-to-end caches
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci_cache_budget.py prune ci-controller-e2e-v1
      # A failed world keeps its run directory (pod logs, termination messages); a hosted runner
      # discards it, so a failure that only happens there could not be diagnosed.
      - name: Keep the failed worlds' run directories
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-run-directories
          path: |
            ${{ runner.temp }}/sdo-e2e-*
            /tmp/sdo-e2e-*
          if-no-files-found: ignore
          retention-days: 3

  python:
    name: slow Python suites
    if: inputs.scenario == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.8"
          cache: false
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-go-${{ runner.os }}-${{ runner.arch }}-operator-1.26.8-
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Install bubblewrap for agent-script tests
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc true
      - name: Check out the SREGym harness and its nested inputs
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          python3 scripts/init_test_prereqs.py
      - name: Slow Python suites moved out of pull-request CI
        run: |
          uv run pytest -n 2 --durations=30 \
            tests/unit/benchmarks/sregym/fastloop/test_recorded_reflection_stage.py \
            tests/unit/benchmarks/sregym/fastloop/test_generated_worker_contract.py \
            tests/unit/sdo/agents/responder/test_reflection_final_check.py \
            tests/unit/benchmarks/sregym/assurance/test_script_execution.py \
            tests/unit/benchmarks/sregym/fastloop/test_sdo3_s3a_contracts.py \
            tests/unit/benchmarks/sregym/fastloop/test_fastloop_fault_tracker.py \
            tests/unit/benchmarks/sregym/fastloop/test_eval_guards.py \
            tests/unit/benchmarks/sregym/fastloop/test_fastloop_composite.py \
            tests/unit/benchmarks/sregym/adapter/test_deadline_owner.py \
            tests/unit/benchmarks/sregym/test_agent_script.py \
            tests/unit/benchmarks/sregym/fastloop/test_replay.py \
            tests/unit/benchmarks/sregym/fastloop/test_sdo3_descriptions.py \
            tests/unit/benchmarks/sregym/fastloop/test_attach_recovery.py \
            tests/unit/benchmarks/sregym/fastloop/test_responder_script.py \
            tests/unit/libs/agent_cli/test_structured.py \
            tests/unit/benchmarks/sregym/adapter/test_reflection_drain.py \
            tests/unit/libs/agent_cli/test_provider_capacity.py \
            tests/unit/benchmarks/sregym/fastloop/test_phase4_probes.py \
            tests/unit/libs/agent_cli/test_claude_accounts.py \
            tests/unit/benchmarks/sregym/test_memory_cli.py \
            tests/unit/benchmarks/sregym/fastloop/test_shared_image_registry.py \
            tests/unit/benchmarks/sregym/fastloop/test_fake_kube.py \
            tests/unit/benchmarks/sregym/adapter/test_processes.py \
            tests/unit/sdo/agents/lifecycle/test_supplied_reads.py \
            tests/unit/benchmarks/sregym/fastloop/test_sequence_scripted.py \
            tests/unit/benchmarks/sregym/fastloop/test_host_limits.py \
            tests/unit/benchmarks/sregym/fastloop/test_clean_start_real_wrk2.py \
            tests/unit/benchmarks/sregym/fastloop/test_fastloop_hermetic_program_reuse.py \
            tests/unit/benchmarks/sregym/fastloop/test_request_envelope_real_go.py \
            tests/unit/benchmarks/sregym/fastloop/test_idempotent_helm_real_sregym.py
      - name: Property tests at full example counts (pull requests sample fewer)
        env:
          SDO_PROPERTY_EXAMPLES: "300"
          SDO_PROPERTY_FULL: "1"
        run: |
          uv run pytest -n 2 \
            "tests/unit/sdo/agents/responder/test_recorded_actions.py::test_arbitrary_command_text_round_trips_through_the_recorded_receipts" \
            "tests/unit/benchmarks/sregym/fastloop/test_runtime_fault_probes.py::test_private_transport_errors_are_sanitized_for_every_operation"
      - name: Quarantined Python tests (pull requests skip them; see .github/ci_quarantine.json)
        run: |
          mapfile -t ids < <(python3 scripts/ci_quarantine.py pytest-ids)
          if [[ ${#ids[@]} -gt 0 && -n "${ids[0]}" ]]; then
            uv run pytest -n 2 "${ids[@]}"
          fi

  images:
    name: controller images
    if: inputs.scenario == ''
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A mutable PR merge ref can change after a retarget; test this event.
          ref: ${{ github.sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.8"
          cache: false
      - name: Cache Go builds for image preflight
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-go-${{ runner.os }}-${{ runner.arch }}-images-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-go-${{ runner.os }}-${{ runner.arch }}-images-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-go-${{ runner.os }}-${{ runner.arch }}-operator-1.26.8-${{ hashFiles('**/go.sum') }}-
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Select affected images
        id: image-inputs
        env:
          CONTROLLER: true
          RESPONDER: true
          BENCHMARK: true
        run: |
          images=()
          for image in controller responder benchmark; do
            variable="${image^^}"
            if [ "${!variable}" = "true" ]; then
              images+=("${image}")
            fi
          done
          echo "images=${images[*]}" >> "${GITHUB_OUTPUT}"
          (IFS=,; echo "targets=${images[*]}") >> "${GITHUB_OUTPUT}"
      - name: Build affected images with persistent layers
        uses: docker/bake-action@3acf805d94d93a86cce4ca44798a76464a75b88c # v6.9.0
        with:
          source: .
          files: scripts/sdo-images.hcl
          targets: ${{ steps.image-inputs.outputs.targets }}
          load: true
          set: |
            controller.cache-from=type=gha,scope=sdo-controller
            controller.cache-to=type=gha,scope=sdo-controller,mode=min
            responder.cache-from=type=gha,scope=sdo-responder
            responder.cache-to=type=gha,scope=sdo-responder,mode=min
            benchmark.cache-from=type=gha,scope=sdo-benchmark
            benchmark.cache-to=type=gha,scope=sdo-benchmark,mode=min
      - name: Smoke and probe every affected image
        env:
          SDO_IMAGES: ${{ steps.image-inputs.outputs.images }}
          SDO_SKIP_IMAGE_BUILD: "1"
          SDO_IMAGE_PREFLIGHT: "1"
        run: ./scripts/build_sdo_images.sh
      - name: Confirm the responder image carries no SREGym answer key
        # Belt-and-braces over tests/unit/sdo/operator/test_dockerfile_benchmark_scope.py,
        # which checks the Dockerfile COPY lines statically: this lists the files an
        # actually built image carries, so a leak would fail here even if some other
        # build step (a base image, a stray COPY --from) reintroduced one.
        run: |
          files="$(docker run --rm --entrypoint find sdo-sregym-responder:v0.1.0 /opt/sdo/benchmarks -type f)"
          echo "${files}"
          # The benchmark worker carries these recording utilities and byte budgets, which contain
          # no fault catalog or oracle data. All other fastloop paths stay forbidden.
          recording_modules='(__init__|model_recording|file_edits|recording_worker|checkpoint_limits)'
          recording_paths="^/opt/sdo/benchmarks/sregym/fastloop/(${recording_modules}\.py|__pycache__/${recording_modules}\.cpython-[0-9]+(\.opt-[0-9]+)?\.pyc)$"
          leaked="$(echo "${files}" | grep -E '/(experiments|assurance|fastloop|analysis|runner|agents)/|/docs/|/tests/' | grep -Ev "${recording_paths}" || true)"
          if [ -n "${leaked}" ]; then
            echo "answer-key paths present in sdo-sregym-responder:v0.1.0:" >&2
            echo "${leaked}" >&2
            exit 1
          fi

