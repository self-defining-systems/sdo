name: CI health

# GitHub delays or drops scheduled runs on a busy repository (this one saw no hourly run in
# three hours, and the nightly started about seven hours late), so the alarm also runs after
# every main CI run, which is the moment the numbers change.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  health:
    name: CI duration and queue budgets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compute p50/p95 job durations, queue latency and run outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_health.py
      - name: Actions cache budget (alarm at 80% of the repository limit, per-family budgets)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_cache_budget.py check
