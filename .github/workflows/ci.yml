name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SDO_PYTEST_WORKERS: "2"
  # Generated workspaces have different absolute paths; trimpath permits reuse
  # of identical SDK/runtime compilation across those isolated checkouts.
  GOFLAGS: "-trimpath"

jobs:
  checks:
    name: checks and Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.8"
          cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-go-${{ runner.os }}-${{ runner.arch }}-operator-1.26.8-
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Check out optional harness fixtures
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 third_party/sregym
      - name: Cache pinned proto tools
        id: proto-tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/go/bin
          key: proto-tools-${{ runner.os }}-${{ runner.arch }}-buf1.73.0-go1.26.8-protobuf1.36.12
      - name: Install pinned proto tools
        if: steps.proto-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(go env GOPATH)/bin"
          curl --fail --location --retry 3 https://github.com/bufbuild/buf/releases/download/v1.73.0/buf-Linux-x86_64 -o /tmp/buf
          install -m 755 /tmp/buf "$(go env GOPATH)/bin/buf"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      # check_errors already includes types, architecture, proto and Go mains.
      - name: Static contracts and Python unit tests
        run: |
          bash scripts/format_code.sh --check
          bash scripts/check_errors.sh > /tmp/checks.log 2>&1 &
          checks=$!
          status=0
          bash scripts/test_python.sh --durations=30 || status=1
          wait "$checks" || status=1
          cat /tmp/checks.log
          exit "$status"

  tests:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.8"
          cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-go-${{ runner.os }}-${{ runner.arch }}-operator-1.26.8-
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: All Go modules (one shared compiler and module cache)
        run: bash scripts/test_go_ci.sh

  required-pr-ci:
    name: Required PR CI
    needs: [checks, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both jobs to succeed
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
        run: test "$CHECKS" = success && test "$TESTS" = success
