name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A push to main is never cancelled: every merged commit is tested in full and
# refreshes the caches. Each gets its own group; PRs share one per ref and
# cancel their superseded runs.
concurrency:
  group: ${{ github.event_name == 'push' && format('ci-push-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Unbuffered output keeps step timestamps in the hosted log honest.
  PYTHONUNBUFFERED: "1"
  SDO_PYTEST_WORKERS: "4"
  # Generated workspaces have different absolute paths; trimpath permits reuse
  # of identical SDK/runtime compilation across those isolated checkouts.
  GOFLAGS: "-trimpath"

jobs:
  checks:
    permissions:
      actions: write
      contents: read
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.8"
          cache: false
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-
            ci-tests-v2-${{ runner.os }}-${{ runner.arch }}-1.26.8-
            ci-go-${{ runner.os }}-${{ runner.arch }}-operator-1.26.8-
      - name: Age the restored compiler entries so the save keeps only those this run uses
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci_go_cache.sh mark
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
          prune-cache: false
      - run: uv sync --locked --all-extras
      - name: Check out the SREGym harness and its nested inputs
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          python3 scripts/init_test_prereqs.py
      - name: Cache pinned proto tools
        id: proto-tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/go/bin
            ~/.cache/sdo-tools
          key: proto-lint-tools-v2-golangci2.11.4-${{ runner.os }}-${{ runner.arch }}-buf1.73.0-go1.26.8-protobuf1.36.12-protoc33.4-grpc1.6.2
      - name: Install pinned proto tools
        if: steps.proto-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(go env GOPATH)/bin"
          curl --fail --location --retry 3 https://github.com/bufbuild/buf/releases/download/v1.73.0/buf-Linux-x86_64 -o /tmp/buf
          install -m 755 /tmp/buf "$(go env GOPATH)/bin/buf"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          curl --fail --location --retry 3 https://github.com/protocolbuffers/protobuf/releases/download/v33.4/protoc-33.4-linux-x86_64.zip -o /tmp/protoc.zip
          unzip -j /tmp/protoc.zip bin/protoc -d "$(go env GOPATH)/bin"
      # check_errors already includes types, architecture, proto and Go mains.
      # check_errors already includes types, architecture, proto and Go mains.
      # Its Python-suite mode leaves tests that the sharded Python jobs run to them.
      - name: Static contracts
        run: |
          bash ./scripts/format_code.sh --check
          bash ./scripts/check_errors.sh --python-suite

      # `mark` (after the restore) ages every compiler entry, the run refreshes the ones it
      # reads, and `trim` drops the rest, so a saved cache holds one run's live entries and
      # not the generations of every package that earlier merges changed.
      - name: Drop compiler entries this run did not use, and module zip archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci_go_cache.sh trim
      - name: Check the cache size before saving
        id: cache-size
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci_cache_guard.sh "$(python3 -c 'import json;print(json.load(open(".github/ci_budgets.json"))["cache_limit_mb"])')" ~/.cache/go-build ~/go/pkg/mod
      - name: Save shared Go cache on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-size.outputs.oversize != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
      - name: Prune the superseded caches of this family
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci_cache_budget.py prune "ci-shared-v1-${{ runner.os }}-${{ runner.arch }}"
      - name: Fail on an oversize cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-size.outputs.oversize == 'true'
        run: exit 1

  python:
    permissions:
      actions: write
      contents: read
    name: Python tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [core, adapter, fastloop]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.8"
          cache: false
      # Pull requests run only what their changes can affect; the merge queue and main
      # run everything (scripts/ci_select.py, rules in .github/ci_selection.json).
      - name: Select the tests this change can affect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 scripts/ci_select.py plan --event "$EVENT" --out "$RUNNER_TEMP/plan.json" >/dev/null
          echo "SDO_CI_PLAN=$RUNNER_TEMP/plan.json" >> "$GITHUB_ENV"
          python3 scripts/ci_select.py skip --plan "$RUNNER_TEMP/plan.json" --kind python --shard ${{ matrix.shard }} >> "$GITHUB_ENV"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        if: env.SDO_CI_SKIP != 'true'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-py-v3-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-py-v3-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ matrix.shard }}-
            ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-
            ci-tests-v2-${{ runner.os }}-${{ runner.arch }}-1.26.8-
            ci-go-${{ runner.os }}-${{ runner.arch }}-operator-1.26.8-
      - name: Age the restored compiler entries so the save keeps only those this run uses
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci_go_cache.sh mark
      # The tests that run the Go operator share one binary built from this checkout. Build it
      # here, beside the dependency installs, so no test pays (or is charged for) the link; the
      # step before pytest waits for it.
      - name: Start building the operator test binary
        if: env.SDO_CI_SKIP != 'true'
        run: |
          setsid nohup bash -c 'python3 scripts/operator_test_binary.py > "$RUNNER_TEMP/operator-bin.path" 2> "$RUNNER_TEMP/operator-bin.log"; echo $? > "$RUNNER_TEMP/operator-bin.status"' > /dev/null 2>&1 &
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        if: env.SDO_CI_SKIP != 'true'
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
          prune-cache: false
      - run: uv sync --locked --all-extras
        if: env.SDO_CI_SKIP != 'true'
      - name: Check out the SREGym harness and its nested inputs
        if: env.SDO_CI_SKIP != 'true'
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          python3 scripts/init_test_prereqs.py
      # Agent-script stand-in turns sandbox their commands with bubblewrap, as
      # real workspace-write turns are confined. Ubuntu 24.04 runners restrict
      # unprivileged user namespaces through AppArmor; lift that for bwrap.
      - name: Install bubblewrap for agent-script tests
        if: env.SDO_CI_SKIP != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc true
      - name: Wait for the operator test binary
        if: env.SDO_CI_SKIP != 'true'
        run: |
          until [[ -f "$RUNNER_TEMP/operator-bin.status" ]]; do sleep 1; done
          if [[ "$(cat "$RUNNER_TEMP/operator-bin.status")" != 0 ]]; then
              cat "$RUNNER_TEMP/operator-bin.log"
              exit 1
          fi
          echo "SDO_OPERATOR_BIN=$(cat "$RUNNER_TEMP/operator-bin.path")" >> "$GITHUB_ENV"
          echo "SDO_SKIP_OPERATOR_PREBUILD=1" >> "$GITHUB_ENV"
      - name: Python unit tests (${{ matrix.shard }} shard)
        if: env.SDO_CI_SKIP != 'true'
        env:
          SDO_PYTEST_SHARD: ${{ matrix.shard }}
        run: |
          SDO_PYTEST_LOG="$RUNNER_TEMP/pytest.log" bash ./scripts/test_python.sh --durations=30 \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_recorded_reflection_stage.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_generated_worker_contract.py \
            --ignore=tests/unit/sdo/agents/responder/test_reflection_final_check.py \
            --ignore=tests/unit/benchmarks/sregym/assurance/test_script_execution.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_sdo3_s3a_contracts.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_fastloop_fault_tracker.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_eval_guards.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_fastloop_composite.py \
            --ignore=tests/unit/benchmarks/sregym/adapter/test_deadline_owner.py \
            --ignore=tests/unit/benchmarks/sregym/test_agent_script.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_replay.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_sdo3_descriptions.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_attach_recovery.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_responder_script.py \
            --ignore=tests/unit/libs/agent_cli/test_structured.py \
            --ignore=tests/unit/benchmarks/sregym/adapter/test_reflection_drain.py \
            --ignore=tests/unit/libs/agent_cli/test_provider_capacity.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_phase4_probes.py \
            --ignore=tests/unit/libs/agent_cli/test_claude_accounts.py \
            --ignore=tests/unit/benchmarks/sregym/test_memory_cli.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_shared_image_registry.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_fake_kube.py \
            --ignore=tests/unit/benchmarks/sregym/adapter/test_processes.py \
            --ignore=tests/unit/sdo/agents/lifecycle/test_supplied_reads.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_sequence_scripted.py \
            --ignore=tests/unit/benchmarks/sregym/fastloop/test_host_limits.py
      - name: PR-tier tests stay under the slow-test budget
        if: env.SDO_CI_SKIP != 'true'
        run: python3 scripts/check_slow_tests.py --pytest "$RUNNER_TEMP/pytest.log"
      - name: Report tests this change's pull request run skipped
        if: failure() && github.event_name != 'pull_request'
        run: python3 scripts/ci_select.py misses --pytest-log "$RUNNER_TEMP/pytest.log" | tee -a "$GITHUB_STEP_SUMMARY"

      # Partial runs publish nothing; the floor is enforced on full runs (queue and main).
      - name: Publish this shard's coverage data
        if: env.SDO_CI_MODE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Drop compiler entries this run did not use, and module zip archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci_go_cache.sh trim
      - name: Check the cache size before saving
        id: cache-size
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci_cache_guard.sh "$(python3 -c 'import json;print(json.load(open(".github/ci_budgets.json"))["cache_limit_mb"])')" ~/.cache/go-build ~/go/pkg/mod
      - name: Save this shard's Go cache on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-size.outputs.oversize != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-py-v3-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
      - name: Prune the superseded caches of this family
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci_cache_budget.py prune "ci-py-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}"
      - name: Fail on an oversize cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-size.outputs.oversize == 'true'
        run: exit 1

  tests:
    permissions:
      actions: write
      contents: read
    name: Go tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [validate, rest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.8"
          cache: false
      # Pull requests run only what their changes can affect; the merge queue and main
      # run everything (scripts/ci_select.py, rules in .github/ci_selection.json).
      - name: Select the tests this change can affect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 scripts/ci_select.py plan --event "$EVENT" --out "$RUNNER_TEMP/plan.json" >/dev/null
          echo "SDO_CI_PLAN=$RUNNER_TEMP/plan.json" >> "$GITHUB_ENV"
          python3 scripts/ci_select.py skip --plan "$RUNNER_TEMP/plan.json" --kind go --shard ${{ matrix.shard }} >> "$GITHUB_ENV"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        if: env.SDO_CI_SKIP != 'true'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-tests-v2-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-tests-v2-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ matrix.shard }}-
            ci-tests-v2-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-tests-v2-${{ runner.os }}-${{ runner.arch }}-1.26.8-
            ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-shared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.8-
            ci-go-${{ runner.os }}-${{ runner.arch }}-operator-1.26.8-
      - name: Age the restored compiler entries so the save keeps only those this run uses
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci_go_cache.sh mark
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        if: env.SDO_CI_SKIP != 'true'
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
        if: env.SDO_CI_SKIP != 'true'
      # TestKubeConformance starts a real kube-apiserver and etcd. The key names
      # the pinned Kubernetes version (envtestio.KubernetesVersion); a miss
      # runs scripts/install_envtest.sh (pinned release, SHA-512 checked) and this
      # step saves the result; tests never download.
      - name: Cache the envtest kube-apiserver and etcd
        if: env.SDO_CI_SKIP != 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/sdo-envtest
          key: envtest-assets-1.34.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned envtest binaries (checksum-verified, retried; a cache hit skips it)
        if: env.SDO_CI_SKIP != 'true'
        run: echo "KUBEBUILDER_ASSETS=$(bash scripts/install_envtest.sh)" >> "$GITHUB_ENV"
      - name: Go modules, ${{ matrix.shard }} shard (shared compiler and module cache)
        if: env.SDO_CI_SKIP != 'true'
        env:
          SDO_GO_TEST_LOG: ${{ runner.temp }}/go-test.json
        run: bash ./scripts/test_go_ci.sh pr ${{ matrix.shard }}
      - name: PR-tier tests stay under the slow-test budget
        if: env.SDO_CI_SKIP != 'true'
        run: python3 scripts/check_slow_tests.py --go "$RUNNER_TEMP/go-test.json"

      - name: Report tests this change's pull request run skipped
        if: failure() && github.event_name != 'pull_request'
        run: python3 scripts/ci_select.py misses --go-log "$RUNNER_TEMP/go-test.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # `mark` (after the restore) ages every compiler entry, the run refreshes the ones it
      # reads, and `trim` drops the rest, so a saved cache holds one run's live entries and
      # not the generations of every package that earlier merges changed.
      - name: Drop compiler entries this run did not use, and module zip archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci_go_cache.sh trim
      - name: Check the cache size before saving
        id: cache-size
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci_cache_guard.sh "$(python3 -c 'import json;print(json.load(open(".github/ci_budgets.json"))["cache_limit_mb"])')" ~/.cache/go-build ~/go/pkg/mod
      - name: Save shared Go cache on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-size.outputs.oversize != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-tests-v2-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
      - name: Prune the superseded caches of this family
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci_cache_budget.py prune "ci-tests-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}"
      - name: Fail on an oversize cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-size.outputs.oversize == 'true'
        run: exit 1

  required-pr-ci:
    name: Required PR CI
    needs: [checks, python, tests]
    # always(): the gate must report on every run. A run that concurrency cancelled
    # because a newer run exists for the same commit is the exception, decided below.
    if: always()
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      # Per-commit policy: the merge queue squashes the PR into one commit, so only
      # pull_request events (which see each commit) can be checked.
      - name: Enforce prompt budget changes in every commit
        if: github.event_name == 'pull_request'
        env:
          BUDGET_BASE: ${{ github.event.pull_request.base.sha }}
          BUDGET_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_prompt_budgets.py --base "$BUDGET_BASE" --head "$BUDGET_HEAD"
      # A stack restack force-pushes head and base in one second: two runs start for
      # one commit and concurrency cancels the older, whose cancelled jobs would
      # leave a failing required check beside the newer run's verdict.
      - name: Detect a run superseded by a newer run for this commit
        id: superseded
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS_URL: repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=pull_request&head_sha=${{ github.event.pull_request.head.sha }}&per_page=100
          RUN_ID: ${{ github.run_id }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULTS: ${{ needs.checks.result }} ${{ needs.python.result }} ${{ needs.tests.result }}
        run: |
          # shellcheck disable=SC2086 # RESULTS is deliberately split into words
          gh api "$RUNS_URL" | python3 scripts/ci_superseded.py "$RUN_ID" "$PULL_REQUEST" "$HEAD_SHA" $RESULTS | sed 's/^/value=/' >> "$GITHUB_OUTPUT"
      - name: Require every job to succeed
        env:
          CHECKS: ${{ needs.checks.result }}
          PYTHON: ${{ needs.python.result }}
          TESTS: ${{ needs.tests.result }}
          SUPERSEDED: ${{ steps.superseded.outputs.value }}
        run: |
          if [ "$SUPERSEDED" = true ]; then
              echo "::notice::Superseded by a newer run for this commit; that run reports the verdict."
              exit 0
          fi
          test "$CHECKS" = success && test "$PYTHON" = success && test "$TESTS" = success
      # Each Python shard measures its own files; the gate is over their union.
      - name: Download the Python shards' coverage data
        if: needs.python.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage-data
      - name: Enforce the combined Python coverage floor
        if: needs.python.result == 'success'
        run: |
          if ! compgen -G 'coverage-data/*/.coverage' > /dev/null; then
              echo "Partial pull request run: the coverage floor is enforced on the merge queue and main."
              exit 0
          fi
          python3 -m pip install --quiet coverage==7.13.2
          python3 -m coverage combine coverage-data/*/.coverage
          python3 -m coverage report
