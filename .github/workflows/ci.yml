name: CI

on:
  # Hosted caches saved on refs/pull/N are private to that PR. A PR can also
  # restore its base branch's caches, so pushes to every branch PRs target are
  # the only runs that save the large prepared Go builds (about 1.6 GB each);
  # PR runs restore the newest one and save only a small delta of what they
  # compiled on top of it. Saving a full build per PR passed the 10 GB
  # repository cap with a few concurrent PRs and evicted entries mid-run.
  push:
    branches: [main, "vic-lsh/dev/**"]
  pull_request:
  # GitHub merge queue: CI must report on the queue's temporary
  # gh-readonly-queue/... branch or the queue waits until it times out. Every
  # fixed regression jobs run in the queue so
  # the real merge commit is validated against the latest main.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled base-branch run saves no cache; only PR runs replace each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a commit (the tag it was taken from is in the
# comment), and uv installs exactly uv.lock.
env:
  # Bound parent and nested Go compilers on the two-core hosted runner.
  GOMAXPROCS: "2"
  GOFLAGS: "-p=2 -trimpath"
  SDO_PYTEST_WORKERS: "2"

jobs:
  prepare-go:
    name: prepare shared Go builds (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
    outputs:
      schema_identity: ${{ steps.schema.outputs.value }}
    steps:
      - name: Select prepared compiler cache
        run: echo "GOCACHE=${{ runner.temp }}/sdo-go-build-${{ matrix.mode }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.8"
          cache: false
      - name: Publish the normal compiler and module caches
        if: matrix.mode == 'normal' && github.event_name == 'push'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/sdo-go-build-normal
            ~/go/pkg/mod
            .fastloop/test-bin
          key: ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-
      - name: Publish the race compiler cache
        if: matrix.mode == 'race' && github.event_name == 'push'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/sdo-go-build-race
          key: ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-
      - name: Restore the base branch's normal compiler and module caches
        if: matrix.mode == 'normal' && github.event_name != 'push'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/sdo-go-build-normal
            ~/go/pkg/mod
            .fastloop/test-bin
          key: ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-
      - name: Remember what the base normal build holds
        if: matrix.mode == 'normal' && github.event_name != 'push'
        id: snapshot-normal
        run: python3 scripts/go_ci_cache_delta.py snapshot --manifest "${{ runner.temp }}/base-normal.manifest" gocache=${{ runner.temp }}/sdo-go-build-normal mod=$HOME/go/pkg/mod test-bin=.fastloop/test-bin@content
      - name: Resume from this PR's earlier normal delta
        if: matrix.mode == 'normal' && github.event_name != 'push'
        id: resume-normal
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/sdo-go-delta-normal
          key: ci-delta-v1-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-delta-v1-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
      - name: Apply this PR's earlier normal delta
        if: matrix.mode == 'normal' && github.event_name != 'push' && steps.resume-normal.outputs.cache-matched-key != ''
        run: python3 scripts/go_ci_cache_delta.py apply --delta "${{ runner.temp }}/sdo-go-delta-normal" gocache=${{ runner.temp }}/sdo-go-build-normal mod=$HOME/go/pkg/mod test-bin=.fastloop/test-bin@content
      - name: Restore the base branch's race compiler cache
        if: matrix.mode == 'race' && github.event_name != 'push'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/sdo-go-build-race
          key: ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-
      - name: Remember what the base race build holds
        if: matrix.mode == 'race' && github.event_name != 'push'
        id: snapshot-race
        run: python3 scripts/go_ci_cache_delta.py snapshot --manifest "${{ runner.temp }}/base-race.manifest" gocache=${{ runner.temp }}/sdo-go-build-race
      - name: Resume from this PR's earlier race delta
        if: matrix.mode == 'race' && github.event_name != 'push'
        id: resume-race
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/sdo-go-delta-race
          key: ci-delta-v1-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-delta-v1-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
      - name: Apply this PR's earlier race delta
        if: matrix.mode == 'race' && github.event_name != 'push' && steps.resume-race.outputs.cache-matched-key != ''
        run: python3 scripts/go_ci_cache_delta.py apply --delta "${{ runner.temp }}/sdo-go-delta-race" gocache=${{ runner.temp }}/sdo-go-build-race
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        if: matrix.mode == 'normal'
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - name: Enforce standing PR execution limits
        if: matrix.mode == 'normal'
        run: |
          uv sync --locked --all-extras
          uv run python scripts/check_ci_budget.py
      - name: Compile dependency graphs outside operation timeouts
        id: compile
        # A cold compile (160-265 s on this runner) stops here, not at the job
        # deadline, so the delta it reached is saved below and a rerun resumes
        # from it. GNU timeout signals its whole process group: a step timeout
        # leaves compilers writing the cache while it is archived.
        run: timeout --kill-after=5s 170s bash scripts/prepare_go_ci.sh "${{ matrix.mode }}"

      - name: Plan capacity from compiled inventory and hosted costs
        if: matrix.mode == 'race'
        id: cost-plan
        run: python3 scripts/go_cost_plan.py --prepared --include-dedicated --inventory-only --output .fastloop/test-bin/go-test-plan.json

      - name: Publish the exact race test plan
        if: matrix.mode == 'race'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled-go-test-plan
          path: .fastloop/test-bin/go-test-plan.json
          if-no-files-found: error
          retention-days: 1

      - name: Collect all Go-backed Python contracts once
        if: matrix.mode == 'normal'
        id: python-plan
        run: |
          uv run python scripts/init_test_prereqs.py
          uv run python scripts/python_cost_plan.py --inventory-only --output .fastloop/test-bin/python-test-plan.json
      - name: Publish the exact Python integration plan
        if: matrix.mode == 'normal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled-python-test-plan
          path: .fastloop/test-bin/python-test-plan.json
          if-no-files-found: error
          retention-days: 1

      - name: Keep only the source-bound test executable
        if: matrix.mode == 'normal'
        run: |
          current="$(python3 scripts/operator_test_binary.py)"
          test -f "$current"
          find .fastloop/test-bin -maxdepth 1 -type f -name 'sdo-operator-*' ! -samefile "$current" -delete

      - name: Bind image schema to the compiled source
        if: matrix.mode == 'normal'
        id: schema
        run: |
          identity="$(cd sdo/operator && go run ./cmd/sdo-operator schema-identity)"
          echo "value=${identity}" >> "$GITHUB_OUTPUT"

      - name: Export what this PR added to the base normal build
        if: always() && matrix.mode == 'normal' && github.event_name != 'push' && steps.snapshot-normal.outcome == 'success'
        id: export-normal
        run: python3 scripts/go_ci_cache_delta.py export --manifest "${{ runner.temp }}/base-normal.manifest" --out "${{ runner.temp }}/sdo-go-delta-normal" --max-bytes 524288000 gocache=${{ runner.temp }}/sdo-go-build-normal mod=$HOME/go/pkg/mod test-bin=.fastloop/test-bin@content
      - name: Save the normal delta (a failed run saves its progress for the rerun)
        if: always() && matrix.mode == 'normal' && github.event_name != 'push' && steps.export-normal.outputs.saved == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/sdo-go-delta-normal
          key: ci-delta-v1-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ job.status == 'success' && github.sha || format('partial-{0}-{1}', github.run_id, github.run_attempt) }}
      - name: Export what this PR added to the base race build
        if: always() && matrix.mode == 'race' && github.event_name != 'push' && steps.snapshot-race.outcome == 'success'
        id: export-race
        run: python3 scripts/go_ci_cache_delta.py export --manifest "${{ runner.temp }}/base-race.manifest" --out "${{ runner.temp }}/sdo-go-delta-race" --max-bytes 524288000 gocache=${{ runner.temp }}/sdo-go-build-race
      - name: Save the race delta (a failed run saves its progress for the rerun)
        if: always() && matrix.mode == 'race' && github.event_name != 'push' && steps.export-race.outputs.saved == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/sdo-go-delta-race
          key: ci-delta-v1-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ job.status == 'success' && github.sha || format('partial-{0}-{1}', github.run_id, github.run_attempt) }}

  python:
    name: ${{ matrix.name }}
    needs: prepare-go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static analysis
            shard: fastloop
            run: bash scripts/format_code.sh --check && bash scripts/check_errors.sh && ./scripts/test_python.sh -m "not go_integration"
          - name: unit tests
            shard: core
            run: ./scripts/test_python.sh -m "not go_integration"
    steps:
      - name: Select prepared compiler cache
        run: echo "GOCACHE=${{ runner.temp }}/sdo-go-build-normal" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A mutable PR merge ref can change after a retarget; test this event.
          ref: ${{ github.sha }}
      - name: Restore the prepared normal build graph
        id: prepared-normal
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/sdo-go-build-normal
            ~/go/pkg/mod
            .fastloop/test-bin
          key: ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-
      - name: Require the normal build graph (this commit's on push, a base branch's on a PR)
        env:
          EVENT: ${{ github.event_name }}
          EXACT: ${{ steps.prepared-normal.outputs.cache-hit }}
          MATCHED: ${{ steps.prepared-normal.outputs.cache-matched-key }}
        run: |
          if [ "$EVENT" = push ]; then test "$EXACT" = true; else test -n "$MATCHED"; fi
      - name: Restore this PR's normal delta over the base build
        if: github.event_name != 'push'
        id: delta-normal
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/sdo-go-delta-normal
          key: ci-delta-v1-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
      - name: Lay the normal delta over the base build
        if: github.event_name != 'push' && steps.delta-normal.outputs.cache-hit == 'true'
        run: python3 scripts/go_ci_cache_delta.py apply --delta "${{ runner.temp }}/sdo-go-delta-normal" gocache=${{ runner.temp }}/sdo-go-build-normal mod=$HOME/go/pkg/mod test-bin=.fastloop/test-bin@content
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: matrix.name == 'static analysis' || matrix.name == 'architecture' || matrix.name == 'unit tests'
        with:
          go-version: "1.26.8"
          cache: false
      - name: Check out the SREGym harness
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          python3 scripts/init_test_prereqs.py
      - name: Share linked binaries between tests
        run: bash scripts/link_cache.sh >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      # The detector-sandbox unit tests really compile Go in an isolated
      # workspace. tests/conftest.py points them at the runner's default Go
      # caches; persisting those across runs turns the first sandbox build warm
      # (keyed on the controller module graph) instead of a cold stdlib+SDK
      # rebuild every run. Only the leg that runs pytest needs it.
      - name: Build and verify the source-bound test CLI
        if: matrix.name == 'unit tests'
        run: uv run python scripts/operator_test_binary.py
      - run: ${{ matrix.run }}
        env:
          SDO_PYTEST_SHARD: ${{ matrix.shard }}
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
      - name: Publish Python shard coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  contracts:
    env:
      GOPROXY: "off"
      GOSUMDB: "off"
    name: native contracts (${{ matrix.bin }})
    needs: prepare-go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bin: [0, 1]
    steps:
      - name: Select prepared compiler cache
        run: echo "GOCACHE=${{ runner.temp }}/sdo-go-build-normal" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A mutable PR merge ref can change after a retarget; test this event.
          ref: ${{ github.sha }}
      - name: Restore the prepared normal build graph
        id: prepared-normal
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/sdo-go-build-normal
            ~/go/pkg/mod
            .fastloop/test-bin
          key: ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-
      - name: Require the normal build graph (this commit's on push, a base branch's on a PR)
        env:
          EVENT: ${{ github.event_name }}
          EXACT: ${{ steps.prepared-normal.outputs.cache-hit }}
          MATCHED: ${{ steps.prepared-normal.outputs.cache-matched-key }}
        run: |
          if [ "$EVENT" = push ]; then test "$EXACT" = true; else test -n "$MATCHED"; fi
      - name: Restore this PR's normal delta over the base build
        if: github.event_name != 'push'
        id: delta-normal
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/sdo-go-delta-normal
          key: ci-delta-v1-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
      - name: Lay the normal delta over the base build
        if: github.event_name != 'push' && steps.delta-normal.outputs.cache-hit == 'true'
        run: python3 scripts/go_ci_cache_delta.py apply --delta "${{ runner.temp }}/sdo-go-delta-normal" gocache=${{ runner.temp }}/sdo-go-build-normal mod=$HOME/go/pkg/mod test-bin=.fastloop/test-bin@content
      - name: Restore the prepared race build graph
        id: prepared-race
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/sdo-go-build-race
          key: ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-
      - name: Require the race build graph (this commit's on push, a base branch's on a PR)
        env:
          EVENT: ${{ github.event_name }}
          EXACT: ${{ steps.prepared-race.outputs.cache-hit }}
          MATCHED: ${{ steps.prepared-race.outputs.cache-matched-key }}
        run: |
          if [ "$EVENT" = push ]; then test "$EXACT" = true; else test -n "$MATCHED"; fi
      - name: Restore this PR's race delta over the base build
        if: github.event_name != 'push'
        id: delta-race
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/sdo-go-delta-race
          key: ci-delta-v1-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
      - name: Lay the race delta over the base build
        if: github.event_name != 'push' && steps.delta-race.outputs.cache-hit == 'true'
        run: python3 scripts/go_ci_cache_delta.py apply --delta "${{ runner.temp }}/sdo-go-delta-race" gocache=${{ runner.temp }}/sdo-go-build-race
      - name: Combine prepared compiler entries without replacing existing files
        run: bash scripts/merge_go_ci_caches.sh '${{ runner.temp }}/sdo-go-build-normal' '${{ runner.temp }}/sdo-go-build-race'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.8"
          cache: false
      - name: Share linked binaries between tests
        run: bash scripts/link_cache.sh >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compiled-go-test-plan
          path: .fastloop/test-bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compiled-python-test-plan
          path: .fastloop/test-bin
      - name: Build the same fixed-capacity plan on both runners
        run: |
          uv run python scripts/check_ci_budget.py
          python3 scripts/pr_test_plan.py --go .fastloop/test-bin/go-test-plan.json --python .fastloop/test-bin/python-test-plan.json --output .fastloop/test-bin/pr-test-plan.json --nightly-manifest "$RUNNER_TEMP/nightly-tests.md"
      - name: Run the fixed regression set
        run: uv run --extra test python scripts/run_ci_contracts.py --plan .fastloop/test-bin/pr-test-plan.json --bin '${{ matrix.bin }}'
        env:
          SDO_PYTEST_COST_OUTPUT: ${{ runner.temp }}/python-test-costs.json
      - name: Publish the exact deferred-check list
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deferred-tests-${{ matrix.bin }}
          path: ${{ runner.temp }}/nightly-tests.md
          retention-days: 7
      - name: Publish complete test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-integration-costs-${{ matrix.bin }}
          path: ${{ runner.temp }}/python-test-costs.json
          if-no-files-found: warn
          retention-days: 7

  required-pr-ci:
    name: Required PR CI
    needs: [prepare-go, python, contracts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce prompt budget changes in every commit
        env:
          BUDGET_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          BUDGET_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python3 scripts/check_prompt_budgets.py --base "$BUDGET_BASE" --head "$BUDGET_HEAD"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        if: needs.python.result == 'success'
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - name: Download every Python shard's coverage
        if: needs.python.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-coverage-*
          path: python-coverage
      - name: Enforce coverage on the complete Python suite
        if: needs.python.result == 'success'
        run: |
          test -f python-coverage/python-coverage-core/.coverage.core
          test -f python-coverage/python-coverage-fastloop/.coverage.fastloop
          uv run --extra test coverage combine python-coverage/python-coverage-core python-coverage/python-coverage-fastloop
          uv run --extra test coverage report
      - name: Require every applicable CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = {name: details["result"] for name, details in json.loads(os.environ["JOB_RESULTS"]).items()}
          failed = {name: result for name, result in results.items() if result not in {"success", "skipped"}}
          if failed:
              raise SystemExit(f"Required CI jobs did not succeed: {failed}")
          print("all applicable CI jobs succeeded or were skipped:", results)
          PY
