name: CI

on:
  # Hosted caches saved on refs/pull/N are private to that PR. A PR can also
  # restore its base branch's caches, so pushes to every branch PRs target are
  # the only runs that save the large prepared Go builds (about 1.6 GB each);
  # Other runs restore the newest one and transfer the complete build as
  # run artifacts. Saving a build per throwaway ref passed the 10 GB
  # repository cap with a few concurrent PRs and evicted entries mid-run.
  push:
    branches: [main, "vic-lsh/dev/**"]
  workflow_dispatch:
    inputs:
      cold:
        description: Ignore prepared caches to verify the cold path
        type: boolean
        default: false
  pull_request:
  # GitHub merge queue: CI must report on the queue's temporary
  # gh-readonly-queue/... branch or the queue waits until it times out. Every
  # fixed regression jobs run in the queue so
  # the real merge commit is validated against the latest main.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled base-branch run saves no cache; only PR runs replace each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a commit (the tag it was taken from is in the
# comment), and uv installs exactly uv.lock.
env:
  # Bound parent and nested Go compilers on the two-core hosted runner.
  GOMAXPROCS: "2"
  GOFLAGS: "-p=2 -trimpath"
  SDO_PYTEST_WORKERS: "2"

jobs:
  prepare-go:
    name: prepare shared Go builds (${{ matrix.mode }})
    env:
      # Use the public runner's compiler CPU while retaining consumer build flags.
      GOMAXPROCS: "4"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
    outputs:
      schema_identity: ${{ steps.schema.outputs.value }}
    steps:
      - name: Select prepared compiler cache
        run: echo "GOCACHE=${{ runner.temp }}/sdo-go-build-${{ matrix.mode }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.8"
          cache: false
      - name: Restore the normal compiler and module caches
        if: matrix.mode == 'normal' && inputs.cold != true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: base-normal
        with:
          path: |
            ${{ runner.temp }}/sdo-go-build-normal
            ~/go/pkg/mod
            .fastloop/test-bin
          key: ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-prepared-v4-normal-${{ runner.os }}-${{ runner.arch }}-1.26.8-
      - name: Restore the race compiler cache
        if: matrix.mode == 'race' && inputs.cold != true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: base-race
        with:
          path: ${{ runner.temp }}/sdo-go-build-race
          key: ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-${{ hashFiles('**/go.sum') }}-
            ci-prepared-v4-race-${{ runner.os }}-${{ runner.arch }}-1.26.8-
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - name: Enforce standing PR execution limits
        run: |
          uv sync --locked --all-extras
          uv run python scripts/check_ci_budget.py
      - name: Compile dependency graphs outside operation timeouts
        id: compile
        # Normal preparation builds dependency archives, not discarded test
        # executables. GNU timeout also stops every child compiler on failure.
        run: timeout --kill-after=5s 230s bash scripts/prepare_go_ci.sh "${{ matrix.mode }}"

      - name: Check Go static contracts
        if: matrix.mode == 'race'
        run: bash scripts/check_errors.sh --go-only
        env:
          GOFLAGS: "-p=2 -trimpath -race"

      - name: Plan capacity from compiled inventory and hosted costs
        if: matrix.mode == 'race'
        id: cost-plan
        run: python3 scripts/go_cost_plan.py --prepared --include-dedicated --inventory-only --output .fastloop/test-bin/go-test-plan.json

      - name: Publish the exact race test plan
        if: matrix.mode == 'race'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled-go-test-plan
          path: .fastloop/test-bin/go-test-plan.json
          if-no-files-found: error
          retention-days: 1

      - name: Prepare Python adapter executables
        if: matrix.mode == 'normal'
        run: bash scripts/python_go_tools.sh prepare
      - name: Publish prepared Python Go tools
        if: matrix.mode == 'normal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-python-go-tools
          path: .fastloop/python-go-tools.tar
          if-no-files-found: error
          retention-days: 1

      - name: Collect all Go-backed Python contracts for the exact plan
        id: python-plan
        run: |
          uv run python scripts/init_test_prereqs.py
          uv run python scripts/python_cost_plan.py --inventory-only --output .fastloop/test-bin/python-test-plan.json
      - name: Publish the exact Python integration plan
        if: matrix.mode == 'normal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled-python-test-plan
          path: .fastloop/test-bin/python-test-plan.json
          if-no-files-found: error
          retention-days: 1

      - name: Keep only the source-bound test executable
        if: matrix.mode == 'normal'
        run: |
          current="$(python3 scripts/operator_test_binary.py)"
          test -f "$current"
          find .fastloop/test-bin -maxdepth 1 -type f -name 'sdo-operator-*' ! -samefile "$current" -delete

      - name: Bind image schema to the compiled source
        if: matrix.mode == 'normal'
        id: schema
        run: |
          identity="$(cd sdo/operator && go run ./cmd/sdo-operator schema-identity)"
          echo "value=${identity}" >> "$GITHUB_OUTPUT"

      - name: Pack the complete normal build
        if: matrix.mode == 'normal'
        run: bash scripts/go_ci_artifacts.sh pack normal "${{ runner.temp }}/prepared-normal"
      - name: Transfer the normal build to this run's consumers
        if: matrix.mode == 'normal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-normal
          path: ${{ runner.temp }}/prepared-normal/*.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Transfer only sources and tools to compiler-free Python jobs
        if: matrix.mode == 'normal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-python
          path: |
            ${{ runner.temp }}/prepared-normal/modules.tar.zst
            ${{ runner.temp }}/prepared-normal/tools.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Save the durable normal build
        if: matrix.mode == 'normal' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vic-lsh/dev/sdo-improve')
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/sdo-go-build-normal
            ~/go/pkg/mod
            .fastloop/test-bin
          key: ${{ steps.base-normal.outputs.cache-primary-key }}

      - name: Select the exact race graph for each fixed bucket
        if: matrix.mode == 'race'
        run: python3 scripts/pr_test_plan.py --go .fastloop/test-bin/go-test-plan.json --python .fastloop/test-bin/python-test-plan.json --output .fastloop/test-bin/pr-test-plan.json

      - name: Pack the bounded current race test graph
        if: matrix.mode == 'race'
        run: bash scripts/go_ci_artifacts.sh pack race "${{ runner.temp }}/prepared-race"
      - name: Transfer the race build to this run's consumers
        if: matrix.mode == 'race'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-race-0
          path: ${{ runner.temp }}/prepared-race/0/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Transfer the second bucket's race graph
        if: matrix.mode == 'race'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-race-1
          path: ${{ runner.temp }}/prepared-race/1/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Save the durable race build
        if: matrix.mode == 'race' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vic-lsh/dev/sdo-improve')
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/sdo-go-build-race
          key: ${{ steps.base-race.outputs.cache-primary-key }}

  python:
    name: ${{ matrix.name }}
    needs: prepare-go
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static analysis
            shard: fastloop
            run: ./scripts/test_python.sh -m "not go_integration"
          - name: unit tests
            shard: core
            run: ./scripts/test_python.sh -m "not go_integration"
    steps:
      - name: Select prepared compiler cache
        run: echo "GOCACHE=${{ runner.temp }}/sdo-go-build-normal" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A mutable PR merge ref can change after a retarget; test this event.
          ref: ${{ github.sha }}
      - name: Download this run's normal build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prepared-python
          path: ${{ runner.temp }}/prepared-normal
      - name: Unpack this run's normal build
        run: bash scripts/go_ci_artifacts.sh unpack python "${{ runner.temp }}/prepared-normal"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: matrix.name == 'static analysis' || matrix.name == 'architecture' || matrix.name == 'unit tests'
        with:
          go-version: "1.26.8"
          cache: false
      - name: Enforce compiler-free Python jobs
        run: |
          echo "SDO_UNIT_REAL_GO=$(command -v go)" >> "$GITHUB_ENV"
          echo "$PWD/scripts/unit-tools" >> "$GITHUB_PATH"
      - name: Check out the SREGym harness
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          python3 scripts/init_test_prereqs.py
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Download prepared Python Go tools
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prepared-python-go-tools
          path: ${{ runner.temp }}
      - name: Verify and select prepared Python Go tools
        run: |
          mkdir -p .fastloop/python-go-tools
          tar -xf "$RUNNER_TEMP/python-go-tools.tar" -C .fastloop/python-go-tools
          bash scripts/python_go_tools.sh env >> "$GITHUB_ENV"
      - name: Check formatting
        if: matrix.name == 'static analysis'
        run: bash scripts/format_code.sh --check
      - name: Check static contracts
        if: matrix.name == 'static analysis'
        run: bash scripts/check_errors.sh --python-only
      - name: Run Python shard
        run: ${{ matrix.run }} --durations=20
        env:
          SDO_PYTEST_SHARD: ${{ matrix.shard }}
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
      - name: Publish Python shard coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  contracts:
    env:
      GOPROXY: "off"
      GOSUMDB: "off"
    name: native contracts (${{ matrix.bin }})
    needs: prepare-go
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        bin: [0, 1]
    steps:
      - name: Select prepared compiler cache
        run: echo "GOCACHE=${{ runner.temp }}/sdo-go-build-normal" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A mutable PR merge ref can change after a retarget; test this event.
          ref: ${{ github.sha }}
      # The action fetches matching artifacts concurrently. Serial transfers add
      # independent network stalls and can consume the whole setup allocation.
      - name: Download this run's required builds concurrently
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: prepared-{normal,race-${{ matrix.bin }}}
          path: ${{ runner.temp }}
      - name: Unpack this run's normal build
        run: bash scripts/go_ci_artifacts.sh unpack normal "${{ runner.temp }}/prepared-normal"
      - name: Unpack this run's race build
        run: GOCACHE="${{ runner.temp }}/sdo-go-build-race" bash scripts/go_ci_artifacts.sh unpack race "${{ runner.temp }}/prepared-race-${{ matrix.bin }}"
      - name: Combine prepared compiler entries without replacing existing files
        run: bash scripts/merge_go_ci_caches.sh '${{ runner.temp }}/sdo-go-build-normal' '${{ runner.temp }}/sdo-go-build-race'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.8"
          cache: false
      - name: Share linked binaries between tests
        run: bash scripts/link_cache.sh >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compiled-go-test-plan
          path: .fastloop/test-bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compiled-python-test-plan
          path: .fastloop/test-bin
      - name: Build the same fixed-capacity plan on both runners
        run: |
          uv run python scripts/check_ci_budget.py
          python3 scripts/pr_test_plan.py --go .fastloop/test-bin/go-test-plan.json --python .fastloop/test-bin/python-test-plan.json --output .fastloop/test-bin/pr-test-plan.json --nightly-manifest "$RUNNER_TEMP/nightly-tests.md"
          cmp "$RUNNER_TEMP/prepared-race-${{ matrix.bin }}/plan.json" .fastloop/test-bin/pr-test-plan.json
      - name: Run the fixed regression set
        run: uv run --extra test python scripts/run_ci_contracts.py --plan .fastloop/test-bin/pr-test-plan.json --bin '${{ matrix.bin }}'
        env:
          SDO_PYTEST_COST_OUTPUT: ${{ runner.temp }}/python-test-costs.json
      - name: Publish the exact deferred-check list
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deferred-tests-${{ matrix.bin }}
          path: ${{ runner.temp }}/nightly-tests.md
          retention-days: 7
      - name: Publish complete test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-integration-costs-${{ matrix.bin }}
          path: ${{ runner.temp }}/python-test-costs.json
          if-no-files-found: warn
          retention-days: 7

  required-pr-ci:
    name: Required PR CI
    needs: [prepare-go, python, contracts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce prompt budget changes in every commit
        env:
          BUDGET_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          BUDGET_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python3 scripts/check_prompt_budgets.py --base "$BUDGET_BASE" --head "$BUDGET_HEAD"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        if: needs.python.result == 'success'
        with:
          version: "0.9.24"
          python-version: "3.12"
          enable-cache: true
      - name: Download every Python shard's coverage
        if: needs.python.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-coverage-*
          path: python-coverage
      - name: Enforce coverage on the complete Python suite
        if: needs.python.result == 'success'
        run: |
          test -f python-coverage/python-coverage-core/.coverage.core
          test -f python-coverage/python-coverage-fastloop/.coverage.fastloop
          uv run --extra test coverage combine python-coverage/python-coverage-core python-coverage/python-coverage-fastloop
          uv run --extra test coverage report
      - name: Require every applicable CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = {name: details["result"] for name, details in json.loads(os.environ["JOB_RESULTS"]).items()}
          failed = {name: result for name, result in results.items() if result not in {"success", "skipped"}}
          if failed:
              raise SystemExit(f"Required CI jobs did not succeed: {failed}")
          print("all applicable CI jobs succeeded or were skipped:", results)
          PY
