name: Restore independent Go caches concurrently
description: Restore disjoint compiler archives with the standard Actions cache client.
inputs:
  caches:
    description: JSON array of standard cache path, key and restore-keys inputs.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"
    # A JavaScript action receives the cache service's runner-provided runtime
    # environment. Shell steps do not; keep the restore inside this action.
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0 (Node 24)
      env:
        SDO_CACHE_INPUTS: ${{ inputs.caches }}
        SDO_CACHE_ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const root = process.env.SDO_CACHE_ACTION_PATH;
          const { restoreAll } = require(`${root}/restore.cjs`);
          const { restoreCache } = await import(`${root}/node_modules/@actions/cache/lib/cache.js`);
          const keys = await restoreAll(JSON.parse(process.env.SDO_CACHE_INPUTS), restoreCache);
          core.info(`Restored Go caches: ${keys.map(key => key || 'miss').join(', ')}`);
