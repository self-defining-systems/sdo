    \            \"lineWidth\": 1,\n            \"pointSize\": 5,\n            \"\
    scaleDistribution\": {\n              \"type\": \"linear\"\n            },\n \
    \           \"showPoints\": \"auto\",\n            \"spanNulls\": false,\n   \
