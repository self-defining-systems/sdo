    ,\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n\
    \        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n\
    \    \"recommendationCacheFailure\": {\n      \"description\": \"Fail recommendation\
