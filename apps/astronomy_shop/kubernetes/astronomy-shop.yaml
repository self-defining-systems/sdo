apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: astronomy-shop
  labels:
    helm.sh/chart: opentelemetry-demo-0.40.4
    app.kubernetes.io/version: 2.2.0
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/managed-by: Helm
    grafana_datasource: '1'
data:
  default.yaml: "# Copyright The OpenTelemetry Authors\n# SPDX-License-Identifier:\
    \ Apache-2.0\n\n\napiVersion: 1\n\ndatasources:\n  - name: Prometheus\n    uid:\
    \ webstore-metrics\n    type: prometheus\n    url: http://prometheus:9090\n  \
    \  editable: true\n    isDefault: true\n    jsonData:\n      # Align Prometheus\
    \ data source time interval with the OTel SDKs' export interval (see OTEL_METRIC_EXPORT_INTERVAL)\n\
    \      timeInterval: \"60s\"\n      exemplarTraceIdDestinations:\n        - datasourceUid:\
    \ webstore-traces\n          name: trace_id\n\n        - url: http://localhost:8080/jaeger/ui/trace/$${__value.raw}\n\
    \          name: trace_id\n          urlDisplayLabel: View in Jaeger UI\n"
  jaeger.yaml: "# Copyright The OpenTelemetry Authors\n# SPDX-License-Identifier:\
    \ Apache-2.0\n\n\napiVersion: 1\n\ndatasources:\n  - name: Jaeger\n    uid: webstore-traces\n\
    \    type: jaeger\n    url: http://jaeger:16686/jaeger/ui\n    editable: true\n\
    \    isDefault: false\n    jsonData:\n      tracesToLogsV2:\n        datasourceUid:\
    \ webstore-logs\n        spanStartTimeShift: \"-20m\"\n        spanEndTimeShift:\
    \ \"20m\"\n        filterByTraceID: true\n        filterBySpanID: true\n     \
    \   customQuery: true\n        query: traceId:\"$${__trace.traceId}\" AND spanId:\"\
    $${__span.spanId}\"\n"
  opensearch.yaml: "# Copyright The OpenTelemetry Authors\n# SPDX-License-Identifier:\
    \ Apache-2.0\n\napiVersion: 1\n\ndatasources:\n  - name: OpenSearch\n    uid:\
    \ webstore-logs\n    type: grafana-opensearch-datasource\n    url: http://opensearch:9200/\n\
    \    access: proxy\n    editable: true\n    isDefault: false\n    jsonData:\n\
    \      database: otel-logs-*\n      flavor: opensearch\n      logLevelField: severity.text.keyword\n\
    \      logMessageField: body\n      pplEnabled: true\n      timeField: observedTimestamp\n\
    \      version: 3.4.0\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: astronomy-shop
  labels:
    helm.sh/chart: opentelemetry-demo-0.40.4
    app.kubernetes.io/version: 2.2.0
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/managed-by: Helm
data:
  init.sql: "-- Copyright The OpenTelemetry Authors\n-- SPDX-License-Identifier: Apache-2.0\n\
    \nCREATE USER otelu WITH PASSWORD 'otelp';\n\n-- Accounting Service: create a\
    \ schema\nCREATE SCHEMA accounting;\nGRANT USAGE ON SCHEMA accounting TO otelu;\n\
    \n-- Accounting Service: create tables\nCREATE TABLE accounting.\"order\" (\n\
    \    order_id TEXT PRIMARY KEY\n);\n\nCREATE TABLE accounting.shipping (\n   \
    \ shipping_tracking_id TEXT PRIMARY KEY,\n    shipping_cost_currency_code TEXT\
    \ NOT NULL,\n    shipping_cost_units BIGINT NOT NULL,\n    shipping_cost_nanos\
    \ INT NOT NULL,\n    street_address TEXT,\n    city TEXT,\n    state TEXT,\n \
    \   country TEXT,\n    zip_code TEXT,\n    order_id TEXT NOT NULL,\n    FOREIGN\
    \ KEY (order_id) REFERENCES accounting.\"order\"(order_id) ON DELETE CASCADE\n\
    );\n\nCREATE TABLE accounting.orderitem (\n    item_cost_currency_code TEXT NOT\
    \ NULL,\n    item_cost_units BIGINT NOT NULL,\n    item_cost_nanos INT NOT NULL,\n\
    \    product_id TEXT NOT NULL,\n    quantity INT NOT NULL,\n    order_id TEXT\
    \ NOT NULL,\n    PRIMARY KEY (order_id, product_id),\n    FOREIGN KEY (order_id)\
    \ REFERENCES accounting.\"order\"(order_id) ON DELETE CASCADE\n);\n\n-- Accounting\
    \ Service: grant permission to schema\nGRANT SELECT, INSERT, UPDATE ON ALL TABLES\
    \ IN SCHEMA accounting TO otelu;\n\n-- Product Review Service: create a schema\n\
    CREATE SCHEMA reviews;\nGRANT USAGE ON SCHEMA reviews TO otelu;\n\n-- Product\
    \ Review Service: create tables\nCREATE TABLE reviews.productreviews (\n    id\
    \ INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\n    product_id VARCHAR(16)\
    \ NOT NULL,\n    username VARCHAR(64) NOT NULL,\n    description VARCHAR(1024),\n\
    \    score NUMERIC(2,1) NOT NULL\n);\n\n-- Product Review Service: create index\
    \ for product_id lookups\nCREATE INDEX product_id_index ON reviews.productreviews\
    \ (product_id);\n\n-- Product Review Service: grant permission to schema\nGRANT\
    \ SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA reviews TO otelu;\n\n-- Product\
    \ Review Service:  add product review data\nINSERT INTO reviews.productreviews\
    \ (product_id, username, description, score)\nVALUES\n    ('OLJCESPC7Z', 'stargazer_mike',\
    \ 'Great entry-level telescope! Easy to set up and provides clear views of the\
    \ moon and brighter planets. Highly recommend for new astronomers.', '4.5'),\n\
    \    ('OLJCESPC7Z', 'nightskylover', 'For the price, this Explorascope delivers\
    \ excellent performance. I was able to see Jupiter''s moons clearly. A fantastic\
    \ purchase for casual viewing.', '4.0'),\n    ('OLJCESPC7Z', 'beginner_astro',\
    \ 'A bit tricky to get used to the manual controls, but once you do, it''s very\
    \ rewarding. Saw the Orion Nebula for the first time! Good value.', '3.5'),\n\
    \    ('OLJCESPC7Z', 'celestial_explorer', 'Perfect for camping trips. It''s lightweight\
    \ and portable, making it easy to take anywhere. The views are surprisingly good\
    \ for its size.', '4.0'),\n    ('OLJCESPC7Z', 'telescope_fan', 'Not the most powerful\
    \ scope, but it''s great for kids and beginners. My children love looking at the\
    \ moon with it. A solid choice for family fun.', '3.0'),\n\n    ('66VCHSJNUP',\
    \ 'tech_astro', 'The StarSense app is revolutionary! It made finding celestial\
    \ objects incredibly easy. This telescope is a game-changer for beginners.', '5.0'),\n\
    \    ('66VCHSJNUP', 'app_user', 'Amazing technology, the smartphone integration\
    \ works flawlessly. I''ve never had so much fun exploring the night sky. Worth\
    \ every penny.', '4.5'),\n    ('66VCHSJNUP', 'innovator_john', 'Setup was a breeze,\
    \ and the tutorials in the app are very helpful. The views are crisp and clear.\
    \ My only minor gripe is battery drain on the phone.', '4.0'),\n    ('66VCHSJNUP',\
    \ 'clear_skies', 'Finally, a telescope that takes the guesswork out of stargazing.\
    \ The real-time positioning is incredibly accurate. Highly recommended for anyone\
    \ new to astronomy.', '5.0'),\n    ('66VCHSJNUP', 'gadget_geek', 'Fantastic product,\
    \ the app truly guides you. It''s like having a personal astronomer with you.\
    \ The optical quality is also very good.', '4.5'),\n\n    ('1YMWWN1N4O', 'solar_viewer',\
    \ 'Perfect for solar observations! The Solar Safe filter gives peace of mind.\
    \ I used it for the last partial eclipse and it was fantastic.', '5.0'),\n   \
    \ ('1YMWWN1N4O', 'eclipse_chaser', 'Compact and easy to carry, this telescope\
    \ is ideal for eclipse events. The included backpack is a nice touch. Views of\
    \ the sun are incredibly clear and safe.', '4.5'),\n    ('1YMWWN1N4O', 'travel_astro',\
    \ 'Excellent travel scope for solar viewing. The magnification is much better\
    \ than binoculars for the sun. A must-have for any solar enthusiast.', '4.0'),\n\
    \    ('1YMWWN1N4O', 'sun_gazer', 'Very impressed with the safety features and\
    \ clarity. Sharing the sun with family has never been easier or safer. Great value\
    \ for a dedicated solar scope.', '5.0'),\n    ('1YMWWN1N4O', 'safe_viewer', 'The\
    \ ISO compliant filter is reassuring. It''s a well-designed product for safe solar\
    \ observation. Highly recommend for educational purposes too.', '4.5'),\n\n  \
    \  ('L9ECAV7KIM', 'clean_optics', 'This kit is a lifesaver for all my optics.\
    \ The brush and wipes work perfectly without leaving any residue. My lenses have\
    \ never been cleaner.', '5.0'),\n    ('L9ECAV7KIM', 'photog_pro', 'Essential for\
    \ any photographer or telescope owner. It safely removes dust and fingerprints.\
    \ A high-quality cleaning solution.', '4.5'),\n    ('L9ECAV7KIM', 'daily_cleaner',\
    \ 'I use this on my binoculars, camera lenses, and even my phone screen. It''s\
    \ very effective and gentle. A versatile cleaning kit.', '4.0'),\n    ('L9ECAV7KIM',\
    \ 'tech_maintenance', 'Great value for money. The different cleaning options cover\
    \ all needs. Keeps my expensive equipment in pristine condition.', '5.0'),\n \
    \   ('L9ECAV7KIM', 'sharp_view', 'Works as advertised, my telescope views are\
    \ much clearer after using this. The fluid and cloth are excellent. Definitely\
    \ recommend.', '4.5'),\n\n    ('2ZYFJ3GM2N', 'bird_watcher', 'Incredible clarity\
    \ and brightness, perfect for bird watching. The ED glass really makes a difference.\
    \ I can spot the subtlest markings.', '5.0'),\n    ('2ZYFJ3GM2N', 'nature_lover',\
    \ 'These binoculars are fantastic for nature observation. The close focus is a\
    \ huge advantage for viewing nearby wildlife. Very comfortable to hold.', '4.5'),\n\
    \    ('2ZYFJ3GM2N', 'hiker_guy', 'Lightweight and durable, these are my go-to\
    \ binoculars for hiking. The wide field of view is excellent. Highly recommend\
    \ for outdoor enthusiasts.', '4.0'),\n    ('2ZYFJ3GM2N', 'stadium_fan', 'Took\
    \ these to a game and had an amazing view of the action. They perform great in\
    \ various lighting conditions. A solid all-around binocular.', '4.0'),\n    ('2ZYFJ3GM2N',\
    \ 'outdoor_adventurer', 'Excellent build quality and optical performance. They\
    \ feel robust and provide sharp images. A great investment for any outdoor activity.',\
    \ '4.5'),\n\n    ('0PUK6V6EV0', 'astro_photog', 'This imager is a fantastic step\
    \ up for planetary photography. The color quality is superb. Easy to use with\
    \ my existing telescope setup.', '5.0'),\n    ('0PUK6V6EV0', 'planet_shooter',\
    \ 'Finally capturing stunning images of Saturn and Jupiter! The NexImage 10 makes\
    \ it so accessible. Great for beginners in astrophotography.', '4.5'),\n    ('0PUK6V6EV0',\
    \ 'imager_pro', 'Excellent resolution and color rendition for its price point.\
    \ It''s a perfect solution for those looking to start imaging planets. Highly\
    \ satisfied.', '4.0'),\n    ('0PUK6V6EV0', 'space_artist', 'The detail I can capture\
    \ with this imager is incredible. It integrates well with various software. A\
    \ must-have for serious planetary observers.', '5.0'),\n    ('0PUK6V6EV0', 'digital_sky',\
    \ 'A solid choice for getting into solar system imaging. The setup was straightforward.\
    \ Produces beautiful, vibrant planetary images.', '4.5'),\n\n    ('LS4PSXUNUM',\
    \ 'night_walker', 'The red light is perfect for preserving night vision during\
    \ astronomy sessions. The hand warmer is an unexpected bonus. Very practical device.',\
    \ '5.0'),\n    ('LS4PSXUNUM', 'star_party_goer', 'This flashlight is indispensable\
    \ for star parties. The red mode is gentle on the eyes, and the power bank feature\
    \ is super handy. Love it!', '4.5'),\n    ('LS4PSXUNUM', 'camper_chris', 'Rugged\
    \ and versatile, this flashlight is great for camping and night walks. The hand\
    \ warmer function is a game-changer on cold nights. Highly recommend.', '4.5'),\n\
    \    ('LS4PSXUNUM', 'emergency_kit', 'A fantastic multi-tool for my emergency\
    \ kit. The red light is useful, and the power bank means I can charge my phone.\
    \ Great design.', '4.0'),\n    ('LS4PSXUNUM', 'astro_accessory', 'Every astronomer\
    \ needs one of these. The red light is essential, and the hand warmer and power\
    \ bank make it incredibly useful. A top-tier accessory.', '5.0'),\n\n    ('9SIQT8TOJO',\
    \ 'deep_sky_master', 'The RASA V2 is a dream come true for deep-sky imaging. The\
    \ f/2.2 speed drastically cuts down exposure times. My best astrophotography investment\
    \ yet.', '5.0'),\n    ('9SIQT8TOJO', 'pro_astro', 'Unbelievable performance for\
    \ wide-field astrophotography. The short focal length makes guiding less critical.\
    \ Produces stunning, detailed images.', '5.0'),\n    ('9SIQT8TOJO', 'imaging_guru',\
    \ 'This OTA is a beast! The fast optics mean more data in less time. If you''re\
    \ serious about deep-sky imaging, this is the one.', '4.5'),\n    ('9SIQT8TOJO',\
    \ 'advanced_scope', 'Worth every penny for the quality and speed it offers. My\
    \ images have never been sharper or more vibrant. A truly professional piece of\
    \ equipment.', '5.0'),\n    ('9SIQT8TOJO', 'precision_optics', 'The engineering\
    \ behind this RASA is exceptional. It''s incredibly efficient for capturing faint\
    \ objects. A high-end choice for dedicated imagers.', '4.5'),\n\n    ('6E92ZMYYFZ',\
    \ 'solar_safety', 'Essential for safe solar viewing with my 8-inch telescope.\
    \ The Velcro straps ensure it stays securely in place. Peace of mind during solar\
    \ observations.', '5.0'),\n    ('6E92ZMYYFZ', 'telescope_upgrade', 'This EclipSmart\
    \ filter is a perfect addition to my setup. The ISO compliance is crucial. Highly\
    \ recommend for anyone looking to view the sun safely.', '4.5'),\n    ('6E92ZMYYFZ',\
    \ 'safe_sun_gazer', 'Easy to attach and provides crystal clear, safe views of\
    \ the sun. The build quality is excellent. A must-have accessory for solar enthusiasts.',\
    \ '5.0'),\n    ('6E92ZMYYFZ', 'filter_fan', 'Works perfectly with my 8-inch scope.\
    \ No more worries about accidental dislodgement. Great product for protecting\
    \ your eyes and equipment.', '4.5'),\n    ('6E92ZMYYFZ', 'eclipse_ready', 'Bought\
    \ this for the upcoming eclipse, and it fits perfectly. Tested it out, and the\
    \ views are fantastic and safe. Very happy with this purchase.', '5.0'),\n\n \
    \   ('HQTGWGPNH4', 'history_buff', 'A fascinating glimpse into historical astronomical\
    \ thought. The content is incredibly insightful. A must-read for anyone interested\
    \ in the history of science.', '5.0'),\n    ('HQTGWGPNH4', 'bookworm_astro', 'Beautifully\
    \ presented historical document. It''s amazing to see how comets were understood\
    \ centuries ago. A valuable addition to any astronomy library.', '4.5'),\n   \
    \ ('HQTGWGPNH4', 'ancient_texts', 'Such a unique and intriguing read. The historical\
    \ context is captivating. It offers a different perspective on celestial events.',\
    \ '4.0'),\n    ('HQTGWGPNH4', 'celestial_history', 'I love historical astronomy,\
    \ and this book delivers. It''s well-researched and provides a window into past\
    \ beliefs. Highly recommended for scholars.', '5.0'),\n    ('HQTGWGPNH4', 'rare_find',\
    \ 'A truly special book for enthusiasts of astronomical history. The details about\
    \ ancient astrologers are very interesting. Great for a deeper understanding.',\
    \ '4.5');\n\n-- Product Catalog Service: create a schema\nCREATE SCHEMA catalog;\n\
    GRANT USAGE ON SCHEMA catalog TO otelu;\n\n-- Product Catalog Service: create\
    \ tables\nCREATE TABLE catalog.products (\n    id TEXT PRIMARY KEY,\n    name\
    \ TEXT NOT NULL,\n    description TEXT,\n    picture TEXT,\n    price_currency_code\
    \ TEXT NOT NULL,\n    price_units BIGINT NOT NULL,\n    price_nanos INT NOT NULL,\n\
    \    categories TEXT\n);\n\n-- Product Catalog Service: grant permission to schema\n\
    GRANT SELECT ON ALL TABLES IN SCHEMA catalog TO otelu;\n\n-- Product Catalog Service:\
    \ add product data\nINSERT INTO catalog.products (id, name, description, picture,\
    \ price_currency_code, price_units, price_nanos, categories)\nVALUES\n    ('OLJCESPC7Z',\
    \ 'National Park Foundation Explorascope', 'The National Park Foundation''s (NPF)\
    \ Explorascope 60AZ is a manual alt-azimuth, refractor telescope perfect for celestial\
    \ viewing on the go. The NPF Explorascope 60 can view the planets, moon, star\
    \ clusters and brighter deep sky objects like the Orion Nebula and Andromeda Galaxy.',\
    \ 'NationalParkFoundationExplorascope.jpg', 'USD', 101, 960000000, 'telescopes'),\n\
    \    ('66VCHSJNUP', 'Starsense Explorer Refractor Telescope', 'The first telescope\
    \ that uses your smartphone to analyze the night sky and calculate its position\
    \ in real time. StarSense Explorer is ideal for beginners thanks to the app''s\
    \ user-friendly interface and detailed tutorials. It''s like having your own personal\
    \ tour guide of the night sky', 'StarsenseExplorer.jpg', 'USD', 349, 950000000,\
    \ 'telescopes'),\n    ('1YMWWN1N4O', 'Eclipsmart Travel Refractor Telescope',\
    \ 'Dedicated white-light solar scope for the observer on the go. The 50mm refracting\
    \ solar scope uses Solar Safe, ISO compliant, full-aperture glass filter material\
    \ to ensure the safest view of solar events.  The kit comes complete with everything\
    \ you need, including the dedicated travel solar scope, a Solar Safe finderscope,\
    \ tripod, a high quality 20mm (18x) Kellner eyepiece and a nylon backpack to carry\
    \ everything in.  This Travel Solar Scope makes it easy to share the Sun as well\
    \ as partial and total solar eclipses with the whole family and offers much higher\
    \ magnifications than you would otherwise get using handheld solar viewers or\
    \ binoculars.', 'EclipsmartTravelRefractorTelescope.jpg', 'USD', 129, 950000000,\
    \ 'telescopes,travel'),\n    ('L9ECAV7KIM', 'Lens Cleaning Kit', 'Wipe away dust,\
    \ dirt, fingerprints and other particles on your lenses to see clearly with the\
    \ Lens Cleaning Kit. This cleaning kit works on all glass and optical surfaces,\
    \ including telescopes, binoculars, spotting scopes, monoculars, microscopes,\
    \ and even your camera lenses, computer screens, and mobile devices.  The kit\
    \ comes complete with a retractable lens brush to remove dust particles and dirt\
    \ and two options to clean smudges and fingerprints off of your optics, pre-moistened\
    \ lens wipes and a bottled lens cleaning fluid with soft cloth.', 'LensCleaningKit.jpg',\
    \ 'USD', 21, 950000000, 'accessories'),\n    ('2ZYFJ3GM2N', 'Roof Binoculars',\
    \ 'This versatile, all-around binocular is a great choice for the trail, the stadium,\
    \ the arena, or just about anywhere you want a close-up view of the action without\
    \ sacrificing brightness or detail. It''s an especially great companion for nature\
    \ observation and bird watching, with ED glass that helps you spot the subtlest\
    \ field markings and a close focus of just 6.5 feet.', 'RoofBinoculars.jpg', 'USD',\
    \ 209, 950000000, 'binoculars'),\n    ('0PUK6V6EV0', 'Solar System Color Imager',\
    \ 'You have your new telescope and have observed Saturn and Jupiter. Now you''re\
    \ ready to take the next step and start imaging them. But where do you begin?\
    \ The NexImage 10 Solar System Imager is the perfect solution.', 'SolarSystemColorImager.jpg',\
    \ 'USD', 175, 0, 'accessories,telescopes'),\n    ('LS4PSXUNUM', 'Red Flashlight',\
    \ 'This 3-in-1 device features a 3-mode red flashlight, a hand warmer, and a portable\
    \ power bank for recharging your personal electronics on the go. Whether you use\
    \ it to light the way at an astronomy star party, a night walk, or wildlife research,\
    \ ThermoTorch 3 Astro Red''s rugged, IPX4-rated design will withstand your everyday\
    \ activities.', 'RedFlashlight.jpg', 'USD', 57, 80000000, 'accessories,flashlights'),\n\
    \    ('9SIQT8TOJO', 'Optical Tube Assembly', 'Capturing impressive deep-sky astroimages\
    \ is easier than ever with Rowe-Ackermann Schmidt Astrograph (RASA) V2, the perfect\
    \ companion to today''s top DSLR or astronomical CCD cameras. This fast, wide-field\
    \ f/2.2 system allows for shorter exposure times compared to traditional f/10\
    \ astroimaging, without sacrificing resolution. Because shorter sub-exposure times\
    \ are possible, your equatorial mount won''t need to accurately track over extended\
    \ periods. The short focal length also lessens equatorial tracking demands. In\
    \ many cases, autoguiding will not be required.', 'OpticalTubeAssembly.jpg', 'USD',\
    \ 3599, 0, 'accessories,telescopes,assembly'),\n    ('6E92ZMYYFZ', 'Solar Filter',\
    \ 'Enhance your viewing experience with EclipSmart Solar Filter for 8\" telescopes.\
