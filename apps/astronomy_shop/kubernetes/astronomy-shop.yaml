    \     \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\"\
    : \"off\"\n    },\n    \"adManualGc\": {\n      \"description\": \"Triggers full\
    \ manual garbage collections in the ad service\",\n      \"state\": \"ENABLED\"\
    ,\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n    \
    \  },\n      \"defaultVariant\": \"off\"\n    },\n    \"adHighCpu\": {\n     \
