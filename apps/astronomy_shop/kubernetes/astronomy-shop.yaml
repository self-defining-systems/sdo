    \ 'A 16th-century treatise on comets, created anonymously in Flanders (now northern\
    \ France) and now held at the Universit\xE4tsbibliothek Kassel. Commonly known\
    \ as The Comet Book (or Kometenbuch in German), its full title translates as \"\
