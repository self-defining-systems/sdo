    \  \"mean\",\n            \"logmin\",\n            \"max\",\n            \"delta\"\
    \n          ],\n          \"displayMode\": \"table\",\n          \"placement\"\
    : \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\"\
    : {\n          \"mode\": \"single\",\n          \"sort\": \"none\"\n        }\n\
    \      },\n      \"pluginVersion\": \"11.3.0\",\n      \"targets\": [\n      \
