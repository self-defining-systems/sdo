    : \"none\"\n            },\n            \"thresholdsStyle\": {\n             \
    \ \"mode\": \"off\"\n            }\n          },\n          \"mappings\": [],\n\
    \          \"thresholds\": {\n            \"mode\": \"absolute\",\n          \
    \  \"steps\": [\n              {\n                \"color\": \"green\"\n     \
    \         },\n              {\n                \"color\": \"red\",\n         \
    \       \"value\": 80\n              }\n            ]\n          },\n        \
    \  \"unit\": \"ms\"\n        },\n        \"overrides\": []\n      },\n      \"\
    gridPos\": {\n        \"h\": 12,\n        \"w\": 24,\n        \"x\": 0,\n    \
    \    \"y\": 49\n      },\n      \"id\": 16,\n      \"interval\": \"5m\",\n   \
