    : \"query_result(sum ({__name__=~\\\".*traces_span_metrics_calls_total\\\",service_name=~\\\
    \"$service\\\"})  by (span_name))\",\n        \"includeAll\": true,\n        \"\
    multi\": true,\n        \"name\": \"span_name\",\n        \"options\": [],\n \
