    : {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\"\
    : {\n            \"axisBorderShow\": false,\n            \"axisCenteredZero\"\
    : false,\n            \"axisColorMode\": \"text\",\n            \"axisLabel\"\
