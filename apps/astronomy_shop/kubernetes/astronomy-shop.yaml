apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  labels:
    helm.sh/chart: opensearch-3.4.0
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/instance: astronomy-shop
    app.kubernetes.io/version: 3.4.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: opensearch
  annotations:
    majorVersion: '3'
  namespace: astronomy-shop
spec:
  serviceName: opensearch-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
      app.kubernetes.io/instance: astronomy-shop
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      name: opensearch
      labels:
        helm.sh/chart: opensearch-3.4.0
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/instance: astronomy-shop
        app.kubernetes.io/version: 3.4.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: opensearch
      annotations:
        configchecksum: 5a84bf6088aa7d3c22cab9185dd17070335c54a9a10bb95d83ddec6d6bd58ad
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                  - astronomy-shop
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - opensearch
      terminationGracePeriodSeconds: 120
      volumes:
      - name: config
        configMap:
          name: opensearch-config
      - emptyDir: {}
        name: config-emptydir
      enableServiceLinks: true
      initContainers:
      - name: configfile
        image: opensearchproject/opensearch:3.4.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - '#!/usr/bin/env bash

          cp -r /tmp/configfolder/*  /tmp/config/

          '
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
        resources:
          limits:
            memory: 128Mi
          requests:
            memory: '0'
        volumeMounts:
        - mountPath: /tmp/config/
          name: config-emptydir
        - name: config
          mountPath: /tmp/configfolder/opensearch.yml
          subPath: opensearch.yml
      containers:
      - name: opensearch
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
        image: opensearchproject/opensearch:3.4.0
        imagePullPolicy: IfNotPresent
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 5
          tcpSocket:
            port: 9200
          timeoutSeconds: 3
        startupProbe:
          failureThreshold: 30
          initialDelaySeconds: 5
          periodSeconds: 10
          tcpSocket:
            port: 9200
          timeoutSeconds: 3
        ports:
        - name: http
          containerPort: 9200
        - name: transport
          containerPort: 9300
        resources:
          limits:
            memory: 2240Mi
          requests:
            cpu: 1000m
            memory: 100Mi
        env:
        - name: node.name
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: discovery.seed_hosts
          value: opensearch-cluster-master-headless
        - name: cluster.name
          value: demo-cluster
        - name: network.host
          value: 0.0.0.0
        - name: OPENSEARCH_JAVA_OPTS
          value: -Xms400m -Xmx400m
        - name: node.roles
          value: master,ingest,data,remote_cluster_client,
        - name: discovery.type
          value: single-node
        - name: bootstrap.memory_lock
          value: 'true'
        - name: DISABLE_INSTALL_DEMO_CONFIG
          value: 'true'
        - name: DISABLE_SECURITY_PLUGIN
          value: 'true'
        volumeMounts:
        - name: config-emptydir
          mountPath: /usr/share/opensearch/config/opensearch.yml
          subPath: opensearch.yml
