    .*traces_span_metrics_calls_total\\\",service_name=~\\\"$service\\\"})  by (span_name))\"\
    ,\n          \"refId\": \"StandardVariableQuery\"\n        },\n        \"refresh\"\
    : 2,\n        \"regex\": \"/.*span_name=\\\"(.*)\\\".*/\",\n        \"type\":\
    \ \"query\"\n      }\n    ]\n  },\n  \"time\": {\n    \"from\": \"now-15m\",\n\
