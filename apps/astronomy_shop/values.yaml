# App-scoped telemetry; never propagate the shared node mount tree.
prometheus:
  enabled: false
components:
  load-generator:
    envOverrides:
    - name: LOCUST_BROWSER_TRAFFIC_ENABLED
      value: 'false'
opentelemetry-collector:
  extraEnvs:
  - name: GOMAXPROCS
    value: '2'
  presets:
    hostMetrics:
      enabled: false
