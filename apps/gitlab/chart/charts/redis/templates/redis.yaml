apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  labels: {{- include "redis.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "redis.password is required" .Values.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels: {{- include "redis.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  labels: {{- include "redis.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels: {{- include "redis.labels" . | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.image }}
          command: [sh, -c, 'exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes --dir /data']
          ports:
            - {name: redis, containerPort: 6379}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: password}
          readinessProbe:
            exec:
              command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage }}
