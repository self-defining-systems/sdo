apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  labels: {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "postgresql.password is required" .Values.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels: {{- include "postgresql.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - {name: postgresql, port: 5432, targetPort: postgresql}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  labels: {{- include "postgresql.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels: {{- include "postgresql.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.image }}
          ports:
            - {name: postgresql, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: {{ .Values.user | quote }}}
            - {name: POSTGRES_DB, value: {{ .Values.database | quote }}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: password}
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage }}
