{{- $endpoint := printf "http://%s:8333" .Values.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-s3-config
  labels: {{- include "objectstore.labels" . | nindent 4 }}
type: Opaque
stringData:
  s3.json: |
    {"identities": [{"name": "lane", "credentials": [{"accessKey": {{ required "objectstore.accessKey is required" .Values.accessKey | quote }}, "secretKey": {{ required "objectstore.secretKey is required" .Values.secretKey | quote }}}], "actions": ["Admin", "Read", "List", "Tagging", "Write"]}]}
---
# What GitLab's global.appConfig.object_store.connection reads.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.connectionSecretName }}
  labels: {{- include "objectstore.labels" . | nindent 4 }}
type: Opaque
stringData:
  connection: |
    provider: AWS
    region: {{ .Values.region }}
    aws_access_key_id: {{ .Values.accessKey }}
    aws_secret_access_key: {{ .Values.secretKey }}
    endpoint: {{ $endpoint }}
    path_style: true
---
# What the registry's storage.secret reads.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registrySecretName }}
  labels: {{- include "objectstore.labels" . | nindent 4 }}
type: Opaque
stringData:
  config: |
    s3:
      bucket: registry
      accesskey: {{ .Values.accessKey }}
      secretkey: {{ .Values.secretKey }}
      region: {{ .Values.region }}
      regionendpoint: {{ $endpoint }}
      v4auth: true
      pathstyle: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels: {{- include "objectstore.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - {name: s3, port: 8333, targetPort: s3}
    - {name: master, port: 9333, targetPort: master}
    - {name: master-grpc, port: 19333, targetPort: 19333}  # weed shell reaches the master over gRPC (port + 10000)
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  labels: {{- include "objectstore.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels: {{- include "objectstore.labels" . | nindent 8 }}
    spec:
      containers:
        - name: seaweedfs
          image: {{ .Values.image }}
          args: [server, -dir=/data, -master.volumeSizeLimitMB=256, -filer, -s3, -s3.port=8333, -s3.config=/etc/seaweedfs/s3.json, -ip.bind=0.0.0.0]
          ports:
            - {name: s3, containerPort: 8333}
            - {name: master, containerPort: 9333}
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: s3-config
          secret:
            secretName: {{ .Values.name }}-s3-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage }}
{{- if .Values.buckets }}
---
# Creates the buckets GitLab and the registry use once the store answers (idempotent: existing buckets are skipped). A regular Job, not a hook:
# the registry cannot become ready without its bucket, and a post-install hook would wait for the registry.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}-buckets
  labels: {{- include "objectstore.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {{- include "objectstore.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: buckets
          image: {{ .Values.image }}
          command:
            - sh
            - -c
            - |
              # Idempotent: a bucket that already exists (retained PVC, Job recreated on upgrade) counts as done.
              # Existence is decided by listing, never by the exit status of create, because weed shell
              # reports "already exists" as an error. A bucket that is neither listed nor creatable
              # within the bounded retries (store still starting, real error) fails the Job.
              master={{ .Values.name }}:9333
              has_bucket() {
                echo "s3.bucket.list" | weed shell -master="$master" 2>/dev/null | grep -Eq "^[[:space:]]*$1([[:space:]]|\$)"
              }
              for bucket in{{ range .Values.buckets }} {{ . }}{{ end }}; do
                i=0
                until has_bucket "$bucket"; do
                  i=$((i + 1))
                  if [ "$i" -gt 60 ]; then
                    echo "bucket $bucket was neither listed nor created after 60 attempts" >&2
                    exit 1
                  fi
                  echo "s3.bucket.create -name $bucket" | weed shell -master="$master" || true
                  has_bucket "$bucket" || sleep 5
                done
                echo "bucket $bucket exists"
              done
{{- end }}
