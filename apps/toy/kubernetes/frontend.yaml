apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - env:
        - name: SERVICE_NAME
          value: frontend
        - name: DEPENDENCY
          value: http://backend:8080/
        image: sdo-toy-app:v1
        imagePullPolicy: Never
        name: frontend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 1
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 1
        resources:
          limits:
            cpu: 100m
            memory: 32Mi
          requests:
            cpu: 5m
            memory: 8Mi
      terminationGracePeriodSeconds: 0
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: frontend
