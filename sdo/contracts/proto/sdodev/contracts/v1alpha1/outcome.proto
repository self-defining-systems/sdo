syntax = "proto3";

package sdodev.contracts.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "sdodev/contracts/v1alpha1/messages.proto";
import "sdodev/contracts/v1alpha1/common.proto";
import "sdodev/contracts/v1alpha1/program.proto";

option go_package = "sdo.dev/operator/contracts/gen/sdodev/contracts/v1alpha1;contractsv1alpha1";

// Independently verified, durable incident evidence. This is the logical
// contract; the memory adapter alone chooses its repository representation.
message OutcomeRecord {
  int32 schema_version = 1 [(buf.validate.field).int32.const = 1];
  string incident_id = 2 [(buf.validate.field).string = {min_len: 1, pattern: "\\S"}];
  string source_commit = 3;
  string deployed_commit = 4;
  repeated DetectorEvaluation detector_history = 5;
  repeated Finding findings = 6;
  repeated string surfaced_playbooks = 7 [(buf.validate.field).repeated.items.string.pattern = "^[a-z][a-z0-9_-]*$"];
  repeated string inspected_playbooks = 8 [(buf.validate.field).repeated.items.string.pattern = "^[a-z][a-z0-9_-]*$"];
  repeated string confirmed_playbooks = 9 [(buf.validate.field).repeated.items.string.pattern = "^[a-z][a-z0-9_-]*$"];
  repeated string rejected_playbooks = 10 [(buf.validate.field).repeated.items.string.pattern = "^[a-z][a-z0-9_-]*$"];
  repeated string applied_playbooks = 11 [(buf.validate.field).repeated.items.string.pattern = "^[a-z][a-z0-9_-]*$"];
  repeated ConfirmedRootCause confirmed_root_causes = 12;
  repeated DetectorEvaluation final_health_detector_state = 13;
  string classification = 14 [(buf.validate.field).string = {in: ["success", "cleared_without_action", "failed"]}];
  optional string repair_commit = 15;
  repeated RepairActionReceipt repair_actions = 16;
  optional string memory_commit = 17;
  string responder_backend = 18;
  string responder_model = 19;
  UsageMetrics usage = 20;
  OutcomeTimestamps timestamps = 21;
  reserved 22;
  reserved "diagnosis_verification";
  repeated ProgramToolCall program_tool_calls = 23;
  repeated ProgramRun program_runs = 24;
  repeated PlanApplication plan_applications = 25;
  repeated string program_failure_signals = 26;
  int32 response_loops_used = 27;
  bool response_loop_exhausted = 28;
  repeated DriftEvent drift_events = 29;
  string resolution_path = 30 [(buf.validate.field).string = {in: ["", "responder"]}];
  reserved 31;
  reserved 32;
  reserved 33;
  ReflectionEligibility reflection_eligibility = 34;
  PlaybookCoverage playbook_coverage = 35;
  repeated StageReport prior_stages = 36;
  // Controller-owned visible skip when no provider session can be resumed.
  string reflection_skip_reason = 37 [(buf.validate.field).string = {in: ["", "no_session"]}];
  // Broker-only append after reflection; incident evidence remains immutable.
  repeated SdkGap sdk_gaps = 50;
}

message OutcomeTimestamps {
  google.protobuf.Timestamp detected_at = 1;
  google.protobuf.Timestamp dispatched_at = 2;
  google.protobuf.Timestamp mitigated_at = 3;
  google.protobuf.Timestamp verified_at = 4;
  google.protobuf.Timestamp completed_at = 5;
}

message SdkGap {
  string fault_class = 1 [(buf.validate.field).string.min_len = 1];
  string primitive = 2 [(buf.validate.field).string.min_len = 1];
  string reason = 3 [(buf.validate.field).string.min_len = 1];
  string scratch_script = 4 [(buf.validate.field).string.min_len = 1];
  // Confirmed-cause resources this exception applies to; never excuses peers.
  repeated ObjectRef resources = 5;
}
