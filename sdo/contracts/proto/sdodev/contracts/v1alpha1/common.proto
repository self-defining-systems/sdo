syntax = "proto3";

// Package sdo.contracts.v1alpha1 is the single source of truth for the
// structured contracts that cross the SDO controller<->responder and
// Python<->Go seams. These messages are serialized as protojson on the wire;
// proto governs the schema, not the encoding.
package sdodev.contracts.v1alpha1;

option go_package = "sdo.dev/operator/contracts/gen/sdodev/contracts/v1alpha1;contractsv1alpha1";

// ObjectRef identifies a Kubernetes object a finding or repair refers to.
message ObjectRef {
  string api_version = 1;
  string kind = 2;      // required, non-empty (enforced via protovalidate in Stage 2)
  string namespace = 3;
  string name = 4;      // required, non-empty
}
