syntax = "proto3";

package sdodev.contracts.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "sdodev/contracts/v1alpha1/program.proto";
import "sdodev/contracts/v1alpha1/memory.proto";
import "sdodev/contracts/v1alpha1/messages.proto";
import "sdodev/contracts/v1alpha1/outcome.proto";

option go_package = "sdo.dev/operator/contracts/gen/sdodev/contracts/v1alpha1;contractsv1alpha1";

// Registration describes a worker's external contract and launch mechanism.
// Its language, agent framework, and internal session code are private to it.
message AgentRegistration {
  option (buf.validate.message).cel = {
    id: "registration.unique_task_types"
    message: "an agent may declare each task type once"
    expression: "this.capabilities.all(a, this.capabilities.filter(b, b.task_type == a.task_type).size() == 1)"
  };
  string schema_version = 1 [(buf.validate.field).string.const = "sdo.dev/v1alpha1"];
  string agent_id = 2 [(buf.validate.field).string.min_len = 1];
  repeated AgentCapability capabilities = 3 [(buf.validate.field).repeated.min_items = 1];
  repeated string permissions = 4;
  oneof launch {
    option (buf.validate.oneof).required = true;
    KubernetesJobLaunch kubernetes_job = 5;
    LocalProcessLaunch local_process = 6;
  }
}

message AgentCapability {
  string task_type = 1 [(buf.validate.field).string.min_len = 1];
  string request_type_url = 2 [(buf.validate.field).string.min_len = 1];
  string result_type_url = 3 [(buf.validate.field).string.min_len = 1];
}

// A worker image is an executable artifact, not a language designation.
message KubernetesJobLaunch {
  string image = 1 [(buf.validate.field).string.min_len = 1];
  repeated string command = 2 [(buf.validate.field).repeated.min_items = 1];
  repeated string environment_names = 3;
}

message LocalProcessLaunch {
  repeated string command = 1 [(buf.validate.field).repeated.min_items = 1];
  repeated string environment_names = 2;
}

// A proposal checkout is private to one task. The broker owns the accepted
// repository and imports the actual diff after the worker finishes.
message ProposalWorkspace {
  string proposal_id = 1;
  string checkout_path = 2;
  string base_commit = 3;
}

message AgentTask {
  string schema_version = 1 [(buf.validate.field).string.const = "sdo.dev/v1alpha1"];
  string task_id = 2 [(buf.validate.field).string.min_len = 1];
  string agent_id = 3 [(buf.validate.field).string.min_len = 1];
  string task_type = 4 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Any request = 5;
  ProposalWorkspace workspace = 6;
  google.protobuf.Timestamp deadline = 7;
}

message AgentResult {
  string schema_version = 1 [(buf.validate.field).string.const = "sdo.dev/v1alpha1"];
  string task_id = 2 [(buf.validate.field).string.min_len = 1];
  // The broker still validates the diff.
  string status = 3 [(buf.validate.field).string = {in: ["completed", "failed", "cancelled"]}];
  google.protobuf.Any response = 4;
  string proposal_id = 5;
  string error_summary = 6;
}

// Reflection runs only after the broker has committed an authoritative
// outcome. Its worker may propose file edits, but cannot publish them.
message ReflectionRequest {
  option (buf.validate.message).cel = {
    id: "reflection_request.diagnostics_only_on_retry"
    message: "previous_diagnostics are carried exactly by a retry (validation_attempt > 1)"
    expression: "(this.validation_attempt > 1) == (size(this.previous_diagnostics) > 0)"
  };
  IncidentClosure closure = 1;
  reserved 2, 3;
  reserved "outcome_json", "prior_outcome_json";
  string proposal_commit = 4;
  string outcome_commit = 5;
  OperationalMemorySnapshot memory_snapshot = 6;
  // Empty selects a fresh reflection. Resume requires a valid prior responder session.
  string session_mode = 7 [(buf.validate.field).string = {in: ["", "fresh", "resume"]}];
  // Empty selects baseline. Other modes are generalize and generalize-spec.
  string guidance = 8 [(buf.validate.field).string = {in: ["", "baseline", "generalize", "generalize-spec"]}];
  OutcomeRecord outcome = 9;
  repeated OutcomeRecord prior_outcomes = 10;
  // Go-owned retry feedback: the broker rejected the previous attempt's
  // proposal. validation_attempt is 1 for the first dispatch; later attempts
  // carry that rejection's diagnostics.
  uint32 validation_attempt = 11;
  repeated MemoryDiagnostic previous_diagnostics = 12;
  reserved 13;
  reserved "depth";
  repeated ReflectionCauseWork cause_work = 14;
  repeated ReflectionWorkItem unassigned_work = 15;
}

message ReflectionResult {
  option (buf.validate.message).cel = {
    id: "reflection.no_change_has_reason"
    message: "a no_change or sdk_gap reflection requires a concrete reason"
    expression: "this.learning_decision == 'updated' || this.no_change_reason != ''"
  };
  string summary = 1;
  string learning_decision = 2 [(buf.validate.field).string = {in: ["updated", "no_change", "sdk_gap"]}];
  string no_change_reason = 3;
  // Logical playbook IDs affected by the checkout diff; never physical paths.
  repeated string proposed_artifact_ids = 4;
  OperationalArtifactProposal artifact_proposal = 5 [deprecated = true];
  repeated SdkGap sdk_gaps = 6;
}

message SdkGap {
  string fault_class = 1 [(buf.validate.field).string.min_len = 1];
  string primitive = 2 [(buf.validate.field).string.min_len = 1];
  string reason = 3 [(buf.validate.field).string.min_len = 1];
  string scratch_script = 4 [(buf.validate.field).string.min_len = 1];
}
