syntax = "proto3";

package sdodev.contracts.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "sdodev/contracts/v1alpha1/memory_diagnostic.proto";
import "sdodev/contracts/v1alpha1/messages.proto";
import "sdodev/contracts/v1alpha1/outcome.proto";
import "sdodev/contracts/v1alpha1/worker.proto";
import "sdodev/contracts/v1alpha1/mitigation_menu.proto";

option go_package = "sdo.dev/operator/contracts/gen/sdodev/contracts/v1alpha1;contractsv1alpha1";

// DispatchState is the responder/workspace lifecycle. Running states are
// transient; a durable snapshot records the corresponding pending state.
enum DispatchState {
  DISPATCH_STATE_UNSPECIFIED = 0;
  DISPATCH_STATE_IDLE = 1;
  DISPATCH_STATE_WORKSPACE_PENDING = 2;
  DISPATCH_STATE_WORKSPACE_RUNNING = 3;
  DISPATCH_STATE_PENDING = 4;
  DISPATCH_STATE_RUNNING = 5;
  DISPATCH_STATE_COMPLETED = 6;
  reserved 7;
  reserved "DISPATCH_STATE_ADMISSION_DEFERRED";
}

// ClosureState is the lifecycle of an incident's durable memory commit.
enum ClosureState {
  CLOSURE_STATE_UNSPECIFIED = 0;
  CLOSURE_STATE_PENDING = 1;
  CLOSURE_STATE_PROCESSING = 2;
  CLOSURE_STATE_COMMITTED = 3;
  CLOSURE_STATE_ACKNOWLEDGING = 4;
  CLOSURE_STATE_FAILED = 5;
}

// FindingState is the controller's firing-streak bookkeeping for one finding.
message FindingState {
  string detector_id = 1;
  Finding finding = 2;
  int32 firing_count = 3;
  int32 clear_count = 4;
  bool active = 5;
  // First observation since the finding last cleared.
  google.protobuf.Timestamp first_seen_at = 6;
  // Completed transitions; they make telemetry event ids a pure function of
  // durable state.
  int32 activations = 7;
  int32 clears = 8;
  int32 not_persisted = 9;
  // Timed learned-program clearance and scheduled binding confirmation.
  google.protobuf.Timestamp first_clear_at = 10;
  google.protobuf.Timestamp last_observed_at = 11;
}

// BatcherState is the findings waiting for their debounce deadline.
message BatcherState {
  repeated Finding findings = 1;
  map<string, google.protobuf.Timestamp> deadlines = 2;
  google.protobuf.Timestamp deadline = 3;
}

// ClosureReceipt is the broker's durable proof that a closure was committed.
message ClosureReceipt {
  string incident_id = 1;
  string worktree = 2;
  string base_commit = 3;
  string proposal_commit = 4;
  string outcome_commit = 5;
  string reflection_commit = 6;
  string ack_token = 7;
}

enum ClosureFailureReason {
  CLOSURE_FAILURE_REASON_UNSPECIFIED = 0;
  CLOSURE_FAILURE_REASON_BROKER_ERROR = 1;
  CLOSURE_FAILURE_REASON_INVALID_RECEIPT = 2;
  CLOSURE_FAILURE_REASON_RETRY_EXHAUSTED = 3;
  CLOSURE_FAILURE_REASON_AGENT_TIMEOUT = 4;
  // The closure recheck was denied its observation scope (RBAC, undeclared or
  // unsupported dependency). A misconfiguration, never a contradicted repair.
  CLOSURE_FAILURE_REASON_OBSERVER_DENIED = 5;
  // The incident's work lost its owner: no live responder execution or
  // harvested result remains past its response bound plus a grace. A harvested
  // response stays controller-owned through closure, including after restart.
  CLOSURE_FAILURE_REASON_OWNER_LOST = 6;
}

// FailedIncidentClosure preserves terminal evidence independently of the next
// incident. The storage edge archives each record before accepting new state.
message FailedIncidentClosure {
  IncidentClosure closure = 1 [(buf.validate.field).required = true];
  ClosureFailure failure = 2 [(buf.validate.field).required = true];
}

// ClosureFailure is the durable record of broker rejections of the pending
// closure. Permanent means the retry budget is spent.
message ClosureFailure {
  string incident_id = 1;
  int32 attempts = 2;
  int32 max_attempts = 3;
  string last_error = 4;
  google.protobuf.Timestamp first_failed_at = 5;
  google.protobuf.Timestamp last_failed_at = 6;
  google.protobuf.Timestamp next_attempt_at = 7;
  bool permanent = 8;
  string action = 9;
  ClosureFailureReason reason = 10 [(buf.validate.field).enum.defined_only = true];
}

// ControllerState is the controller's restartable state, persisted as
// ProtoJSON in the controller state ConfigMap. incident_view is published for
// responders (`sdo incident status`) and never restored.
message ControllerState {
  option (buf.validate.message).cel = {
    id: "state.open_incident_has_request"
    message: "an open incident requires its request"
    expression: "!this.incident_open || has(this.incident_request)"
  };
  option (buf.validate.message).cel = {
    id: "state.failed_closure_has_permanent_failure"
    message: "a failed closure requires its permanent failure record"
    expression: "this.closure_state != 5 || (has(this.closure_failure) && this.closure_failure.permanent)"
  };
  option (buf.validate.message).cel = {
    id: "state.closure_failure_matches_pending_closure"
    message: "a closure failure must belong to the pending closure and its permanence must match the closure state"
    expression:
      "!has(this.closure_failure) || (has(this.pending_closure) && "
      "this.closure_failure.incident_id == this.pending_closure.request.incident_id && "
      "this.closure_failure.permanent == (this.closure_state == 5))"
  };
  option (buf.validate.message).cel = {
    id: "state.pending_closure_has_payload"
    message: "pending or processing closure requires its frozen payload"
    expression: "!(this.closure_state in [1, 2]) || has(this.pending_closure)"
  };
  option (buf.validate.message).cel = {
    id: "state.committed_closure_has_receipt"
    message: "committed or acknowledging closure requires its receipt"
    expression: "!(this.closure_state in [3, 4]) || has(this.closure_receipt)"
  };
  string version = 1 [(buf.validate.field).string.const = "sdo.controller/v1"];
  map<string, google.protobuf.Timestamp> scheduler_deadlines = 2;
  map<string, FindingState> finding_states = 3;
  BatcherState pending_batch = 4;
  repeated DetectorEvaluation history = 5 [(buf.validate.field).repeated.max_items = 100];
  bool incident_open = 6;
  bool responder_done = 7;
  IncidentRequest incident_request = 8;
  IncidentResult incident_result = 9;
  string dispatch_error = 10;
  google.protobuf.Timestamp incident_detected_at = 11;
  google.protobuf.Timestamp incident_dispatched_at = 12;
  google.protobuf.Timestamp responder_completed_at = 13;
  reserved 14, 15, 16;
  reserved "detector_review_required", "detector_review_required_at", "detector_review_reason";
  // Start of each detector's current clear streak.
  map<string, google.protobuf.Timestamp> detector_clear_since = 17;
  reserved 18;
  reserved "incident_observed_changes";
  DispatchState dispatch_state = 19 [(buf.validate.field).enum.defined_only = true];
  repeated string incident_finding_keys = 20;
  IncidentClosure pending_closure = 21;
  ClosureState closure_state = 22 [(buf.validate.field).enum.defined_only = true];
  ClosureReceipt closure_receipt = 23;
  ClosureFailure closure_failure = 24;
  string last_acknowledged_incident_id = 25;
  reserved 26;
  reserved "pending_releases";
  int32 evaluation_iteration = 27;
  repeated DetectorTimelineEntry detector_timeline = 28 [(buf.validate.field).repeated.max_items = 64];
  IncidentView incident_view = 29;
  repeated DriftEvent drift_events = 30;
  OwnershipAdoptionStatus ownership_adoption = 31;
  // Incident-scoped attempt counts, limits and failure outcomes. Never stores
  // plans, applications, rollback progress or pending mutations.
  bytes responder_tool_state_json = 35 [(buf.validate.field).bytes.max_len = 700000];
  // An outbox of failures not yet confirmed in the per-incident archive. The
  // ConfigMap edge archives these before the main CAS and omits them there.
  repeated FailedIncidentClosure failed_closures = 36;
  // Separate incident-scoped CAS document; retained across source adoption.
  SelectionLedger selection_ledger = 37;
  // Exact accepted-source drift assessments survive restart without reopening
  // an unchanged object. Changing source or observed configuration invalidates them.
  repeated DriftEvent accepted_source_drift = 38;
  string accepted_source_drift_revision = 39;
  NamespaceOnboarding namespace_onboarding = 40;
  // Incidents whose failed-attempt reflection is queued or running after its
  // closure was acknowledged, or whose accepted detector change still awaits
  // its controller rollout, oldest first. The broker ledger is the source of
  // truth; this projection lets observers treat it as open work.
  repeated string queued_reflection_incident_ids = 41;
  // The broker ledger could not be read, so the queue above is unknown and
  // observers must treat reflection work as open.
  bool queued_reflections_unknown = 42;
  // Unset while the controller owns no incident work: no open incident, no
  // closure in flight and no queued or running reflection. Otherwise the latest
  // time the controller can still be working, from its own response timeout,
  // verification timeout and closure retry policy, anchored at the moment the
  // work began so it never slides. Observers wait on this one fact.
  google.protobuf.Timestamp busy_until = 43;
  // Heartbeat: Step passes begun since the controller first ran, counted once
  // observationMu is held, whether or not the pass found work, took a
  // snapshot, or failed. It stops only when the step loop is blocked, so
  // observers judge a hung controller by it and never by evaluation_iteration.
  int64 step_count = 44;
  // First completed response starts this absolute verification bound. An
  // unconfirmed continuation or controller restart never extends it. A healthy
  // optional source turn starts its own fresh verification window on return.
  // The original response deadline caps both; cleared with the incident.
  google.protobuf.Timestamp verification_deadline_at = 45;
  reserved 32, 33, 34;
  reserved "drift_investigation", "drift_admission", "program_sweep_cursors";
}

// ReflectionDecision is the learning decision the broker recorded for an
// incident.
message ReflectionDecision {
  string learning_decision = 1 [(buf.validate.field).string = {in: ["updated", "no_change", "sdk_gap", "failed"]}];
  string no_change_reason = 2;
  repeated string playbook_ids = 3;
  string error = 4;
  repeated SdkGap sdk_gaps = 5;
  UsageMetrics usage = 6;
  string decline_reason = 7 [(buf.validate.field).string = {in: ["", "no_recorded_repair"]}];
  // Terminal execution failure; never a model-authored verdict. "timeout" is the
  // controller's frozen task deadline; the others are the worker's typed failure.
  string failure_reason = 8 [(buf.validate.field).string = {in: ["", "timeout", "agent_timeout", "agent_failed", "result_too_large", "request_too_large", "worker_oom_killed", "worker_resources_rewritten"]}];
}

// ProposalRejectionLog is the broker's durable retry state for one proposal
// that has no incident ledger (for example the health judge's diagnostics).
message ProposalRejectionLog {
  string proposal_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated ProposalRejection rejections = 2;
  // True once the retry bound is spent; the last rejection is final.
  bool terminal = 3;
}

message ControllerRolloutExpectation {
  string incident_id = 1;
  string reflection_commit = 2;
  string before_detector_fingerprint = 3;
  string after_detector_fingerprint = 4;
}

// ControllerRolloutReceipt comes from trusted installation code after it
// builds and observes the restarted controller's detector revision.
message ControllerRolloutReceipt {
  ControllerRolloutExpectation expectation = 1;
  string build_artifact = 2;
  string controller_revision = 3;
  string observed_detector_fingerprint = 4;
  bool success = 5;
  google.protobuf.Timestamp verified_at = 6;
}

// ReflectionPhase is the durable reflection proposal lifecycle. Publication is
// one trusted broker effect: its private clone runs gofmt/validator/commit.
enum ReflectionPhase {
  REFLECTION_PHASE_UNSPECIFIED = 0;
  REFLECTION_PHASE_INSPECT = 1;
  REFLECTION_PHASE_DISPATCH = 2;
  REFLECTION_PHASE_REVIEW = 3;
  REFLECTION_PHASE_PUBLISH = 4;
  REFLECTION_PHASE_RESET = 5;
  REFLECTION_PHASE_FAILED_CLEANUP = 6;
  REFLECTION_PHASE_DONE = 7;
  REFLECTION_PHASE_INSPECT_RESULT = 8;
}

// BrokerLedger is the Go incident broker's durable per-incident record, stored
// as ProtoJSON under the worktree root's native-ledger directory.
message BrokerLedger {
  option (buf.validate.message).cel = {
    id: "broker_ledger.terminal_rejection_has_record"
    message: "a terminal reflection rejection requires a recorded rejection and no reflection commit"
    expression: "!this.reflection_rejected || (size(this.reflection_rejections) > 0 && this.reflection_commit == '')"
  };
  string incident_id = 1;
  IncidentClosure closure = 2;
  string proposal_commit = 3;
  OutcomeRecord outcome_document = 4;
  bool requires_reflection = 5;
  string outcome_commit = 6;
  bool reflection_processed = 7;
  ReflectionDecision reflection_decision = 8;
  string reflection_commit = 9;
  ControllerRolloutExpectation rollout_expectation = 10;
  repeated ControllerRolloutReceipt rollout_receipts = 11;
  ClosureReceipt receipt = 12;
  bool acknowledged = 13;
  google.protobuf.Timestamp acknowledged_at = 14;
  // Broker rejections of reflection proposals, one per rejected attempt. The
  // count is the retry state, so a restart neither resets nor repeats attempts.
  repeated ProposalRejection reflection_rejections = 15;
  // True once the retry bound is spent: the closure completes without a
  // reflection commit and the last rejection is the terminal record.
  bool reflection_rejected = 16;
  string reflection_skipped_reason = 17;
  map<string, google.protobuf.Timestamp> closure_phase_timestamps = 18;
  reserved 19;
  reserved 20;
  ReflectionPhase reflection_phase = 21 [(buf.validate.field).enum.defined_only = true];
  ProposalWorkspace reflection_workspace = 22;
  repeated string reflection_paths = 23;
  // Completed decisions survive rejection/reset of a proposal checkout.
  repeated ReflectionDecision reflection_results = 24;
  uint32 reflection_max_retries = 25;
  google.protobuf.Timestamp reflection_dispatch_at = 26;
  // Distinct resource/phase observations absent from protected recordings.
  optional uint32 reflection_no_repair_count = 27;
  // A failed attempt's reflection is queued behind its acknowledgment so the
  // incident's follow-up does not wait for it. Replayed after restart.
  bool reflection_queued = 28;
  google.protobuf.Timestamp reflection_queued_at = 29;
  // Non-blocking coverage gaps the accepted reflection commit carries (a verified
  // cause without a program, a skipped healthy replay, an unreachable repeat).
  // The count is the number of entries; the committed outcome file stays immutable.
  repeated MemoryDiagnostic reflection_coverage_gaps = 30;
}

// Source field ownership adoption survives controller restarts.
message OwnershipAdoptionStatus {
  string source_commit = 1;
  int32 adopted_objects = 2;
  int32 conflicts_taken_over = 3;
  repeated string from_managers = 4;
  string last_error = 5;
  string skipped_reason = 6;
  google.protobuf.Timestamp retry_at = 7;
  int32 failures = 8;
  // Objects SDO has recorded as accepted ("apiVersion/kind/namespace/name"),
  // across source commits. A later record loss on one of them is re-stamped
  // without absorbing other managers' undeclared fields.
  repeated string accepted_objects = 9;
  // Declared objects this pass left alone because adoption cannot handle
  // their kind ("apiVersion/kind/namespace/name: reason"). They stay in the
  // source inventory; they carry no acceptance record.
  repeated string unadopted_objects = 10;
}

