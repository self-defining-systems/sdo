syntax = "proto3";

package sdodev.contracts.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "sdodev/contracts/v1alpha1/common.proto";
import "sdodev/contracts/v1alpha1/messages.proto";
import "sdodev/contracts/v1alpha1/program.proto";

option go_package = "sdo.dev/operator/contracts/gen/sdodev/contracts/v1alpha1;contractsv1alpha1";

// MemoryHost is transport-independent. The initial launcher uses a Unix socket;
// a later sidecar can implement the same service without changing callers.
service MemoryHostService {
  rpc Traffic(TrafficRequest) returns (TrafficResponse);
  rpc Ready(ReadyRequest) returns (ReadyResponse);
  rpc Mirror(stream MirrorRequest) returns (MirrorResponse);
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
  // RunProgram runs one accepted playbook against the controller's invocation view.
  rpc RunProgram(stream RunProgramRequest) returns (stream RunProgramResponse);
  // ReadState runs one app-state reader (appstate.Reader) over the host's live
  // read factory and returns the key-value state it read.
  rpc ReadState(ReadStateRequest) returns (ReadStateResponse);
}

message ReadyRequest {}
message ReadyResponse {
  string memory_commit = 1;
  string binary_digest = 2;
  uint64 mirror_sequence = 3;
  bool mirror_complete = 4;
  repeated MemoryDetectorRegistration detectors = 5;
  repeated ProgramSpec programs = 6;
  repeated string mitigator_ids = 7;
  // The accepted revision's .sdo/diagnostics/telemetry/sources.yaml, byte for
  // byte as compiled into this host (empty when the revision has none). Bound
  // to memory_commit by binary_digest, so a swap rebuilds the controller's
  // sources from exactly the accepted bindings.
  bytes telemetry_sources = 8;
}

message MemoryDetectorRegistration {
  string id = 1;
  // SDK registration metadata, including watches and optional input queries.
  google.protobuf.Struct specification = 2;
}

// Reset and all initial objects precede a complete marker. Subsequent frames
// contain only informer deltas. Sequence numbers are contiguous within a host.
message MirrorRequest {
  uint64 sequence = 1;
  bool reset_mirror = 2;
  string namespace = 3;
  repeated MemoryObject upserts = 4;
  repeated ObjectRef deletes = 5;
  bool complete = 6;
}
message MemoryObject {
  ObjectRef ref = 1;
  // Kubernetes JSON; Secrets contain SDK metadata only, never Secret data.
  google.protobuf.Struct object = 2;
}
message MirrorResponse { uint64 sequence = 1; }

message MemoryObservation {
  reserved 8;
  reserved "snapshot";
  google.protobuf.Timestamp observed_at = 1;
  // Frozen SDK input windows. Absent input remains unavailable, never empty.
  map<string, google.protobuf.Struct> traffic = 2;
  google.protobuf.Struct reachability = 3;
  map<string, google.protobuf.Struct> metrics = 4;
  google.protobuf.Struct alerts = 5;
  google.protobuf.Struct usage = 6;
  map<string, google.protobuf.Struct> logs = 7;
  // Frozen scoped observation (sdk.ScopedSnapshot JSON): declared foreign
  // Deployments, Services, Endpoints and admission webhooks with statuses.
  // Absent means the controller observed no scope.
  google.protobuf.Struct scoped = 9;
  // Frozen server-side dry-run Pod admission result (sdk.PodAdmissionResult).
  google.protobuf.Struct pod_admission = 10;
  // Frozen in-container command output by query ID (podread.Result).
  map<string, google.protobuf.Struct> pod_reads = 11;
  // Frozen vantage probe readings by probe ID (vantage.Result).
  map<string, google.protobuf.Struct> vantage = 12;
  // The platform observation (sdk.Platform) was deleted unused.
  reserved 13;
  reserved "platform";
  // The controller's self-heal hold (sdk.SelfHealPolicy). Absent means the
  // SDK default.
  google.protobuf.Duration self_heal_hold = 14;
  // Observed time-to-ready of each workload ("Kind/name") from its recent
  // healthy starts (sdk.ObservedStartupSource). Absent means none observed.
  map<string, google.protobuf.Duration> observed_startup = 18;
  // Frozen app-state reader results by reader ID (carried.Result): the ring of
  // recent snapshots, the last-healthy snapshot and the healthy history.
  map<string, google.protobuf.Struct> app_state = 15;
  // Alert keys (detector ID, NUL, fingerprint) of the incident open at the
  // snapshot (sdk.HeldAlertSource). Empty means none is open.
  repeated string held_keys = 16;
  // The kinds ("<apiVersion>/<Kind>") the controller's snapshot lists completely
  // for its namespace (sdk.CompleteKindSource). Only for these is a missing
  // object absent; for any other kind the host cannot say. Empty means none.
  repeated string complete_kinds = 17;
}
// ReadStateRequest names one reader (the ID of a health detector that
// implements appstate.Reader). The host reads against its latest complete
// mirror; no frozen view is needed because the controller never waits on the
// reader. observed_at is the controller clock's time for the reader's view.
// pod_reads are the frozen results of the pod reads the reader declares, which
// the controller collects for that reader alone (its own budget, never the
// detection cycle's), keyed by query ID.
message ReadStateRequest {
  string reader_id = 1;
  google.protobuf.Timestamp observed_at = 2;
  map<string, google.protobuf.Struct> pod_reads = 3;
}
// ReadStateResponse carries the state, or the reason the call failed. A failed
// read is data, not a transport error.
message ReadStateResponse {
  map<string, string> values = 1;
  string error = 2;
}

message EvaluateRequest {
  repeated string detector_ids = 1;
  uint64 mirror_sequence = 2;
  MemoryObservation observation = 3;
  // Source and baseline diffs the controller froze for the watched objects; a
  // detector reads them through DiffAgainstSource/DiffAgainstBaseline.
  repeated MemoryReadReceipt reads = 4;
}
message MemoryDetectorResult {
  string detector_id = 1;
  repeated Finding findings = 2;
  string error = 3;
  // error_class is the read class of error: absent, refused, unavailable or
  // invalid (sdk.ReadErrorClass). Empty means unclassified, which reads as
  // unavailable; a detector that panicked is invalid.
  string error_class = 4;
}
message EvaluateResponse { repeated MemoryDetectorResult results = 1; }

// Read receipts are produced by the host and keyed by the requested primitive.
// Programs cannot acquire a cluster writer through this protocol.
message MemoryReadReceipt {
  string operation = 1;
  reserved 2;
  google.protobuf.Value arguments = 3;
  google.protobuf.Value result = 4;
  string error = 5;
  // error_class is the read class of error: absent, refused, unavailable or
  // invalid (sdk.ReadErrorClass). A replay rebuilds an error of the same class.
  // Empty means a legacy receipt, which reads as unavailable.
  string error_class = 6;
}
message MemoryProgramInvocation {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_DIAGNOSE = 1;
    OPERATION_MITIGATE = 2;
  }
  string program_id = 1;
  repeated Binding bindings = 2;
  Operation operation = 3;
}

message RunProgramRequest {
  oneof frame {
    MemoryProgramInvocation invocation = 1;
    ProgramReadReply read = 2;
  }
}

message RunProgramResponse {
  oneof frame {
    ProgramReadCall read = 1;
    Verdict verdict = 2;
    Plan plan = 3;
    string error = 4;
  }
}

// Exactly one read may be outstanding. The operation names a method of the
// read-only SDK interface. Each argument and return value is SDK JSON, keeping
// integers and Kubernetes field types intact.
message ProgramReadCall {
  string method = 1;
  repeated bytes arguments = 2;
}
message ProgramReadReply {
  repeated bytes values = 1;
  string error = 2;
  string error_class = 3;
  optional string usage_unavailable = 4;
}

// Host-owned traffic scheduler and read-only primitives. No mutation operation
// is representable. Observations use the SDK window and burst JSON schemas.
message TrafficRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_START = 1;
    OPERATION_STOP = 2;
    OPERATION_RESET = 3;
    OPERATION_WINDOWS = 4;
    OPERATION_BURST = 5;
    OPERATION_PROBE = 6;
    OPERATION_DIALS = 7;
  }
  Operation operation = 1;
  string workload = 2;
  repeated string scenarios = 3;
  ObjectRef target = 4;
  int32 port = 5;
  string pod_ip = 6;
  string http_method = 7;
  string http_path = 8;
  map<string, string> http_headers = 9;
  int64 timeout_ns = 10;
  repeated TrafficDialTarget dial_targets = 11;
  // JSON pointers (RFC 6901) to scalars in an HTTP probe's response body, by name.
  map<string, string> http_fields = 12;
}
message TrafficResponse {
  map<string, google.protobuf.Struct> windows = 1;
  google.protobuf.Struct burst = 2;
  bool success = 3;
  string detail = 4;
  google.protobuf.Struct dials = 5;
  int32 http_status = 6;
  // The scalars an HTTP probe extracted by pointer; the body is dropped.
  google.protobuf.Struct fields = 7;
}

message TrafficDialTarget {
  string service = 1;
  int32 port = 2;
  string port_name = 3;
}
