syntax = "proto3";

// Playbook program inputs, decisions, and plans exchanged across process
// boundaries. Execution and outcome integration are defined separately.
package sdodev.contracts.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "sdodev/contracts/v1alpha1/common.proto";

option go_package = "sdo.dev/operator/contracts/gen/sdodev/contracts/v1alpha1;contractsv1alpha1";

message ProgramSpec {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  repeated ParamSpec params = 2;
}

message ParamSpec {
  option (buf.validate.message).cel = {id: "parameter.exactly_one_kind" message: "parameter requires an object kind or value kind; defaults require a value kind" expression: "(this.kind != '') != (this.value_kind != '') && (this.value_kind != '' || !has(this.default))"};
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string kind = 2;
  bool required = 3;
  string value_kind = 4 [(buf.validate.field).string = {in: ["", "string", "int", "quantity", "duration", "bool"]}];
  google.protobuf.Value default = 5;
}

message Binding {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  option (buf.validate.message).cel = {id: "binding.exactly_one" message: "binding requires an object or a value" expression: "has(this.object) != has(this.value)"};
  ObjectRef object = 2;
  google.protobuf.Value value = 3;
}


message Verdict {
  option (buf.validate.message).cel = {
    id: "verdict.question_for_judgement"
    message: "question is required only for needs judgement"
    expression: "this.result == 4 ? this.question != '' : this.question == ''"
  };

  enum Result {
    RESULT_UNSPECIFIED = 0;
    RESULT_MATCH = 1;
    RESULT_NO_MATCH = 2;
    RESULT_UNKNOWN = 3;
    RESULT_NEEDS_JUDGEMENT = 4;
  }

  Result result = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  repeated Evidence evidence = 2;
  string question = 3;
}

message Evidence {
  ObjectRef resource = 1 [(buf.validate.field).required = true];
  string fact = 2 [(buf.validate.field).string.min_len = 1];
  string observed = 3;
  string expected = 4;
}

message Plan {
  repeated Action actions = 1;
  string rationale = 2;
}

message Action {
  oneof kind {
    option (buf.validate.oneof).required = true;
    ReconcileFromSource reconcile_from_source = 1;
    Rollback rollback = 2;
    SetField set_field = 3;
    RestartRollout restart_rollout = 4;
    CreateFromSource create_from_source = 5;
    DeleteObject delete_object = 6;
    DeletePod delete_pod = 7;
    ScaleWorkload scale_workload = 8;
    Exec exec = 9;
  }
}

message CreateFromSource {
  ObjectRef ref = 1 [(buf.validate.field).required = true];
  string reason = 2 [(buf.validate.field).string.min_len = 1];
}

// Irreversible; its preimage is evidence, never recreation authority.
message DeleteObject {
  ObjectRef ref = 1 [(buf.validate.field).required = true];
  string reason = 2 [(buf.validate.field).string.min_len = 1];
}

message PlanObjectEffect {
  string operation = 1 [(buf.validate.field).string = {in: ["create", "delete"]}];
  ObjectRef ref = 2 [(buf.validate.field).required = true];
  string uid = 3;
  string state = 4 [(buf.validate.field).string = {in: ["not_applied", "applied", "unknown"]}];
  bool confirmed = 5;
  bool irreversible = 6;
  // Read-only nonsecret evidence. Never replay or auto-recreate from it.
  google.protobuf.Struct deleted_pre_image = 7;
}

message ReconcileFromSource {
  ObjectRef ref = 1 [(buf.validate.field).required = true];
}

message Rollback {
  ObjectRef ref = 1 [(buf.validate.field).required = true];
  string to_revision = 2 [(buf.validate.field).string.min_len = 1];
}

message SetField {
  ObjectRef ref = 1 [(buf.validate.field).required = true];
  string path = 2 [(buf.validate.field).string.min_len = 1];
  reserved 3, 5;
  reserved "value_from_source";
  PlanValue value = 8 [(buf.validate.field).required = true];
  string reason = 4 [(buf.validate.field).string.min_len = 1];
  string document_format = 6 [(buf.validate.field).string = {in: ["", "json", "yaml"]}];
  repeated string document_path = 7;
}

// Values describe authority; resolved data never crosses this contract.
message PlanValue {
  oneof origin {
    option (buf.validate.oneof).required = true;
    ValueField source = 1;
    ValueField observed = 2;
    string parameter = 3 [(buf.validate.field).string.min_len = 1];
  }
}

message ValueField {
  ObjectRef ref = 1 [(buf.validate.field).required = true];
  string path = 2 [(buf.validate.field).string.min_len = 1];
}

message ValueProvenance {
  string origin = 1 [(buf.validate.field).string = {in: ["source", "observed", "parameter"]}];
  ObjectRef ref = 2;
  string path = 3;
  string source_commit = 4;
  string resource_version = 5;
  string parameter = 6;
}

message ActionReport {
  uint32 action_index = 1;
  string status = 2 [(buf.validate.field).string = {in: ["prepared", "applied", "refused", "unknown"]}];
  repeated ValueProvenance values = 3;
  optional int32 exit_code = 4;
}

message DeletePod {
  ObjectRef ref = 1 [(buf.validate.field).required = true];
}

message ScaleWorkload {
  ObjectRef ref = 1 [(buf.validate.field).required = true];
  PlanValue replicas = 2 [(buf.validate.field).required = true];
}

message Exec {
  ObjectRef pod = 1 [(buf.validate.field).required = true];
  string container = 2 [(buf.validate.field).string.min_len = 1];
  repeated PlanValue command = 3 [(buf.validate.field).repeated.min_items = 1];
}

message RestartRollout {
  ObjectRef ref = 1 [(buf.validate.field).required = true];
  string reason = 2 [(buf.validate.field).string.min_len = 1];
}

message ProgramRun {
  string program_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated Binding bindings = 2;
  Verdict verdict = 3 [(buf.validate.field).required = true];
  google.protobuf.Duration duration = 4 [(buf.validate.field).required = true];
  string error = 5;
  string finding_fingerprint = 6;
  string program_revision = 7;
  string binding_source = 8 [(buf.validate.field).string = {in: ["", "finding", "hint", "sweep"]}];
  // Registry capability, not plan validity or trust. Absent on older runs.
  optional bool can_mitigate = 9;
}

// A landed mutation whose rollout is blocked. This never supplies repair credit.
message RolloutPending {
  string reason = 1;
  repeated RolloutBlocker blockers = 2;
}

message RolloutBlocker {
  ObjectRef ref = 1;
  string reason = 2;
  repeated string warning_events = 3;
}

message PlanApplication {
  Plan plan = 1 [(buf.validate.field).required = true];
  bool applied = 2;
  bool dry_run = 3;
  Verdict verification = 4;
  string application_id = 5;
  repeated string program_ids = 6;
  string error = 7;
  google.protobuf.Duration duration = 8;
  bool rolled_back = 9;
  string rollback_error = 10;
  // Applied actions are outcome evidence, never a restart mutation journal.
  reserved 11, 13;
  reserved "pre_images", "patches";
  repeated Action actions_applied = 12;
  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Timestamp completed_at = 15;
  bool verification_completed = 16;
  bool verification_passed = 17;
  // Final exact plan equivalence. False means no credit, not a program failure.
  optional bool final_equivalence_verified = 18;
  repeated PlanObjectEffect object_effects = 19;
  repeated ActionReport action_reports = 20;
  RolloutPending rollout_pending = 21;
}

message ProgramToolCall {
  string command = 1;
  google.protobuf.Timestamp at = 2;
  string request_json = 3;
  string response_json = 4;
  string error = 5;
  string summary = 6;
}

message PlanPreImage {
  reserved 1, 2;
  reserved "ref", "object";
}
message PlanPatch {
  reserved 1, 2;
  reserved "ref", "patch_json";
}

// Go-owned per-cause work; grouping is exactly the responder's confirmed resources.
message ReflectionCauseWork {
  uint32 cause_index = 1;
  repeated ObjectRef resources = 2;
  repeated ReflectionWorkItem items = 3;
}

message ReflectionWorkItem {
  string program_id = 1;
  repeated Binding bindings = 2;
  string disposition = 3 [(buf.validate.field).string = {in: ["covered", "false_match", "question"]}];
  string question = 4;
  string reason = 5 [(buf.validate.field).string = {in: ["verified_equivalent_repair", "fixed_capture_match", "binding_not_written", "repair_equivalence_question", "unbound_write", "uncertain", "evidence_gap", "program_refinement"]}];
  repeated ObjectRef resources = 6;
  string evidence_phase = 7 [(buf.validate.field).string = {in: ["", "open", "fixed"]}];
  string program_revision = 8;
  string capture_open_phase = 9 [(buf.validate.field).string = {in: ["", "detect", "pre-apply"]}];
  // The observed abstention motivating a program_refinement question. This is
  // evidence for review, not a settled positive corpus case or success credit.
  ProgramRun evaluation = 10;
}

// Controller-settled learning evidence, persisted before the outcome commit.
// Absence on historical outcomes is unproven and never supplies success credit.
message ReflectionEligibility {
  uint32 version = 1 [(buf.validate.field).uint32.const = 1];
  repeated ReflectionCauseWork causes = 2;
  repeated ReflectionWorkItem unassigned = 3;
  optional uint32 evidence_gap_count = 4;
}

// Incident-open diagnosis coverage. This is information, never apply authority.
message PlaybookCoverage {
  repeated PlaybookMatch matches = 1;
  repeated string unexplained_finding_fingerprints = 2;
}
message PlaybookMatch {
  string playbook_id = 1;
  string program_revision = 2;
  repeated Binding bindings = 3;
  repeated string explained_finding_fingerprints = 4;
  bool can_mitigate = 5;
  // Logical program selection for a fresh menu at these bindings.
  string mitigation_selection = 6;
  int32 verified_successes = 7;
  int32 verified_failures = 8;
}
