syntax = "proto3";

// Operational-memory tooling contracts: the output of `sdo-operator memory
// check|ls|outcomes --json`. The validator that produces MemoryDiagnostic is
// shared by the commit broker and by agent self-checks.
package sdodev.contracts.v1alpha1;

import "buf/validate/validate.proto";
import "sdodev/contracts/v1alpha1/outcome.proto";

option go_package = "sdo.dev/operator/contracts/gen/sdodev/contracts/v1alpha1;contractsv1alpha1";

// One validation finding. `rule` is a stable rule ID; `path` is repository
// relative; `line` is zero when the finding is not tied to a line.
message MemoryDiagnostic {
  string rule = 1 [(buf.validate.field).string.min_len = 1];
  string path = 2;
  int32 line = 3 [(buf.validate.field).int32.gte = 0];
  string message = 4 [(buf.validate.field).string.min_len = 1];
  string hint = 5;
  MemoryConflict memory_conflict = 6;

}

// A rejected replay onto a newer accepted memory head. No candidate bytes were
// published. Reflection resumes against accepted_commit and resolves both intents.
message MemoryConflict {
  string base_commit = 1;
  string accepted_commit = 2;
  repeated string conflicting_paths = 3;
  repeated AcceptedMemoryChange accepted_changes = 4;
  repeated MemoryDiagnostic validator_errors = 5;
}

// Accepted publications that changed the relevant paths since base_commit.
message AcceptedMemoryChange {
  string commit = 1;
  string incident_id = 2;
  repeated string paths = 3;
}

// Informational mitigation policy result, never a trust credit.
message MitigationReplayNote {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_REPLAYED = 1;
    STATUS_SKIPPED_UNREPLAYABLE_EFFECT = 2;
    STATUS_OBSERVED_TRANSITION = 3;
  }
  string program_id = 1;
  string case_id = 2;
  Status status = 3;
  repeated string effects = 4;
}

// Result of `memory check`.
message MemoryCheckReport {
  repeated MemoryDiagnostic diagnostics = 1;
  string root = 2;
  string actor = 3;
  string phase = 4;
  string base = 5;
  repeated MitigationReplayNote mitigation_replay_notes = 6;
}

// One artifact of operational memory, identified by its logical ID.
message MemoryArtifact {
  string kind = 1 [(buf.validate.field).string.min_len = 1];
  string id = 2;
  string path = 3 [(buf.validate.field).string.min_len = 1];
  // Detector class (health or incident); empty for other kinds.
  string detector_class = 4;
}

// Result of `memory ls`.
message MemoryListing {
  repeated MemoryArtifact artifacts = 1;
}

// Result of `memory outcomes`: every stored outcome record.
message MemoryOutcomes {
  repeated OutcomeRecord outcomes = 1;
}
