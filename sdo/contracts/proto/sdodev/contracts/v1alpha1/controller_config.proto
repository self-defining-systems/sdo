syntax = "proto3";

// ControllerConfig is the controller's own launch configuration: the one typed
// object the launcher populates (serialized once, mounted) and the controller
// reads, replacing the hand-mirrored argv-flag boundary between the Python
// launcher and the controller entry point (seam 3). A flag the launcher sets that the controller does not define used to
// crash every controller pod with "unrecognized arguments" (the
// --closeout-state-gate drift); with one shared message a missing field is a
// build error instead.
//
// This is distinct from the in-process runtime.ControllerConfig (detector
// thresholds, intervals), which the controller derives from this launch config.
// Serialized as protojson like every other contract.
package sdodev.contracts.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

option go_package = "sdo.dev/operator/contracts/gen/sdodev/contracts/v1alpha1;contractsv1alpha1";

message ControllerConfig {
  // Observation and identity.
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string control_namespace = 2;
  string app_root = 3 [(buf.validate.field).string.min_len = 1];
  string application = 4;
  string source_commit = 5;
  string deployed_commit = 6;

  // Responder dispatch.
  // Deprecated and ignored: the controller resolves the worker through the agent
  // registry. Kept so existing ControllerConfig documents stay wire-compatible.
  string dispatcher = 7 [deprecated = true];
  repeated string dispatcher_args = 9 [deprecated = true];
  string dispatcher_mode = 8 [(buf.validate.field).string = {in: ["job"]}];
  string responder_image = 10;
  string repository_pvc = 11;
  string repository_mount_path = 12;
  string repository_pvc_subpath = 13;
  string responder_credentials_secret = 14;
  repeated string responder_env = 15;

  reserved 16, 18;
  reserved "broker", "broker_args";
  // Go-owned repository broker proposal root.
  string broker_worktree_root = 17;

  // Telemetry.
  string firing_telemetry_path = 19;

  // Timing and policy.
  google.protobuf.Duration duration = 20;
  google.protobuf.Duration response_timeout = 21;
  google.protobuf.Duration verification_timeout = 22;
  reserved 23, 24;
  reserved "max_follow_ups", "follow_up_cooldown";
  string repair_policy = 25 [(buf.validate.field).string = {in: ["commit", "recorded-actions"]}];

  // Leader election.
  string lease_name = 26;
  google.protobuf.Duration lease_duration = 27;
  string identity = 28;

  // Lifecycle. Non-zero controller defaults (synthetic_traffic,
  // clean_responder_helpers, state_baseline are true) use `optional` so an unset
  // field keeps the controller default rather than flipping to false.
  bool exit_after_closure = 29;
  bool restart_after_closure = 30;
  string maintenance_configmap = 31;
  google.protobuf.Duration maintenance_poll_interval = 32;
  google.protobuf.Duration resume_sync_timeout = 33;
  optional bool synthetic_traffic = 34;
  google.protobuf.Duration synthetic_traffic_warmup = 35;
  string prober_binary = 36;
  string prober_image = 37;
  string prober_url = 38;
  optional bool clean_responder_helpers = 39;
  optional bool state_baseline = 40;

  // Directory of agent registration manifests. When omitted the controller
  // reads the built-in manifests baked into its image, with responder_image
  // substituted as their launch image.
  string agent_registration_directory = 41;
  string responder_agent_id = 42;

  // Build provenance carried into the running controller. Native broker
  // rollout receipts compare these with the accepted detector tree and
  // launched artifact; an image tag alone is not evidence of a rollout.
  string diagnostics_fingerprint = 43;
  string controller_artifact_digest = 44;
  string controller_revision = 45;

  // Native broker selection is carried into the compiled controller child.
  // A native launch must also use proposal-only worker mounts; these fields
  // are checked together before the controller acquires its lease.
  string broker_mode = 46;
  string validator_image = 47;
  string schema_identity = 48;
  string responder_backend = 49;
  string responder_model = 50;
  string worker_mount_mode = 51;

  // Operator policy for the outcome reflection session. A resumed session
  // requires a valid responder session ID from the accepted closure.
  string reflection_session = 52 [(buf.validate.field).string = {in: ["", "fresh", "resume"]}];
  string reflection_guidance = 53 [(buf.validate.field).string = {in: ["", "baseline", "generalize", "generalize-spec"]}];

  // Replays incident detectors on benchmark-supplied healthy snapshots. The
  // validator receives only the bounded snapshot directory, read-only.
  bool healthy_baseline = 54;
  int32 max_response_loops = 55 [(buf.validate.field).int32.gte = 0];
  google.protobuf.Duration diagnosis_deadline = 56;
  google.protobuf.Duration diagnosis_settle_delay = 57;
  google.protobuf.Duration drift_sweep_interval = 58;
  reserved 59, 60, 61;
  reserved "drift_investigation_window", "drift_investigation_dispatches_per_hour", "drift_investigation_tokens_per_hour";
  google.protobuf.Duration drift_batch_window = 66;
  reserved 67, 68;
  reserved "drift_dispatches_per_hour", "drift_tokens_per_hour";
  bool force_reflection = 62;
  repeated string deployed_manifest_paths = 63;
  bool program_fast_path = 64;
  int32 program_trust_threshold = 65 [(buf.validate.field).int32.gte = 0];
  // Unset uses the runtime's 10-second firing and clearing confirmation.
  google.protobuf.Duration program_min_duration = 69 [(buf.validate.field).duration.gte = {}];

  // Prometheus-compatible API that metric and alert detectors query once per
  // evaluation cycle. Unset runs no metrics source: detectors that need one
  // report an error instead of health. The token file holds an optional bearer
  // token and requires metrics_url.
  string metrics_url = 70;
  string metrics_token_file = 71;
  // Independently reviewed fixture policy, pinned by administrator launch config.
  // Never populate these fields from responder, plan, or dry-run output.
  string plan_safety_policy_json = 72;
  string plan_safety_policy_sha256 = 73;
  // Reviewed source-only policy; generated per incident, never from plans.
  string plan_source_policy_json = 74;
}
