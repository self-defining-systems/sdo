syntax = "proto3";

// ControllerConfig is the controller's own launch configuration: the one typed
// object the launcher populates (serialized once, mounted) and the controller
// reads, replacing the hand-mirrored argv-flag boundary between the Python
// launcher and the controller entry point (seam 3). A flag the launcher sets that the controller does not define used to
// crash every controller pod with "unrecognized arguments" (the
// --closeout-state-gate drift); with one shared message a missing field is a
// build error instead.
//
// This is distinct from the in-process runtime.ControllerConfig (detector
// thresholds, intervals), which the controller derives from this launch config
// and the operator configuration at settings_path.
// Serialized as protojson like every other contract.
//
// ControllerConfig is wiring: namespaces, images, the PVC, commits and paths.
// Timing and policy (timeouts, loops, repair policy, mode, reflection, agent
// provider, model and effort) live only in the operator configuration
// (contracts/settings), read from settings_path.
package sdodev.contracts.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "sdodev/contracts/v1alpha1/deployment_source.proto";

option go_package = "sdo.dev/operator/contracts/gen/sdodev/contracts/v1alpha1;contractsv1alpha1";

message ControllerConfig {
  reserved "memory_host";
  string memory_host_binary = 82;
  string memory_host_digest = 83;
  // Observation and identity.
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string control_namespace = 2;
  string app_root = 3 [(buf.validate.field).string.min_len = 1];
  string application = 4;
  string source_commit = 5;
  string deployed_commit = 6;

  // Responder dispatch. The controller resolves the worker through the agent
  // registry and always dispatches Kubernetes Jobs.
  reserved 7, 8, 9;
  reserved "dispatcher", "dispatcher_mode", "dispatcher_args";
  string responder_image = 10;
  string repository_pvc = 11;
  string repository_mount_path = 12;
  string repository_pvc_subpath = 13;
  string responder_credentials_secret = 14;
  // Responder environment is the operator configuration's agent.extra_env.
  reserved 15;
  reserved "responder_env";

  reserved 16, 18;
  reserved "broker", "broker_args";
  // Go-owned repository broker proposal root.
  string broker_worktree_root = 17;

  // Telemetry.
  string firing_telemetry_path = 19;

  // Bounded run. Every other timing and policy value is operator
  // configuration (settings_path).
  google.protobuf.Duration duration = 20;
  reserved 21, 22, 23, 24, 25;
  reserved "response_timeout", "verification_timeout", "max_follow_ups", "follow_up_cooldown", "repair_policy";

  // Leader election.
  reserved 26, 27;
  reserved "lease_name", "lease_duration";
  string identity = 28;

  // Lifecycle.
  bool exit_after_closure = 29;
  reserved 30;
  reserved "restart_after_closure";
  string maintenance_configmap = 31;
  reserved 32, 33, 34, 35;
  reserved "maintenance_poll_interval", "resume_sync_timeout", "synthetic_traffic", "synthetic_traffic_warmup";
  reserved 36;
  reserved "prober_binary";
  reserved 37;
  reserved "prober_image";
  reserved 38;
  reserved "prober_url";
  reserved 39, 40;
  reserved "clean_responder_helpers", "state_baseline";

  // Directory of agent registration manifests. When omitted the controller
  // reads the built-in manifests baked into its image, with responder_image
  // substituted as their launch image.
  string agent_registration_directory = 41;
  string responder_agent_id = 42;

  // Build provenance carried into the running controller. Native broker
  // rollout receipts compare these with the accepted detector tree and
  // launched artifact; an image tag alone is not evidence of a rollout.
  string diagnostics_fingerprint = 43;
  string controller_artifact_digest = 44;
  string controller_revision = 45;

  // Native broker selection is carried into the compiled controller child.
  // A native launch must also use proposal-only worker mounts; these fields
  // are checked together before the controller acquires its lease.
  string broker_mode = 46;
  reserved 47;
  reserved "validator_image";
  reserved 48;
  reserved "schema_identity";
  // Agent provider, model, effort, lifecycle limit, replay and reflection
  // policy are operator configuration.
  reserved 49, 50, 101, 117, 102;
  reserved "responder_backend", "responder_model", "agent_effort", "lifecycle_timeout", "replay";
  string worker_mount_mode = 51;
  reserved 52, 53, 54, 55, 56;
  reserved "reflection_session", "reflection_guidance", "healthy_baseline", "max_response_loops", "diagnosis_deadline";
  reserved 57;
  reserved 58;
  reserved "drift_sweep_interval";
  reserved 59, 60, 61;
  reserved "drift_investigation_window", "drift_investigation_dispatches_per_hour", "drift_investigation_tokens_per_hour";
  reserved 66;
  reserved "drift_batch_window";
  reserved 67, 68;
  reserved "drift_dispatches_per_hour", "drift_tokens_per_hour";
  reserved 62;
  reserved "force_reflection";
  reserved 63;
  reserved "deployed_manifest_paths";
  reserved 64;
  reserved 65;
  reserved 69;
  reserved "program_min_duration";

  // Retired metrics flags: the operator's telemetry environment replaces them.
  reserved 70, 71, 81;
  reserved "metrics_url", "metrics_token_file", "metrics_publish_url";
  reserved 72, 73, 74;
  reserved "plan_safety_policy_json", "plan_safety_policy_sha256", "plan_source_policy_json";

  // Trusted controller image supplying Go to compiler-free workers and validators.
  // Required at startup, independently of the optional traffic prober image.
  string toolchain_image = 75;
  // The detection section of the operator configuration (stability window, self-heal hold, drift batch window)
  // reaches the controller through settings_path.
  reserved 76, 119;
  reserved "closure_stability_window", "self_heal_hold";
  reserved 77, 78;
  reserved "responder_report_grace", "responder_standby";
  // Fixed tool image for application-local RunScript Jobs.
  string script_image = 79;
  // Shared remote branch the accepted repository replicates, so lanes of one
  // application on several hosts share one accepted memory. Unset keeps the
  // accepted repository local.
  MemoryUpstream memory_upstream = 80;
  // Named programming-model plugin set: the launcher's typed projection of the
  // operator configuration's agent.code_path and agent.code_path_overrides.
  // An omitted value preserves Go.
  CodePathConfig code_path = 100;
  // The mode (frozen memory, external incidents, watch-only) is operator configuration.
  reserved 110, 111, 118;
  reserved "frozen_memory", "external_incidents", "watch_only";
  // The deployment source is read from the accepted .sdo/deployment/plan.yaml.
  reserved 112;
  reserved "deployment_source";
  // render_environment is the install-time render environment of the accepted
  // deployment; absent means unknown (renderer defaults).
  RenderEnvironment render_environment = 113;
  // deployment_policy is the install-time limit on deployments (registry
  // allowlist, namespace and cluster-scope grants); absent means no limit
  // beyond today's notes.
  DeploymentPolicy deployment_policy = 115;
  // The trusted in-cluster build and apply identity the controller deploys
  // with: the parent's upstream advances and the child's accepted responder
  // source repairs. Absent means nothing can build an image.
  DeployIdentity deploy_identity = 114;
  // Path of the telemetry environment document (sources the operator provides,
  // credential directory, pinning mode). Unset provides no operator source:
  // detectors that query one report an error instead of health.
  string telemetry_environment_file = 116;
  // Path of the resolved operator configuration (contracts/settings.Config
  // YAML) the controller read at start: every timing and policy value. Required.
  string settings_path = 120 [(buf.validate.field).string.min_len = 1];
}

// DeployIdentity is the BuildKit Job image, the registry push Secret and the
// bounds one trusted Deployer builds and applies with. buildkit_image and
// registry_push_secret are set together; registry_insecure needs registry_host.
message DeployIdentity {
  string buildkit_image = 1;
  string registry_push_secret = 2;
  string registry_host = 3;
  bool registry_insecure = 4;
  google.protobuf.Duration build_timeout = 5;
  google.protobuf.Duration build_budget = 6;
  google.protobuf.Duration rollout_timeout = 7;
}

message MemoryUpstream {
  string url = 1 [(buf.validate.field).string.min_len = 1];
  // One branch per run; never the repository's main branch.
  string branch = 2 [(buf.validate.field).string.min_len = 1];
  // Read-only directory holding an ssh identity file and known_hosts for the
  // remote; empty uses the transport's own configuration.
  string ssh_dir = 3;
}

// Code paths compose implementations at independently named runtime seams.
message CodePathConfig {
  string name = 1;
  CodePathOverrides overrides = 2;
}

message CodePathOverrides {
  string detector_source = 1;
  string coverage = 2;
  repeated string response_stages = 3;
  string memory_validation = 4;
  string activation = 5;
  string agent_guidance = 6;
}
