syntax = "proto3";

// The controller<->responder message tree: the incident request the controller
// dispatches, the result the responder returns, the view the controller
// publishes while an incident is open, and the closure the broker records.
// These protobuf messages define the component boundary. The Go controller
// projects its internal state into them explicitly; Python workers parse them
// before adapting to agent-local prompt and output views. Conformance tests
// check both projections against this schema.
//
// Wire convention: protojson, snake_case
// field names, enums carried as their lowercase domain strings (constrained by
// protovalidate, not proto enums, so the existing .sdo/outcomes.jsonl records
// and strict receipts stay readable). Semantic invariants are expressed in
// protovalidate CEL where possible; the UsageMetrics cache-read alias
// *normalization* is a mutation CEL cannot perform and stays a thin hand step
// at the seam (see sdo/contracts/proto.py).
package sdodev.contracts.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "sdodev/contracts/v1alpha1/controller_config.proto";
import "google/protobuf/duration.proto";
import "sdodev/contracts/v1alpha1/common.proto";
import "sdodev/contracts/v1alpha1/program.proto";
import "sdodev/contracts/v1alpha1/traffic.proto";

option go_package = "sdo.dev/operator/contracts/gen/sdodev/contracts/v1alpha1;contractsv1alpha1";

// Finding is one detector observation. Mirrors sdk.Finding.
message Finding {
  string detector_id = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[a-z0-9][a-z0-9_.-]*$"}];
  string rule_id = 2 [(buf.validate.field).string.min_len = 1];
  string status = 3 [(buf.validate.field).string = {in: ["active", "resolved"]}];
  string severity = 4 [(buf.validate.field).string = {in: ["info", "warn", "critical", "latent"]}];
  string summary = 5 [(buf.validate.field).string.min_len = 1];
  string evidence = 6 [(buf.validate.field).string.min_len = 1];
  ObjectRef primary_resource = 7 [(buf.validate.field).required = true];
  repeated ObjectRef related_resources = 8;
  repeated string playbook_ids = 9 [(buf.validate.field).repeated.items.string.pattern = "^[a-z][a-z0-9_-]*$"];
  map<string, ObjectRef> parameter_bindings = 10;
  string fingerprint = 11;
  google.protobuf.Struct metadata = 12;
}

message DriftField {
  string path = 1;
  string old = 2;
  string new = 3;
  string source = 4;
}

message DriftEvent {
  ObjectRef ref = 1;
  repeated DriftField fields = 2;
  string source = 3;
  string manager = 4;
  string operation = 5;
  google.protobuf.Timestamp observed_at = 6;
  string classification = 7 [(buf.validate.field).string = {in: ["fault", "unexplained"]}];
  string program_id = 8;
  google.protobuf.Timestamp manager_at = 9;
  string investigation_status = 10;
  string investigation_verdict = 11 [(buf.validate.field).string = {in: ["", "bug", "benign", "unsure"]}];
  string investigation_reason = 12;
  repeated DriftEvidence investigation_evidence = 13;
  string investigation_capture_id = 14;
}

message DriftEvidence {
  string kind = 1 [(buf.validate.field).string = {in: ["source_contradiction", "violated_relation", "observed_impact"]}];
  string observation = 2;
}

// DetectorEvaluation is one detector's status at a point in time.
// Pending means observations are incomplete: it establishes neither a fault nor health.
message DetectorEvaluation {
  string detector_id = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[a-z0-9][a-z0-9_.-]*$"}];
  google.protobuf.Timestamp evaluated_at = 2 [(buf.validate.field).required = true];
  string status = 3 [(buf.validate.field).string = {in: ["firing", "clear", "error", "pending"]}];
  repeated string fingerprints = 4;
  optional string error = 5;
  // Informational explanation for an unconfirmed observation, not an error.
  optional string reason = 6;
}

message SurfacedPlaybook {
  string playbook_id = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[a-z][a-z0-9_-]*$"}];
  map<string, ObjectRef> parameter_bindings = 2;
}

message PriorOutcomeEvidence {
  string incident_id = 1 [(buf.validate.field).string.min_len = 1];
  string match_reason = 2 [(buf.validate.field).string = {
    in: ["exact-fingerprint", "learned-detector-origin", "detector-rule-resource-kind"]
  }];
  repeated string root_cause_summaries = 3;
  repeated string repair_action_summaries = 4;
  repeated string applied_playbook_ids = 5 [(buf.validate.field).repeated.items.string.pattern = "^[a-z][a-z0-9_-]*$"];
  string source_commit = 6 [(buf.validate.field).string.min_len = 1];
  bool exact_source_match = 7;
}

message StateFieldChange {
  string field = 1 [(buf.validate.field).string.min_len = 1];
  optional string before = 2;
  optional string after = 3;
}

message StateChange {
  string kind = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string change = 3 [(buf.validate.field).string = {in: ["added", "removed", "modified"]}];
  repeated StateFieldChange fields = 4;
 optional string api_version = 5;
 optional string namespace = 6;
}

message StateChanges {
  google.protobuf.Timestamp baseline_at = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp observed_at = 2 [(buf.validate.field).required = true];
  repeated StateChange changes = 3;
  optional int32 omitted = 4 [(buf.validate.field).int32.gte = 0];
  repeated string unobserved_kinds = 5;
}

// Read-only logical memory supplied by the Go storage edge. Agent workers do
// not parse the accepted repository's physical .sdo layout to find context.
message MemoryWatch {
  string api_version = 1;
  string kind = 2;
}

message MemoryDetector {
  string id = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_.-]*$"];
  string detector_class = 2;
  string owner = 3;
  reserved 4;
  repeated MemoryWatch watches = 5;
  int32 firing = 6;
  repeated string possible_playbook_ids = 7 [(buf.validate.field).repeated.items.string.pattern = "^[a-z][a-z0-9_-]*$"];
  string originating_incident = 8;
  string description = 9;
  string predicate_excerpt = 10;
  bool reads_events = 11;
}

message MemoryScript {
  string name = 1;
  string content = 2;
}

message MemoryPlaybook {
  string id = 1 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9_-]*$"];
  string markdown = 2;
  repeated MemoryScript scripts = 3;
}

message OperationalMemorySnapshot {
  // Shell snapshots intentionally retain literal notes, scripts and their file paths.
  CodePathConfig code_path = 100;

  string accepted_commit = 1;
  string goal_markdown = 2;
  string architecture_markdown = 3;
  string playbook_index_markdown = 4;
  repeated MemoryDetector detectors = 5;
  repeated MemoryPlaybook playbooks = 6;
}

// Retired wire-only proposal messages. Direct-edit capabilities reject these;
// retain their descriptors for Buf compatibility. No production writer consumes them.
message ProposedGoSource {
  option deprecated = true;
  string name = 1;
  string content = 2;
}

message ProposedDetector {
  option deprecated = true;
  string id = 1;
  string detector_class = 2;
  string owner = 3;
  string constructor = 4;
  repeated MemoryWatch watches = 5;
  string interval = 6;
  int32 firing = 7;
  int32 clearing = 8;
  string severity = 9;
  string debounce = 10;
  repeated string possible_playbook_ids = 11;
  string originating_commit = 12;
  string originating_incident = 13;
  repeated ProposedGoSource sources = 14;
}

message ProposedPlaybook {
  option deprecated = true;
  string id = 1;
  string owner = 2;
  string fault_class = 3;
  string originating_incident = 4;
  string markdown = 5;
  repeated MemoryScript scripts = 6;
}

message ProposedTrafficGenerator {
  option deprecated = true;
  string id = 1;
  repeated ProposedGoSource sources = 2;
}

message OperationalArtifactProposal {
  option deprecated = true;
  repeated ProposedDetector detectors = 1;
  repeated ProposedPlaybook playbooks = 2;
  repeated ProposedTrafficGenerator traffic_generators = 3;
  repeated TrafficWorkload traffic_workloads = 4;
  repeated string delete_detector_ids = 5;
  repeated string delete_playbook_ids = 6;
}

// IncidentRequest is the snapshot the controller dispatches to the responder.
// NamespaceOnboarding is controller-owned identity acknowledgement at verified
// initial installation. It never asserts content correctness or repair credit.
message NamespaceOnboarding {
  string namespace = 1;
  string accepted_commit = 2;
  google.protobuf.Timestamp established_at = 3;
  repeated ObjectRef objects = 4;
  // Install observations carry no health authority. The digest binds UID,
  // configuration and ownership, excluding API bookkeeping and status.
  repeated InstallEnvironmentObject environment_objects = 5;
}

message InstallEnvironmentObject {
  ObjectRef ref = 1;
  string digest = 2;
}

message IncidentRequest {
  string schema_version = 1 [(buf.validate.field).string.const = "sdo.dev/v1alpha1"];
  string application = 2 [(buf.validate.field).string.min_len = 1];
  string namespace = 3 [(buf.validate.field).string.min_len = 1];
  string incident_id = 4 [(buf.validate.field).string.min_len = 1];
  repeated Finding findings = 5 [(buf.validate.field).repeated.min_items = 1];
  repeated DetectorEvaluation detector_history = 6 [(buf.validate.field).repeated.min_items = 1];
  repeated SurfacedPlaybook surfaced_playbooks = 7;
  repeated PriorOutcomeEvidence relevant_outcomes = 8 [(buf.validate.field).repeated.max_items = 3];
  string source_commit = 9 [(buf.validate.field).string.min_len = 1];
  string deployed_commit = 10 [(buf.validate.field).string.min_len = 1];
  reserved 11, 12;
  reserved "architecture_summary_path", "health_objective_path";
  string repository_worktree = 13 [(buf.validate.field).string.min_len = 1];
  string repository_base_commit = 14 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp response_deadline = 15 [(buf.validate.field).required = true];
  string cancellation_token = 16 [(buf.validate.field).string.min_len = 1];
  string repair_policy = 17 [(buf.validate.field).string = {in: ["commit", "recorded-actions"]}];
  StateChanges state_changes = 18;
  reserved 19;
  reserved "follow_up";
  OperationalMemorySnapshot memory_snapshot = 20;
  repeated ProgramRun initial_program_runs = 21;
  int32 max_response_loops = 22;
  repeated DriftEvent drift_events = 23;
  reserved 24;
  string prepared_agent_task = 25;
  string observation_generation = 26;
  PlaybookCoverage playbook_coverage = 27;
  NamespaceOnboarding namespace_onboarding = 28;
  repeated StageReport prior_stages = 29;
  // Go-owned: each lossy step taken so the request fit the transport limit, in order.
  repeated string compaction = 30;
}

message RootCauseEvidence {
  string kind = 1 [(buf.validate.field).string = {
    in: ["detector-finding", "synthetic-traffic", "state-change", "live-observation"]
  }];
  string source = 2 [(buf.validate.field).string.min_len = 1];
  string observation = 3 [(buf.validate.field).string.min_len = 1];
}

message ConfirmedRootCause {
  string summary = 1 [(buf.validate.field).string.min_len = 1];
  repeated ObjectRef resources = 2 [(buf.validate.field).repeated.min_items = 1];
  repeated RootCauseEvidence evidence = 3;
  repeated string explained_detectors = 4 [(buf.validate.field).repeated.items.string.pattern = "^[a-z0-9][a-z0-9_.-]*$"];
  repeated string static_context = 5;
}

message AppliedPlaybook {
  string playbook_id = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[a-z][a-z0-9_-]*$"}];
  map<string, ObjectRef> parameter_bindings = 2;
  repeated string script_names = 3;
}

message VerificationEvidence {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  bool passed = 2;
  string details = 3 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp observed_at = 4 [(buf.validate.field).required = true];
}

// UsageMetrics is agentshim's normalized token accounting for one turn. The
// CEL below defines the shared validation rule; the built-in responder's
// output view applies the same rule before constructing this message.
// the cache-read alias *normalization* (set cached_input_tokens := cache_read
// when it is zero) is a mutation CEL cannot do and stays a thin hand step.
message UsageMetrics {
  option (buf.validate.message).cel = {
    id: "usage.reasoning_le_output"
    message: "reasoning_output_tokens must not exceed output_tokens"
    expression: "this.reasoning_output_tokens <= this.output_tokens"
  };
  option (buf.validate.message).cel = {
    id: "usage.cache_write_1h_le_cache_write"
    message: "cache_write_1h_input_tokens must not exceed cache_write_input_tokens"
    expression: "!has(this.cache_write_1h_input_tokens) || this.cache_write_1h_input_tokens <= this.cache_write_input_tokens"
  };
  option (buf.validate.message).cel = {
    id: "usage.cached_le_input_when_no_read"
    message: "cached_input_tokens must not exceed input_tokens"
    expression: "has(this.cache_read_input_tokens) || this.cached_input_tokens <= this.input_tokens"
  };
  option (buf.validate.message).cel = {
    id: "usage.cache_write_le_cached_when_no_read"
    message: "cache_write_input_tokens must not exceed cached_input_tokens"
    expression: "has(this.cache_read_input_tokens) || this.cache_write_input_tokens <= this.cached_input_tokens"
  };
  option (buf.validate.message).cel = {
    id: "usage.cached_aliases_read"
    message: "cached_input_tokens is an alias of cache_read_input_tokens and must equal it (or be zero pre-normalization)"
    expression: "!has(this.cache_read_input_tokens) || this.cached_input_tokens == 0 || this.cached_input_tokens == this.cache_read_input_tokens"
  };
  option (buf.validate.message).cel = {
    id: "usage.read_plus_write_le_input"
    message: "cache reads plus cache writes must not exceed input_tokens"
    expression: "!has(this.cache_read_input_tokens) || this.cache_read_input_tokens + this.cache_write_input_tokens <= this.input_tokens"
  };
  option (buf.validate.message).cel = {
    id: "usage.uncached_is_input_minus_read_and_write"
    message: "uncached_input_tokens must equal input minus cache reads and writes"
    expression:
      "!has(this.cache_read_input_tokens) || !has(this.uncached_input_tokens) || "
      "this.uncached_input_tokens == this.input_tokens - this.cache_read_input_tokens - this.cache_write_input_tokens"
  };

  int64 llm_calls = 1 [(buf.validate.field).int64.gte = 0];
  int64 input_tokens = 2 [(buf.validate.field).int64.gte = 0];
  int64 output_tokens = 3 [(buf.validate.field).int64.gte = 0];
  int64 cached_input_tokens = 4 [(buf.validate.field).int64.gte = 0];
  optional int64 cache_read_input_tokens = 5 [(buf.validate.field).int64.gte = 0];
  int64 cache_write_input_tokens = 6 [(buf.validate.field).int64.gte = 0];
  optional int64 cache_write_1h_input_tokens = 7 [(buf.validate.field).int64.gte = 0];
  optional int64 uncached_input_tokens = 8 [(buf.validate.field).int64.gte = 0];
  int64 reasoning_output_tokens = 9 [(buf.validate.field).int64.gte = 0];
  optional int64 model_requests = 10 [(buf.validate.field).int64.gte = 0];
  optional double total_cost_usd = 11 [(buf.validate.field).double.gte = 0];
  // True when at least one included turn was interrupted before final accounting.
  bool partial = 12;
}

message TimingMetrics {
  option (buf.validate.message).cel = {
    id: "timing.ordered"
    message: "completed_at must not be before started_at"
    expression: "this.completed_at >= this.started_at"
  };
  google.protobuf.Timestamp started_at = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp completed_at = 2 [(buf.validate.field).required = true];
}

message RepairActionReceipt {
  option (buf.validate.message).cel = {
    id: "repair_action.ordered"
    message: "completed_at must not be before started_at"
    expression: "this.completed_at >= this.started_at"
  };
  string action_id = 1 [(buf.validate.field).string.min_len = 1];
  string kind = 2 [(buf.validate.field).string.min_len = 1];
  string target = 3 [(buf.validate.field).string.min_len = 1];
  repeated ObjectRef resources = 4;
  string summary = 5 [(buf.validate.field).string.min_len = 1];
  string details = 6 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp started_at = 7 [(buf.validate.field).required = true];
  google.protobuf.Timestamp completed_at = 8 [(buf.validate.field).required = true];
  bool success = 9;
  bool reversible = 10;
  string failure_reason = 11 [(buf.validate.field).string = {in: ["", "authorization_denied", "execution_failed", "delete_not_confirmed", "outcome_unknown", "incident_verified"]}];
  // Controller ownerReference chains of written resources, read from the
  // live object before the write. Cause attribution follows these chains,
  // never generated names.
  repeated ResourceOwners owners = 12;
}

// ResourceOwners is one written resource's controller owner chain, nearest
// owner first (for example Pod -> ReplicaSet -> Deployment).
message ResourceOwners {
  ObjectRef resource = 1 [(buf.validate.field).required = true];
  repeated ObjectRef owner_chain = 2 [(buf.validate.field).repeated.min_items = 1];
}

// IncidentResult is what the responder returns. The CEL enforces unique
// repair action IDs at the component boundary.
message IncidentResult {
  option (buf.validate.message).cel = {
    id: "result.unique_repair_action_ids"
    message: "repair action IDs must be unique"
    expression: "this.repair_actions.all(a, this.repair_actions.filter(b, b.action_id == a.action_id).size() == 1)"
  };
  string schema_version = 1 [(buf.validate.field).string.const = "sdo.dev/v1alpha1"];
  string incident_id = 2 [(buf.validate.field).string.min_len = 1];
  string status = 3 [(buf.validate.field).string = {in: ["completed", "failed", "cancelled"]}];
  repeated ConfirmedRootCause confirmed_root_causes = 4;
  repeated AppliedPlaybook applied_playbooks = 5;
  repeated string repair_changes = 6;
  repeated RepairActionReceipt repair_actions = 7;
  repeated DetectorEvaluation final_detector_states = 8;
  repeated string proposed_artifact_ids = 9;
  repeated VerificationEvidence verification_evidence = 10;
  UsageMetrics usage = 11 [(buf.validate.field).required = true];
  TimingMetrics timing = 12 [(buf.validate.field).required = true];
  optional string responder_session_id = 13;
  optional string error = 14;
  LateFindingsPull late_findings_pull = 15;
  repeated ProgramToolCall program_tool_calls = 16;
  repeated ProgramRun program_runs = 17;
  repeated PlanApplication plan_applications = 18;
  int32 response_loops_used = 19;
  bool response_loop_exhausted = 20;
  repeated string program_failure_signals = 21;
  string resolution_path = 22 [(buf.validate.field).string = {in: ["", "responder", "deterministic"]}];
  reserved 23;
  reserved 24;
  reserved 25;
  repeated DriftEvent drift_events = 26;
  // Controller verification at terminal responder completion, never worker authority.
  repeated Finding unresolved_findings = 27;
  DriftReprompt drift_reprompt = 28;
}

// A responder claim that it read controller-published findings during its turn.
// The broker independently checks this against controller-owned evidence.
message LateFindingsPull {
  string incident_id = 1 [(buf.validate.field).string.min_len = 1];
  uint32 pull_count = 2 [(buf.validate.field).uint32.gte = 1];
  repeated string detector_ids = 3 [(buf.validate.field).repeated.items.string.pattern = "^[a-z0-9][a-z0-9_.-]*$"];
  repeated string playbook_ids = 4 [(buf.validate.field).repeated.items.string.pattern = "^[a-z][a-z0-9_-]*$"];
  string report_digest = 5 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
}

// IncidentView is the open incident as the controller's state ConfigMap
// publishes it.
message IncidentView {
  string incident_id = 1 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp observed_at = 2 [(buf.validate.field).required = true];
  repeated string blocking_detectors = 3;
  repeated Finding blocking_findings = 4;
  repeated Finding clearing_findings = 5;
  StateChanges state_changes = 6;
  repeated DriftEvent drift_events = 7;
}

// DetectorTimelineEntry summarizes one finding's firing history within an
// incident window; carried in the incident closure. Mirrors the Go runtime struct.
message DetectorTimelineEntry {
  option (buf.validate.message).cel = {
    id: "timeline.last_seen_after_first"
    message: "last_seen_at must not precede first_activated_at"
    expression: "this.last_seen_at >= this.first_activated_at"
  };
  option (buf.validate.message).cel = {
    id: "timeline.cleared_after_first"
    message: "cleared_at must not precede first_activated_at"
    expression: "!has(this.cleared_at) || this.cleared_at >= this.first_activated_at"
  };
  string detector_id = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[a-z0-9][a-z0-9_.-]*$"}];
  string detector_class = 2;
  string owner = 3;
  string rule_id = 4;
  string fingerprint = 5 [(buf.validate.field).string.min_len = 1];
  map<string, ObjectRef> parameter_bindings = 6;
  repeated string surfaced_playbook_ids = 7 [(buf.validate.field).repeated.items.string.pattern = "^[a-z][a-z0-9_-]*$"];
  google.protobuf.Timestamp first_activated_at = 8 [(buf.validate.field).required = true];
  google.protobuf.Timestamp last_seen_at = 9 [(buf.validate.field).required = true];
  optional google.protobuf.Timestamp cleared_at = 10;
  string relation = 11 [(buf.validate.field).string = {in: ["before_dispatch", "after_dispatch", "no_incident"]}];
  int32 activations = 12 [(buf.validate.field).int32.gte = 1];
}

// IncidentClosure is the record the controller hands the broker when an
// incident ends. Mirrors the Go runtime.IncidentClosure struct.
message IncidentClosure {
  IncidentRequest request = 1 [(buf.validate.field).required = true];
  IncidentResult result = 2;
  optional string dispatch_error = 3;
  repeated DetectorEvaluation final_detector_states = 4;
  repeated DetectorEvaluation incident_detector_states = 5;
  repeated DetectorTimelineEntry detector_timeline = 6;
  bool incident_detector_fired_before_dispatch = 7;
  bool incident_detector_fired_after_dispatch = 8;
  bool no_incident_detector_fired = 9;
  StateChanges final_state_changes = 10;
  google.protobuf.Timestamp detected_at = 11 [(buf.validate.field).required = true];
  google.protobuf.Timestamp dispatched_at = 12 [(buf.validate.field).required = true];
  google.protobuf.Timestamp responder_completed_at = 13 [(buf.validate.field).required = true];
  google.protobuf.Timestamp verified_at = 14 [(buf.validate.field).required = true];
  optional google.protobuf.Timestamp health_cleared_at = 15;
  reserved 16, 17, 18;
  reserved "observed_state_changes";
  reserved "detector_review_required_at", "detector_review_reason";
  repeated string cleaned_helpers = 19;
  string observation_generation = 20;
  // Confirmed per-finding observations on a failed closure; never global health authority.
  repeated DetectorEvaluation partial_detector_states = 21;
  bool verified_while_responder_running = 22;
  google.protobuf.Duration closure_stability_window = 23;
  // Set when the closure-time recheck never saw a complete observation window
  // within its bound. Final states moved to partial; the outcome is unverified.
  ClosureUnconfirmedReason unconfirmed_reason = 24;
  string unconfirmed_detail = 25;
  // Source checks that never became available before the recheck bound (the
  // accepted source would not render, the inventory did not load). Information
  // only: health alone decided the closure.
  repeated string source_check_notes = 26;
}

// ClosureUnconfirmedReason explains why a verified closure was committed
// unconfirmed instead of superseded. Incomplete is "not yet", never a contradiction.
enum ClosureUnconfirmedReason {
  CLOSURE_UNCONFIRMED_REASON_UNSPECIFIED = 0;
  CLOSURE_UNCONFIRMED_REASON_OBSERVATION_INCOMPLETE = 1;
  // An observer stayed unavailable (timeout, API 5xx, unsynced) until the bound.
  CLOSURE_UNCONFIRMED_REASON_OBSERVER_UNAVAILABLE = 2;
}

// Controller-owned evidence from one response stage. Finding credit describes
// a fresh scoped observation; independent controller verification owns closure.
message StageReport {
  string stage = 1 [(buf.validate.field).string.min_len = 1];
  repeated StageMitigation mitigations = 2;
  repeated string remaining_finding_fingerprints = 3;
  string error = 4;
  repeated string cleared_finding_fingerprints = 5;
}

message StageMitigation {
  string playbook_id = 1 [(buf.validate.field).string.min_len = 1];
  string program_revision = 2;
  repeated Binding bindings = 3;
  string plan_id = 4;
  PlanApplication apply_receipt = 5;
  string result = 6 [(buf.validate.field).string = {in: ["applied_cleared", "applied_still_matching", "rollout_failed", "rollout_pending_at_handoff", "apply_error", "skipped"]}];
  string skip_reason = 7 [(buf.validate.field).string = {in: ["", "multiple_entry_points", "no_mitigation", "unbound_parameter", "diagnose_no_longer_matches", "diagnose_unavailable", "unexplained_coverage", "already_attempted", "repair_policy", "stage_budget", "plan_not_executable"]}];
  ProgramRun post_apply_diagnose = 8;
  repeated string cleared_finding_fingerprints = 9;
  repeated string remaining_finding_fingerprints = 10;
  string error = 11;
  // One stage apply covers several attempts; apply_receipt is that whole
  // application. These select this attempt's actions in apply_receipt.plan.
  int32 plan_action_start = 12;
  int32 plan_action_count = 13;
}

// Controller-owned evidence of the single optional healthy source-drift turn.
message DriftReprompt {
  int32 findings_before = 1 [(buf.validate.field).int32.gt = 0];
  // Absent until a post-turn verification is available.
  optional int32 findings_after = 2 [(buf.validate.field).int32.gte = 0];
}
