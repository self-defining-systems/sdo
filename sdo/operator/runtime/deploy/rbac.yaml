apiVersion: v1
kind: ServiceAccount
metadata:
  name: sdo-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sdo-controller
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  # The isolated synthetic-traffic prober pod, its Service and its NetworkPolicy.
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Read-only observation for the healthy-state baseline. Secret values are
  # reduced to digests in memory and never logged or sent to a responder.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sdo-controller
subjects:
  - kind: ServiceAccount
    name: sdo-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sdo-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sdo-responder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sdo-responder
rules:
  # Generic namespace-scoped edit on application resources, shaped like Kubernetes'
  # built-in `edit` ClusterRole rather than around any particular repair. It omits
  # Secrets (their values must never reach a model) and RBAC objects. Unlike `edit`,
  # it grants pods/exec, pods/attach and pods/portforward: exec parity with the
  # Codex baseline. Exec can read secrets mounted into
  # a pod; that trade-off is accepted.
  - apiGroups: [""]
    resources: ["configmaps", "services", "pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
  # kubectl exec, attach and port-forward: `create` for the SPDY/WebSocket upgrade, `get` for older clients.
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach", "pods/portforward"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sdo-responder
subjects:
  - kind: ServiceAccount
    name: sdo-responder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sdo-responder
