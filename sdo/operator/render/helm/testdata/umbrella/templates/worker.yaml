{{- $ctx := . -}}
{{- $redis := include "gs.global" (dict "key" "redisHost" "ctx" $ctx) | trim -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gs.fullname" . }}-{{ .Values.worker.name }}
spec:
  serviceName: {{ .Values.worker.name }}
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
      - name: worker
        image: {{ required "global.registry is required" .Values.global.registry }}/worker:{{ .Values.global.imageTag }}
        command: [{{ include (printf "gs.kind.%s" .Values.worker.kind) . | quote }}]
        env:
        - {name: REDIS_HOST, value: {{ $redis | quote }}}
        - {name: IDLE_TIMEOUT, value: {{ duration (int64 3600) | quote }}}
