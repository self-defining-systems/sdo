apiVersion: sdo.dev/v1alpha1
kind: DetectorManifest
sdkVersion: v0.1
detectors:
  - id: missing-configmap
    package: ./detectors/missing_configmap
    constructor: New
    class: incident
    owner: responder
    watches:
      - apiVersion: apps/v1
        kind: Deployment
      - apiVersion: v1
        kind: ConfigMap
    interval: 30s
    persistence:
      firing: 2
      clearing: 2
    batching:
      severity: critical
      debounce: 500ms
    possiblePlaybooks:
      - .sdo/playbooks/missing-configmap/README.md
    originatingIncident: missing-configmap-fixture
    originatingCommit: fixture123
