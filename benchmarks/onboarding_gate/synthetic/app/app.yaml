apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-code
  namespace: NAMESPACE
data:
  server.py: |
SERVER_PY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels: {app: notes}
  template:
    metadata:
      labels: {app: notes}
    spec:
      containers:
        - name: notes
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: [python3, /app/server.py]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          volumeMounts: [{name: code, mountPath: /app}]
      volumes:
        - name: code
          configMap: {name: notes-code}
---
apiVersion: v1
kind: Service
metadata:
  name: notes
  namespace: NAMESPACE
spec:
  selector: {app: notes}
  ports: [{name: http, port: 8080, targetPort: 8080}]
