apiVersion: sdo.dev/v1alpha1
kind: DetectorManifest
sdkVersion: v0.1
id: traffic-health
constructor: New
class: health
owner: health_judge
watches:
    - apiVersion: sdo.dev/v1alpha1
      kind: SyntheticTraffic
interval: 10s
persistence:
    firing: 2
    clearing: 2
batching:
    severity: critical
    debounce: 500ms
possiblePlaybooks:
    - .sdo/playbooks/health-objective/README.md
originatingCommit: lifecycle-bootstrap
