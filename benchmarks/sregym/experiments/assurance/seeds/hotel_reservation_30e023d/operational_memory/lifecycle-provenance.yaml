    \t\t}\n\t\tfor _, ref := range sdk.ConfigMapReferencesForDeployment(deployment)\
    \ {\n\t\t\tif ref.Optional {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tif !hasConfigMap(snapshot.ConfigMaps(),\
    \ deployment.Namespace, ref.Name) {\n\t\t\t\tfindings = append(findings, healthFinding(\n\
    \t\t\t\t\t\"required-configmap-missing\",\n\t\t\t\t\t\"A required deployment ConfigMap\
    \ reference is missing\",\n\t\t\t\t\tfmt.Sprintf(\"deployment %s/%s requires ConfigMap\
    \ %s\", deployment.Namespace, deployment.Name, ref.Name),\n\t\t\t\t\tsdk.ObjectRef{APIVersion:\
    \ \"v1\", Kind: \"ConfigMap\", Namespace: deployment.Namespace, Name: ref.Name},\n\
    \t\t\t\t))\n\t\t\t}\n\t\t}\n\t\tif !isRequiredDeployment(deployment.Name) {\n\t\
    \t\tcontinue\n\t\t}\n\t\tdesired := int32(1)\n\t\tif deployment.Spec.Replicas\
    \ != nil {\n\t\t\tdesired = *deployment.Spec.Replicas\n\t\t}\n\t\tif deployment.Status.AvailableReplicas\
    \ < desired {\n\t\t\tfindings = append(findings, healthFinding(\n\t\t\t\t\"deployment-unavailable\"\
    ,\n\t\t\t\t\"A required deployment has unavailable replicas\",\n\t\t\t\tfmt.Sprintf(\n\
    \t\t\t\t\t\"deployment %s/%s has %d/%d available replicas\",\n\t\t\t\t\tdeployment.Namespace,\n\
    \t\t\t\t\tdeployment.Name,\n\t\t\t\t\tdeployment.Status.AvailableReplicas,\n\t\
    \t\t\t\tdesired,\n\t\t\t\t),\n\t\t\t\tsdk.ObjectRefFrom(\"Deployment\", \"apps/v1\"\
    , &deployment),\n\t\t\t))\n\t\t}\n\t}\n\tfor _, name := range sortedNames(requiredDeployments)\
    \ {\n\t\tif _, ok := deployments[name]; !ok {\n\t\t\tfindings = append(findings,\
    \ healthFinding(\"deployment-missing\", \"A required deployment is missing\",\
    \ fmt.Sprintf(\"deployment %s/%s is absent\", snapshot.Namespace(), name), sdk.ObjectRef{APIVersion:\"\
    apps/v1\", Kind:\"Deployment\", Namespace:snapshot.Namespace(), Name:name}))\n\
    \t\t}\n\t}\n\tservices := make(map[string]struct{})\n\tfor _, service := range\
    \ snapshot.Services() {\n\t\tif service.Namespace == snapshot.Namespace() { services[service.Name]\
    \ = struct{}{} }\n\t\tif !isRequiredService(service.Name) {\n\t\t\tcontinue\n\t\
    \t}\n\t\tif !sdk.ServiceExpectsEndpoints(service) {\n\t\t\tcontinue\n\t\t}\n\t\
    \tif snapshot.ReadyEndpointCountForService(service.Namespace, service.Name) ==\
    \ 0 {\n\t\t\tfindings = append(findings, healthFinding(\n\t\t\t\t\"service-without-ready-endpoints\"\
    ,\n\t\t\t\t\"A selected service has no ready endpoints\",\n\t\t\t\tfmt.Sprintf(\"\
    service %s/%s has zero ready endpoints\", service.Namespace, service.Name),\n\t\
    \t\t\tsdk.ObjectRefFrom(\"Service\", \"v1\", &service),\n\t\t\t))\n\t\t}\n\t}\n\
    \tfor _, name := range sortedNames(requiredServices) {\n\t\tif _, ok := services[name];\
    \ !ok {\n\t\t\tfindings = append(findings, healthFinding(\"service-missing\",\
    \ \"A required service is missing\", fmt.Sprintf(\"service %s/%s is absent\",\
    \ snapshot.Namespace(), name), sdk.ObjectRef{APIVersion:\"v1\", Kind:\"Service\"\
    , Namespace:snapshot.Namespace(), Name:name}))\n\t\t}\n\t}\n\tfor _, policy :=\
    \ range snapshot.NetworkPolicies() {\n\t\tif !policySelectsRequiredWorkload(policy.Spec.PodSelector.MatchLabels)\
    \ {\n\t\t\tcontinue\n\t\t}\n\t\tisolatesIngress := false\n\t\tisolatesEgress :=\
    \ false\n\t\tfor _, policyType := range policy.Spec.PolicyTypes {\n\t\t\tisolatesIngress\
    \ = isolatesIngress || policyType == networkingv1.PolicyTypeIngress\n\t\t\tisolatesEgress\
    \ = isolatesEgress || policyType == networkingv1.PolicyTypeEgress\n\t\t}\n\t\t\
    if isolatesIngress && len(policy.Spec.Ingress) == 0 && isolatesEgress && len(policy.Spec.Egress)\
    \ == 0 {\n\t\t\tfindings = append(findings, healthFinding(\n\t\t\t\t\"network-policy-total-isolation\"\
    ,\n\t\t\t\t\"A network policy completely isolates selected application pods\"\
    ,\n\t\t\t\tfmt.Sprintf(\"networkpolicy %s/%s denies all ingress and egress\",\
    \ policy.Namespace, policy.Name),\n\t\t\t\tsdk.ObjectRefFrom(\"NetworkPolicy\"\
    , \"networking.k8s.io/v1\", &policy),\n\t\t\t))\n\t\t}\n\t}\n\treturn findings,\
    \ nil\n}\n\nfunc hasConfigMap(configMaps []corev1.ConfigMap, namespace, name string)\
    \ bool {\n\tfor _, cm := range configMaps { if cm.Namespace == namespace && cm.Name\
    \ == name { return true } }\n\treturn false\n}\n\nfunc sortedNames(values map[string]struct{})\
    \ []string {\n\tnames := make([]string, 0, len(values))\n\tfor name := range values\
    \ { names = append(names, name) }\n\tsort.Strings(names)\n\treturn names\n}\n\n\
    func healthFinding(ruleID string, summary string, evidence string, resource sdk.ObjectRef)\
    \ sdk.Finding {\n\treturn sdk.Finding{\n\t\tDetectorID: \"health-objective\",\
    \ RuleID: ruleID, Status: sdk.FindingActive,\n\t\tSeverity: sdk.SeverityCritical,\
    \ Summary: summary, Evidence: evidence,\n\t\tPrimaryResource: resource,\n\t\t\
    Playbooks: []string{\".sdo/playbooks/health-objective/README.md\"},\n\t\tFingerprint:\
    \ \"health-objective/\" + ruleID + \"/\" + resource.Namespace + \"/\" + resource.Name,\n\
    \t}\n}\n"
  detector_test_source: "package objective\n\nimport (\n\t\"context\"\n\t\"testing\"\
    \n\n\tappsv1 \"k8s.io/api/apps/v1\"\n\tcorev1 \"k8s.io/api/core/v1\"\n\tmetav1\
    \ \"k8s.io/apimachinery/pkg/apis/meta/v1\"\n\t\"sdo.dev/operator/sdk\"\n\t\"\
    sdo.dev/operator/sdk/sdktest\"\n)\n\nfunc TestDetectReportsUnavailableRequiredDeploymentAndIgnoresNearMiss(t\
    \ *testing.T) {\n\treplicas := int32(1)\n\tfindings, err := (Detector{}).Detect(context.Background(),\
    \ sdktest.Snapshot{\n\t\tNamespaceName: \"demo\",\n\t\tDeploymentList: []appsv1.Deployment{\n\
    \t\t\t{ObjectMeta: metav1.ObjectMeta{Name: \"frontend\", Namespace: \"demo\"},\
    \ Spec: appsv1.DeploymentSpec{Replicas: &replicas}},\n\t\t\t{ObjectMeta: metav1.ObjectMeta{Name:\
    \ \"unrelated-workload\", Namespace: \"demo\"}, Spec: appsv1.DeploymentSpec{Replicas:\
    \ &replicas}},\n\t\t},\n\t})\n\tif err != nil { t.Fatal(err) }\n\tif !hasFinding(findings,\
    \ \"deployment-unavailable\", \"frontend\") { t.Fatalf(\"expected frontend unavailable:\
    \ %#v\", findings) }\n\tif hasFinding(findings, \"deployment-unavailable\", \"\
    unrelated-workload\") { t.Fatalf(\"unrelated deployment reported: %#v\", findings)\
    \ }\n}\n\nfunc TestDetectSkipsExternalNameAliasesForEndpointReadiness(t *testing.T)\
    \ {\n\tfindings, err := (Detector{}).Detect(context.Background(), sdktest.Snapshot{\n\
    \t\tNamespaceName: \"demo\",\n\t\tServiceList: []corev1.Service{{ObjectMeta: metav1.ObjectMeta{Name:\
    \ \"jaeger\", Namespace: \"demo\"}, Spec: corev1.ServiceSpec{Type: corev1.ServiceTypeExternalName,\
    \ ExternalName: \"jaeger.example\"}}},\n\t})\n\tif err != nil { t.Fatal(err) }\n\
    \tif hasFinding(findings, \"service-without-ready-endpoints\", \"jaeger\") { t.Fatalf(\"\
    ExternalName alias reported for endpoints: %#v\", findings) }\n}\n\nfunc TestDetectRequiresNonOptionalConfigMapReferences(t\
    \ *testing.T) {\n\treplicas := int32(1)\n\tdeployment := appsv1.Deployment{\n\t\
    \tObjectMeta: metav1.ObjectMeta{Name: \"frontend\", Namespace: \"demo\"},\n\t\t\
    Spec: appsv1.DeploymentSpec{Replicas: &replicas, Template: corev1.PodTemplateSpec{Spec:\
    \ corev1.PodSpec{Volumes: []corev1.Volume{{Name: \"required\", VolumeSource: corev1.VolumeSource{ConfigMap:\
    \ &corev1.ConfigMapVolumeSource{LocalObjectReference: corev1.LocalObjectReference{Name:\
    \ \"needed\"}}}}, {Name: \"optional\", VolumeSource: corev1.VolumeSource{ConfigMap:\
    \ &corev1.ConfigMapVolumeSource{LocalObjectReference: corev1.LocalObjectReference{Name:\
    \ \"optional-cm\"}, Optional: boolPtr(true)}}}}}}},\n\t\tStatus: appsv1.DeploymentStatus{AvailableReplicas:\
    \ 1},\n\t}\n\tfindings, err := (Detector{}).Detect(context.Background(), sdktest.Snapshot{NamespaceName:\
    \ \"demo\", DeploymentList: []appsv1.Deployment{deployment}})\n\tif err != nil\
    \ { t.Fatal(err) }\n\tif !hasFinding(findings, \"required-configmap-missing\"\
    , \"needed\") { t.Fatalf(\"required ConfigMap absence not reported: %#v\", findings)\
    \ }\n\tif hasFinding(findings, \"required-configmap-missing\", \"optional-cm\"\
    ) { t.Fatalf(\"optional ConfigMap reported: %#v\", findings) }\n\tfindings, err\
    \ = (Detector{}).Detect(context.Background(), sdktest.Snapshot{NamespaceName:\
    \ \"demo\", DeploymentList: []appsv1.Deployment{deployment}, ConfigMapList: []corev1.ConfigMap{{ObjectMeta:\
    \ metav1.ObjectMeta{Name: \"needed\", Namespace: \"demo\"}}}})\n\tif err != nil\
    \ { t.Fatal(err) }\n\tif hasFinding(findings, \"required-configmap-missing\",\
    \ \"needed\") { t.Fatalf(\"present ConfigMap reported missing: %#v\", findings)\
    \ }\n}\n\nfunc boolPtr(value bool) *bool { return &value }\n\nfunc hasFinding(findings\
    \ []sdk.Finding, rule, name string) bool {\n\tfor _, finding := range findings\
    \ { if finding.RuleID == rule && finding.PrimaryResource.Name == name { return\
    \ true } }\n\treturn false\n}\n"
