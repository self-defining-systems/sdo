  - content: "package generators\n\nimport \"sdo.dev/operator/sdk/traffic\"\n\n\
      func Scenarios() traffic.Catalog {\n\treturn traffic.Catalog{\n\t\t{\n\t\t\t\
      ID: \"hotel-search\",\n\t\t\tDescription: \"Search nearby hotels for a valid\
      \ date range and render availability and hotel profiles.\",\n\t\t\tTarget: traffic.Target{Service:\
      \ \"frontend\", Port: 5000},\n\t\t\tDependsOn: []string{\"frontend\", \"search\"\
      , \"geo\", \"reservation\", \"profile\", \"mongodb-geo\", \"mongodb-reservation\"\
      , \"mongodb-profile\"},\n\t\t\tSideEffect: traffic.SideEffectRead,\n\t\t\tSteps:\
      \ []traffic.Step{{Name: \"search\", Endpoint: traffic.GET(\"/hotels\", traffic.Params{\"\
      inDate\": traffic.Const(\"2015-04-09\"), \"outDate\": traffic.Const(\"2015-04-10\"\
      ), \"lat\": traffic.Const(\"37.7867\"), \"lon\": traffic.Const(\"-122.4112\"\
      )}).Contains(\"FeatureCollection\")}},\n\t\t\tDetects: []traffic.FaultClass{traffic.FaultWrongBody},\n\
      \t\t},\n\t\t{\n\t\t\tID: \"hotel-recommendations\",\n\t\t\tDescription: \"Request\
      \ distance-ranked hotel recommendations and their profiles.\",\n\t\t\tTarget:\
      \ traffic.Target{Service: \"frontend\", Port: 5000},\n\t\t\tDependsOn: []string{\"\
      frontend\", \"recommendation\", \"profile\", \"mongodb-recommendation\", \"\
      mongodb-profile\"},\n\t\t\tSideEffect: traffic.SideEffectRead,\n\t\t\tSteps:\
      \ []traffic.Step{{Name: \"recommend\", Endpoint: traffic.GET(\"/recommendations\"\
      , traffic.Params{\"require\": traffic.Const(\"dis\"), \"lat\": traffic.Const(\"\
      37.7867\"), \"lon\": traffic.Const(\"-122.4112\")}).Contains(\"FeatureCollection\"\
      )}},\n\t\t\tDetects: []traffic.FaultClass{traffic.FaultWrongBody},\n\t\t},\n\
      \t\t{\n\t\t\tID: \"user-login-check\",\n\t\t\tDescription: \"Exercise the user\
      \ credential lookup endpoint with a non-empty account pair.\",\n\t\t\tTarget:\
      \ traffic.Target{Service: \"frontend\", Port: 5000},\n\t\t\tDependsOn: []string{\"\
      frontend\", \"user\", \"mongodb-user\"},\n\t\t\tSideEffect: traffic.SideEffectRead,\n\
      \t\t\tSteps: []traffic.Step{{Name: \"login\", Endpoint: traffic.GET(\"/user\"\
      , traffic.Params{\"username\": traffic.Const(\"sdo-synthetic\"), \"password\"\
      : traffic.Const(\"sdo-synthetic\")}).Contains(\"message\")}},\n\t\t\tDetects:\
      \ []traffic.FaultClass{traffic.FaultWrongBody},\n\t\t},\n\t}\n}\n"
