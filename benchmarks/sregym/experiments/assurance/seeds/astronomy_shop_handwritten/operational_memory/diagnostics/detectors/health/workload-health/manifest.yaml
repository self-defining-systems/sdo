apiVersion: sdo.dev/v1alpha1
kind: DetectorManifest
sdkVersion: v0.1
id: workload-health
constructor: New
class: health
owner: health_judge
watches:
    - apiVersion: v1
      kind: Pod
    - apiVersion: apps/v1
      kind: Deployment
    - apiVersion: apps/v1
      kind: ReplicaSet
    - apiVersion: v1
      kind: Event
interval: 15s
persistence:
    firing: 2
    clearing: 2
batching:
    severity: critical
    debounce: 500ms
possiblePlaybooks:
    - health-objective
originatingCommit: lifecycle-bootstrap
