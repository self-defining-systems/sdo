# Example SDO experiment: two identical source-backed incidents answered by SDO
# with Codex gpt-6-luna. Stage 0 starts cold from a fresh application workspace.
# Stage 1 retains the application repository from stage 0 so the second response
# sees accumulated .sdo/ outcomes, playbooks, and incident detectors.
#
# Usage:
#   bash scripts/run_sregym.sh benchmarks/sregym/experiments/sdo_example.toml
#
# Pair with codex_baseline_example.toml for a memoryless comparison arm, and check
# parity first:
#   uv run python -m benchmarks.sregym.runner.preflight \
#       benchmarks/sregym/experiments/sdo_example.toml \
#       benchmarks/sregym/experiments/codex_baseline_example.toml
#
# Before running, build the controller, responder, and validator images referenced
# under [defaults.agent_config.sdo_codex] into your local Docker image store (or
# replace the tags with images from your own registry), and create the
# credentials secret they name.

[pipeline]
name = "sdo-codex-luna-reuse"

[defaults]
agent = "sdo_codex"
model = "gpt-6-luna"
reasoning_effort = "medium"  # explicit on both arms; SDO pins its incident agents to medium
parallel = 1
agent_timeout = 3600
app_filter = "hotel_reservation"
deploy_from_source = true
application_workspace = "persistent"
require_strict_receipt = true

[defaults.env]
judge_model_id = "codex-gpt-6-luna"  # Codex CLI judge; reasoning effort defaults to xhigh
worker_cpu_limit = "3"
kind_worker_nodes = 1  # 1 control plane + 1 worker per lane
reuse_cluster = true
force_recreate_cluster = false
preserve_infrastructure = true
cleanup_defer_timeout_seconds = 4200
docker_builder = "sdo-example"  # name of a local docker buildx builder; change to yours

[defaults.variants]
enabled = false

[defaults.agent_config.sdo_codex]
backend = "agent-cli"
provider = "codex"
model = "gpt-6-luna"
timeout_sec = 3600
controller_image = "sdo-controller:v0.1.0"
responder_image = "sdo-sregym-responder:v0.1.0"
validator_image = "sdo-detector-validator:v0.1.0"
credentials_secret = "sdo-agent-credentials"
# Explicit source tree deployed by SREGym's hotel adapter; required for accepted-source lookup.
deployed_manifest_paths = ["kubernetes"]
# Opt in to agent-free incident resolution by trusted playbook programs.
program_fast_path = true
# Require this many independently verified successful repairs before trusting a program.
program_trust_threshold = 3

[[stages]]
name = "first-incident"
chain_application_workspace = false

[stages.runner]
problems = ["missing_configmap_hotel_reservation"]

[[stages]]
name = "reused-incident"
chain_application_workspace = true

[stages.runner]
problems = ["missing_configmap_hotel_reservation"]
