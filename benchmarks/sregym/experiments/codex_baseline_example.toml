# Example memoryless Codex baseline for the SDO comparison in sdo_example.toml.
# Run it once per attempt, each in a new log dir:
#   bash scripts/run_sregym.sh benchmarks/sregym/experiments/codex_baseline_example.toml
# Everything that affects grading or timing matches the SDO arm: model,
# source-backed hotel deployment, judge, worker CPU limit, and kind cluster.

[runner]
agent = "codex"
model = "gpt-6-luna"
reasoning_effort = "medium"  # explicit on both arms; SDO pins its incident agents to medium
parallel = 1
agent_timeout = 3600
app_filter = "hotel_reservation"
deploy_from_source = true
problems = ["missing_configmap_hotel_reservation"]

[runner.env]
judge_model_id = "codex-gpt-6-luna"  # Codex CLI judge; reasoning effort defaults to xhigh
worker_cpu_limit = "3"
kind_worker_nodes = 1  # 1 control plane + 1 worker per lane
reuse_cluster = true
force_recreate_cluster = false
preserve_infrastructure = true
source_build_cache = true  # reuses the app image while its build context is unchanged
docker_builder = "sdo-example"  # name of a local docker buildx builder; change to yours

[agent.codex]
verify_protocol = "none"  # pin stock: the Codex baseline otherwise defaults to "concise" verify
