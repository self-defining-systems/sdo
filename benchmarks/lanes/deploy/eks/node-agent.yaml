# The node agent of an EKS lane: a kube-system DaemonSet that keeps every node's containerd registry mirror current
# (an ECR token from the node's instance role, refreshed before it expires) and is where node-level writes go
# (`eks-lane.sh nodes`, the EKS analog of `docker exec <kind node>`). @ECR@, @REGION@, @PREFIX@ and @UPSTREAMS@
# (space-separated registries) are replaced by deploy/eks-lane.sh. Applications keep their declared image names: the
# mirror tries ECR first and falls back to the upstream.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sdo-lane-node-agent
  namespace: kube-system
  labels: {app.kubernetes.io/name: sdo-lane-node-agent}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: sdo-lane-node-agent}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 100%}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sdo-lane-node-agent}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations: [{operator: Exists}]
      terminationGracePeriodSeconds: 1
      containers:
        - name: agent
          image: public.ecr.aws/aws-cli/aws-cli:2.22.35
          imagePullPolicy: IfNotPresent
          securityContext: {runAsUser: 0}
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 256Mi}
          command:
            - sh
            - -c
            - |
              set -u
              # prepull: pull every image of the lane's list (ConfigMap sdo-lane-prepull, key images, one reference per
              # line; `eks-lane.sh prepull` writes it) into the node's containerd through the mirror, once per node, so the
              # first row does not pay the pulls. A node that joins later pulls the same list as soon as its agent starts.
              # The node's own ctr runs chrooted into the node's root (/host), so it uses the node's libc: this image's
              # libc is older than the one the node's ctr is linked against, which a bind-mounted ctr cannot load.
              prepull() {
                [ -s /prepull/images ] && [ -x /host/usr/bin/ctr ] || return 0
                while read -r ref; do
                  [ -n "$ref" ] || continue
                  grep -qxF "$ref" /lane/prepulled 2>/dev/null && continue
                  user=""
                  case $ref in
                    *.dkr.ecr.*.amazonaws.com/*) user="--user AWS:$(aws ecr get-login-password --region "@REGION@")";;
                  esac
                  t0=$(date +%s)
                  if timeout 600 chroot /host /usr/bin/ctr -n k8s.io images pull --hosts-dir /etc/containerd/certs.d $user "$ref" > /lane/prepull.log 2>&1; then
                    echo "$ref" >> /lane/prepulled
                    echo "prepulled $ref in $(( $(date +%s) - t0 )) s"
                  else
                    echo "prepull of $ref failed: $(tail -c 200 /lane/prepull.log)" >&2
                  fi
                done < /prepull/images
              }
              refreshed=0
              while true; do
                if [ $(( $(date +%s) - refreshed )) -ge 21600 ]; then
                  if token=$(aws ecr get-login-password --region "@REGION@"); then
                    auth=$(printf 'AWS:%s' "$token" | base64 | tr -d '\n')
                    for up in @UPSTREAMS@; do
                      case $up in
                        docker.io) server=https://registry-1.docker.io;;
                        *) server=https://$up;;
                      esac
                      mirror=https://@ECR@/v2/@PREFIX@/$up
                      mkdir -p /certs/$up
                      printf 'server = "%s"\n\n[host."%s"]\n  capabilities = ["pull", "resolve"]\n  override_path = true\n  [host."%s".header]\n    Authorization = "Basic %s"\n' \
                        "$server" "$mirror" "$mirror" "$auth" > /certs/$up/hosts.toml.tmp
                      mv /certs/$up/hosts.toml.tmp /certs/$up/hosts.toml
                    done
                    date +%s > /certs/.sdo-mirror-refreshed
                    refreshed=$(date +%s)
                  else
                    echo 'ECR token refresh failed; retrying' >&2
                    sleep 30
                    continue
                  fi
                fi
                prepull
                sleep 20
              done
          readinessProbe:
            exec:
              command: [sh, -c, "find /certs/.sdo-mirror-refreshed -mmin -480 | grep -q ."]
            periodSeconds: 10
          volumeMounts:
            - {name: certs, mountPath: /certs}
            - {name: lane, mountPath: /lane}
            - {name: prepull, mountPath: /prepull}
            - {name: host, mountPath: /host, readOnly: true}
      volumes:
        - name: certs
          hostPath: {path: /etc/containerd/certs.d, type: DirectoryOrCreate}
        - name: lane
          hostPath: {path: /var/lib/sdo-lane, type: DirectoryOrCreate}
        - name: prepull
          configMap: {name: sdo-lane-prepull, optional: true}
        - name: host
          hostPath: {path: /, type: Directory}
