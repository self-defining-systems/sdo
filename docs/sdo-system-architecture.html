html &gt; body {

  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);

  font-weight: var(--font-weight-normal);

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);

  font-weight: var(--viz-font-weight-medium);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;

h1 {

  font-weight: var(--font-weight-medium);

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;

  font-family: var(--font-mono);

  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-small,

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {

}

.btn-primary {

  background: var(--foreground);

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {

.form-label {

  margin-bottom: 6px;

}

  min-height: 28px;
  padding: 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  background: var(--secondary);
  cursor: inherit;

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

  padding: 3px;

  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-control:disabled,

  cursor: not-allowed;
  opacity: 0.4;

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;

    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

  outline: 2px solid var(--ring);
  outline-offset: 2px;

  cursor: not-allowed;
  pointer-events: none;

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {

}

.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);

  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

}

.form-range {
  appearance: none;
  display: block;
  width: 100%;

  background: linear-gradient(

  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected

  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;sdo-architecture-walkthrough&quot; aria-label=&quot;Interactive SDO architecture walkthrough&quot;&gt;
  &lt;style&gt;
    #sdo-architecture-walkthrough {
      color: var(--foreground);
      width: 100%;
      padding: 0.25rem 0;
    }

    #sdo-architecture-walkthrough .sdo-proof-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    #sdo-architecture-walkthrough .sdo-step-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }

    #sdo-architecture-walkthrough .sdo-progress-line {
      display: grid;
      grid-template-columns: auto minmax(7rem, 1fr);
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    #sdo-architecture-walkthrough progress {
      width: 100%;
      accent-color: var(--primary);
    }

    #sdo-architecture-walkthrough .sdo-map {
      width: 100%;
      display: block;
      overflow: visible;
    }

    #sdo-architecture-walkthrough .sdo-map text {
      fill: var(--foreground);
      font-family: inherit;
      font-size: 15px;
      font-weight: 400;
      pointer-events: none;
    }

    #sdo-architecture-walkthrough .sdo-map .sdo-lane-label {
      fill: var(--muted-foreground);
      font-size: 13px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    #sdo-architecture-walkthrough .sdo-lane-band {
      fill: color-mix(in srgb, var(--muted) 42%, transparent);
    }

    #sdo-architecture-walkthrough .sdo-node rect {
      fill: var(--card);
      stroke: var(--border);
      stroke-width: 1.5;
      transition: fill 180ms ease, stroke 180ms ease, opacity 180ms ease;
    }

    #sdo-architecture-walkthrough .sdo-node text {
      fill: var(--card-foreground);
      transition: opacity 180ms ease;
    }

    #sdo-architecture-walkthrough .sdo-node .sdo-node-subtitle {
      fill: var(--muted-foreground);
      font-size: 12px;
    }

    #sdo-architecture-walkthrough .sdo-node:not(.is-active) {
      opacity: 0.42;
    }

    #sdo-architecture-walkthrough .sdo-node.is-active rect {
      fill: color-mix(in srgb, var(--viz-series-1) 19%, var(--card));
      stroke: var(--viz-series-1);
      stroke-width: 2.5;
    }

    #sdo-architecture-walkthrough .sdo-edge {
      fill: none;
      stroke: var(--border);
      stroke-width: 2;
      opacity: 0.38;
      transition: stroke 180ms ease, opacity 180ms ease, stroke-width 180ms ease;
    }

    #sdo-architecture-walkthrough .sdo-edge.is-active {
      stroke: var(--viz-series-1);
      stroke-width: 3;
      opacity: 1;
    }

    #sdo-architecture-walkthrough .sdo-store-rail {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.5rem;
      margin-top: 0.35rem;
      margin-bottom: 0.75rem;
    }

    #sdo-architecture-walkthrough .sdo-store {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 0;
      padding: 0.45rem 0;
      border-top: 2px solid var(--border);
      color: var(--muted-foreground);
      transition: border-color 180ms ease, color 180ms ease;
    }

    #sdo-architecture-walkthrough .sdo-store.is-active {
      border-color: var(--viz-series-1);
      color: var(--foreground);
    }

    #sdo-architecture-walkthrough .sdo-mobile-flow {
      display: none;
      margin: 0.5rem 0 0.75rem;
    }

    #sdo-architecture-walkthrough .sdo-mobile-step {
      display: grid;
      grid-template-columns: 2rem minmax(0, 1fr);
      gap: 0.5rem;
      padding: 0.5rem 0.4rem;
      border-left: 3px solid var(--border);
      color: var(--muted-foreground);
    }

    #sdo-architecture-walkthrough .sdo-mobile-step.is-active {
      border-left-color: var(--viz-series-1);
      color: var(--foreground);
      background: color-mix(in srgb, var(--viz-series-1) 10%, transparent);
    }

    #sdo-architecture-walkthrough .sdo-detail {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
    }

    #sdo-architecture-walkthrough .sdo-detail h2 {
      margin-top: 0;
      margin-bottom: 0.35rem;
    }

    #sdo-architecture-walkthrough .sdo-detail p {
      margin: 0;
    }

    #sdo-architecture-walkthrough .sdo-boundary-list {
      display: grid;
      gap: 0.5rem;
    }

    #sdo-architecture-walkthrough .sdo-boundary-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 0.45rem;
      align-items: start;
    }

    @media (max-width: 560px) {
      #sdo-architecture-walkthrough .sdo-map {
        display: none;
      }

      #sdo-architecture-walkthrough .sdo-mobile-flow {
        display: grid;
      }

      #sdo-architecture-walkthrough .sdo-store-rail,
      #sdo-architecture-walkthrough .sdo-detail {
        grid-template-columns: 1fr 1fr;
      }

      #sdo-architecture-walkthrough .sdo-detail &gt; :first-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 380px) {
      #sdo-architecture-walkthrough .sdo-store-rail,
      #sdo-architecture-walkthrough .sdo-detail {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #sdo-architecture-walkthrough .sdo-node rect,
      #sdo-architecture-walkthrough .sdo-node text,
      #sdo-architecture-walkthrough .sdo-edge,
      #sdo-architecture-walkthrough .sdo-store {
        transition: none;
      }
    }

      &lt;rect width=&quot;128&quot; height=&quot;80&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
      &lt;text text-anchor=&quot;middle&quot; x=&quot;64&quot; y=&quot;28&quot;&gt;Same-session&lt;/text&gt;
      &lt;text text-anchor=&quot;middle&quot; x=&quot;64&quot; y=&quot;46&quot;&gt;reflection&lt;/text&gt;
      &lt;text class=&quot;sdo-node-subtitle&quot; text-anchor=&quot;middle&quot; x=&quot;64&quot; y=&quot;65&quot;&gt;Learn detector/playbook&lt;/text&gt;
    &lt;/g&gt;
    &lt;g class=&quot;sdo-node&quot; data-node=&quot;finalize&quot; transform=&quot;translate(752 402)&quot;&gt;
      &lt;rect width=&quot;128&quot; height=&quot;80&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
      &lt;text text-anchor=&quot;middle&quot; x=&quot;64&quot; y=&quot;27&quot;&gt;Roll out + ack&lt;/text&gt;
      &lt;text text-anchor=&quot;middle&quot; x=&quot;64&quot; y=&quot;45&quot;&gt;clean + evidence&lt;/text&gt;
      &lt;text class=&quot;sdo-node-subtitle&quot; text-anchor=&quot;middle&quot; x=&quot;64&quot; y=&quot;64&quot;&gt;Optional benchmark receipt&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;sdo-mobile-flow&quot; aria-label=&quot;Architecture flow for small screens&quot;&gt;
    &lt;div class=&quot;sdo-mobile-step&quot; data-mobile-step=&quot;0&quot;&gt;&lt;strong&gt;1&lt;/strong&gt;&lt;span&gt;Deployed source commit and objective → fresh read-only topology session&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sdo-mobile-step&quot; data-mobile-step=&quot;1&quot;&gt;&lt;strong&gt;2&lt;/strong&gt;&lt;span&gt;Independent health judges author deterministic Go checks&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sdo-mobile-step&quot; data-mobile-step=&quot;2&quot;&gt;&lt;strong&gt;3&lt;/strong&gt;&lt;span&gt;Isolated compilation → Git-backed operational memory&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sdo-mobile-step&quot; data-mobile-step=&quot;3&quot;&gt;&lt;strong&gt;4&lt;/strong&gt;&lt;span&gt;Kubernetes snapshots → detector → Lease-backed controller&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sdo-mobile-step&quot; data-mobile-step=&quot;4&quot;&gt;&lt;strong&gt;5&lt;/strong&gt;&lt;span&gt;Broker worktree → one hardened Codex responder Job&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sdo-mobile-step&quot; data-mobile-step=&quot;5&quot;&gt;&lt;strong&gt;6&lt;/strong&gt;&lt;span&gt;Live repair → independent detector clear → sandbox validation&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sdo-mobile-step&quot; data-mobile-step=&quot;6&quot;&gt;&lt;strong&gt;7&lt;/strong&gt;&lt;span&gt;Proposal + outcome → same-session reflection → learned memory&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sdo-mobile-step&quot; data-mobile-step=&quot;7&quot;&gt;&lt;strong&gt;8&lt;/strong&gt;&lt;span&gt;Controller rollout → acknowledgement → cleanup → optional benchmark receipt&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;sdo-store-rail&quot; aria-label=&quot;Durable system stores&quot;&gt;
    &lt;div class=&quot;sdo-store&quot; data-store=&quot;git&quot;&gt;&lt;i data-lucide=&quot;git-commit-horizontal&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Git history&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sdo-store&quot; data-store=&quot;state&quot;&gt;&lt;i data-lucide=&quot;database&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;ConfigMap state&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sdo-store&quot; data-store=&quot;lease&quot;&gt;&lt;i data-lucide=&quot;key-round&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Leader Lease&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sdo-store&quot; data-store=&quot;pvc&quot;&gt;&lt;i data-lucide=&quot;hard-drive&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;PVC + Jobs&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card sdo-detail&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;text-small text-muted&quot; data-phase-label&gt;Definition plane&lt;/div&gt;
      &lt;h2 data-step-title&gt;Inspect the deployed source and human objective&lt;/h2&gt;
      &lt;p data-step-copy&gt;After the source deployer creates an attributable running commit, a fresh read-only topology session inventories source-backed resources and explains the application architecture.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;sdo-boundary-list text-small&quot;&gt;
      &lt;div class=&quot;sdo-boundary-item&quot;&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Trust boundary:&lt;/strong&gt; &lt;span data-boundary&gt;The model may inspect, but it cannot deploy, repair, or declare health.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;sdo-boundary-item&quot;&gt;&lt;i data-lucide=&quot;save&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Durable effect:&lt;/strong&gt; &lt;span data-durable&gt;A structured topology handoff tied to the source commit and objective.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;sdo-architecture-walkthrough&#x27;);
      if (!root) return;

      const steps = [
        {
          phase: &#x27;Definition plane&#x27;,
          title: &#x27;Inspect the deployed source and human objective&#x27;,
          copy: &#x27;After the source deployer creates an attributable running commit, a fresh read-only topology session inventories source-backed resources and explains the application architecture.&#x27;,
          boundary: &#x27;The model may inspect, but it cannot deploy, repair, or declare health.&#x27;,
          durable: &#x27;A structured topology handoff tied to the source commit and objective.&#x27;,
          nodes: [&#x27;source&#x27;, &#x27;deployer&#x27;],
          edges: [&#x27;source-deployer&#x27;],
          stores: []
        },
        {
          phase: &#x27;Definition plane&#x27;,
          title: &#x27;Author an independent definition of health&#x27;,
          copy: &#x27;Three rounds of fresh Codex health-judge sessions refine objective-specific Go detection logic and tests. Corrections also use fresh sessions; each receives the trusted deployer inventory but never the deployer conversation.&#x27;,
          boundary: &#x27;The deployer describes the system; independent judges define health. No responder or SREGym verdict is allowed to become the health oracle.&#x27;,
          durable: &#x27;Candidate detector source, tests, architecture summary, and unique session provenance.&#x27;,
          nodes: [&#x27;deployer&#x27;, &#x27;judge&#x27;],
          edges: [&#x27;deployer-judge&#x27;],
          stores: []
        },
        {
          phase: &#x27;Definition plane&#x27;,
          title: &#x27;Validate and commit operational memory&#x27;,
          copy: &#x27;Every candidate is compiled and tested in isolation. Only the fully validated final detector, playbooks, architecture, and lifecycle provenance enter the .sdo Git history.&#x27;,
          boundary: &#x27;Generated code is untrusted until the tokenless, network-bounded controller validation subprocess passes.&#x27;,
          durable: &#x27;One atomic lifecycle commit containing validated operational memory.&#x27;,
          nodes: [&#x27;judge&#x27;, &#x27;validator&#x27;, &#x27;memory&#x27;],
          edges: [&#x27;judge-validator&#x27;, &#x27;validator-memory&#x27;],
          stores: [&#x27;git&#x27;]
        },
        {
          phase: &#x27;Runtime plane&#x27;,
          title: &#x27;Detect a persistent fault deterministically&#x27;,
          copy: &#x27;Kubernetes informers feed snapshots to the generated Go detector. Persistence, clearing, and debounce policies convert observations into one durable incident.&#x27;,
          boundary: &#x27;No LLM participates in the continuous monitoring loop or decides whether the system is currently healthy.&#x27;,
          durable: &#x27;A Lease-guarded ConfigMap records detector state, fingerprints, incident identity, dispatch state, and pending closure.&#x27;,
          nodes: [&#x27;memory&#x27;, &#x27;cluster&#x27;, &#x27;detector&#x27;, &#x27;controller&#x27;],
          edges: [&#x27;memory-controller&#x27;, &#x27;cluster-detector&#x27;, &#x27;detector-controller&#x27;],
          stores: [&#x27;state&#x27;, &#x27;lease&#x27;]
        },
        {
          phase: &#x27;Runtime plane&#x27;,
          title: &#x27;Dispatch exactly one repair agent&#x27;,
          copy: &#x27;The broker creates an isolated Git worktree on the shared PVC. The controller starts one hardened Kubernetes Job running Codex CLI with the incident evidence and relevant playbooks.&#x27;,
          boundary: &#x27;The responder may repair source and live state, but .sdo memory stays read-only before independent verification.&#x27;,
          durable: &#x27;Incident-derived Job identity, PVC worktree, result ConfigMap, and persisted in-flight lifecycle.&#x27;,
          nodes: [&#x27;controller&#x27;, &#x27;broker&#x27;, &#x27;responder&#x27;],
          edges: [&#x27;controller-broker&#x27;, &#x27;broker-responder&#x27;],
          stores: [&#x27;state&#x27;, &#x27;lease&#x27;, &#x27;pvc&#x27;]
        },
        {
          phase: &#x27;Closure plane&#x27;,
          title: &#x27;Verify the repair independently&#x27;,
          copy: &#x27;The responder applies its fix, but its success claim is not trusted. The original Go detector must become clear with no fingerprints, then isolated validation checks the proposed source change.&#x27;,
          boundary: &#x27;The agent proposes the repair; the deterministic health judge decides whether it worked.&#x27;,
          durable: &#x27;Clear detector history, independent verification evidence, and a validated repair candidate.&#x27;,
          nodes: [&#x27;responder&#x27;, &#x27;cluster&#x27;, &#x27;detector&#x27;, &#x27;clear&#x27;, &#x27;closure-validation&#x27;],
          edges: [&#x27;responder-cluster&#x27;, &#x27;detector-clear&#x27;, &#x27;clear-validation&#x27;],
          stores: [&#x27;state&#x27;, &#x27;lease&#x27;, &#x27;pvc&#x27;]
        },
        {
          phase: &#x27;Closure plane&#x27;,
          title: &#x27;Commit the result and teach the system&#x27;,
          copy: &#x27;The broker commits the repair proposal and verified outcome, then resumes the exact responder Codex session to author fault-specific playbooks, incident detectors, and tests while reporting stale architecture for deployer upkeep.&#x27;,
          boundary: &#x27;Reflection starts only after the repair is verified and the outcome is durable. Reflected code must pass the same isolated canary and compile gates.&#x27;,
          durable: &#x27;Distinct proposal, outcome, and validated same-session reflection commits with incident provenance.&#x27;,
          nodes: [&#x27;closure-validation&#x27;, &#x27;proposal&#x27;, &#x27;outcome&#x27;, &#x27;reflection&#x27;, &#x27;validator&#x27;, &#x27;memory&#x27;],
          edges: [&#x27;validation-proposal&#x27;, &#x27;proposal-outcome&#x27;, &#x27;outcome-reflection&#x27;, &#x27;judge-validator&#x27;, &#x27;validator-memory&#x27;],
          stores: [&#x27;git&#x27;, &#x27;state&#x27;, &#x27;pvc&#x27;]
        },
        {
          phase: &#x27;Closure plane&#x27;,
          title: &#x27;Roll out, acknowledge, clean, and prove&#x27;,
          copy: &#x27;If detector code changed, the accepted controller is rebuilt and exercised. A durable acknowledgement then removes the incident worktree; the SREGym adapter may derive a strict receipt from that state.&#x27;,
          boundary: &#x27;Cleanup cannot happen before commits, validation, rollout evidence, and acknowledgement are durable.&#x27;,
          durable: &#x27;Structured rollout return code, acknowledgement marker, zero remaining worktrees, and optional benchmark receipt.&#x27;,
          nodes: [&#x27;memory&#x27;, &#x27;controller&#x27;, &#x27;reflection&#x27;, &#x27;finalize&#x27;],
          edges: [&#x27;memory-controller&#x27;, &#x27;reflection-final&#x27;],
          stores: [&#x27;git&#x27;, &#x27;state&#x27;, &#x27;lease&#x27;, &#x27;pvc&#x27;]
        }
      ];

      const buttons = Array.from(root.querySelectorAll(&#x27;[data-step-button]&#x27;));
      const nodes = Array.from(root.querySelectorAll(&#x27;[data-node]&#x27;));
      const edges = Array.from(root.querySelectorAll(&#x27;[data-edge]&#x27;));
      const stores = Array.from(root.querySelectorAll(&#x27;[data-store]&#x27;));
      const mobileSteps = Array.from(root.querySelectorAll(&#x27;[data-mobile-step]&#x27;));
      const progress = root.querySelector(&#x27;progress&#x27;);
      const mapDesc = root.querySelector(&#x27;#sdo-map-desc&#x27;);

      function selectStep(index) {
        const step = steps[index];
        if (!step) return;
        const activeNodes = new Set(step.nodes);
        const activeEdges = new Set(step.edges);
        const activeStores = new Set(step.stores);

        buttons.forEach((button, buttonIndex) =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, buttonIndex === index ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
        nodes.forEach((node) =&gt; node.classList.toggle(&#x27;is-active&#x27;, activeNodes.has(node.dataset.node)));
        edges.forEach((edge) =&gt; {
          const active = activeEdges.has(edge.dataset.edge);
          edge.classList.toggle(&#x27;is-active&#x27;, active);
          edge.setAttribute(&#x27;marker-end&#x27;, active ? &#x27;url(#sdo-arrow-active)&#x27; : &#x27;url(#sdo-arrow-neutral)&#x27;);
        });
        stores.forEach((store) =&gt; store.classList.toggle(&#x27;is-active&#x27;, activeStores.has(store.dataset.store)));
        mobileSteps.forEach((item, itemIndex) =&gt; {
          const active = itemIndex === index;
          item.classList.toggle(&#x27;is-active&#x27;, active);
          if (active) item.setAttribute(&#x27;aria-current&#x27;, &#x27;step&#x27;);
          else item.removeAttribute(&#x27;aria-current&#x27;);
        });

        root.querySelector(&#x27;[data-step-count]&#x27;).textContent = `Step ${index + 1} of ${steps.length}`;
        root.querySelector(&#x27;[data-phase-label]&#x27;).textContent = step.phase;
        root.querySelector(&#x27;[data-step-title]&#x27;).textContent = step.title;
        root.querySelector(&#x27;[data-step-copy]&#x27;).textContent = step.copy;
        root.querySelector(&#x27;[data-boundary]&#x27;).textContent = step.boundary;
        root.querySelector(&#x27;[data-durable]&#x27;).textContent = step.durable;
        progress.value = index + 1;
        mapDesc.textContent = `${step.title}. ${step.copy}`;
      }

      buttons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; selectStep(Number(button.dataset.stepButton)));
      });

      selectStep(0);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
